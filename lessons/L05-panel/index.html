ttle(receipt, 'channelIgnored'); return }\n```\n\n`reply` handler 的 `retry: [5000, 300_000]`；`behind` 只在同票同会话且更早消息失败 <3 次时阻塞。`Passes.pumpOnce` 每 2 秒先 `effects.kick()` 再 `engine.evaluateDue()`。\n\n## 3. 实验 A · atomic + enqueue 模拟器\n\n```js\nlet rows = [], callbacks = [], depth = 0, seq = 0;\nfunction atomic(work) {\n  const rowMark = rows.length, cbMark = callbacks.length;\n  depth++;\n  let out;\n  try {\n    out = work();\n    depth--;\n    callbacks.splice(cbMark).forEach(fn => fn());   // 只在提交后 flush\n    return out;\n  } catch (e) {\n    rows.length = rowMark; callbacks.length = cbMark;\n    depth--; throw e;\n  }\n}\nfunction enqueue(kind, key, payload) {\n  callbacks.push(() => {\n    const i = rows.findIndex(r => r.kind === kind && r.key === key);\n    if (i >= 0) Object.assign(rows[i], { value: payload, generation: rows[i].generation + 1, attempts: 0 });\n    else rows.push({ kind, key, value: payload, seq: ++seq, generation: 0, attempts: 0 });\n  });\n}\ntry { atomic(() => { enqueue('reply', 'm1', { a: 1 }); throw new Error('rollback'); }); } catch (_) {}\nconsole.log('回滚后行数 =', rows.length);                         // 0\natomic(() => { enqueue('reply', 'm1', { a: 1 }); enqueue('reply', 'm1', { a: 2 }); });\nconsole.log(rows);                                                // 1 行，generation 1，value a:2，seq 不变\natomic(() => enqueue('launch', 'a1', {}));\nconsole.log('总行数 =', rows.length);                             // 2\n```\n\n**断言**：回滚后 0 行；同 `(kind,key)` 二次入队只改 value / generation、不新增行、不重排 seq。\n\n## 4. 实验 B · 幂等 outbox + 退避\n\n```js\nconst receipts = new Map(), sent = [];\nconst FAIL = 3, BASE = 5000, MAX = 300000;\nconst delay = a => Math.min(MAX, BASE * 2 ** Math.min(a, 16));\nfunction add(id, msg) {\n  if (receipts.has(id)) return false;\n  receipts.set(id, { id, ...msg, status: 'pending', attempts: 0 });\n  return true;\n}\nfunction settle(id, status) {\n  const r = receipts.get(id);\n  if (!r) receipts.set(id, { id, status, attempts: 0 });  // 缺行重建 → id 永久占用\n  else r.status = status;\n}\nfunction deliver(id, outcome) {\n  const r = receipts.get(id);\n  if (!r || r.status !== 'pending') return 'skip';         // 终态幂等\n  if (outcome === 'sent') { sent.push(id); settle(id, 'sent'); return 'sent'; }\n  if (outcome === 'gone') { settle(id, 'dropped'); return 'dropped(channelGone)'; }\n  if (outcome === 'waiting') return 'Later(attempts 不变)';\n  r.attempts++;\n  return 'retry in ' + delay(r.attempts) + 'ms, attempts=' + r.attempts;\n}\nconsole.log(add('m1', { text: 'ack' }), deliver('m1', 'sent'), add('m1', { text: 'ack' }), deliver('m1', 'sent'));\nconsole.log('sent =', sent);                                  // ['m1'] 只发一次\nadd('m2', { text: 'gone case' });\nconsole.log(deliver('m2', 'gone'), add('m2', {}), deliver('m2', 'sent')); // dropped 后 false + skip\nadd('m3', { text: 'flaky' });\nconsole.log(deliver('m3', 'error'), deliver('m3', 'waiting'), deliver('m3', 'error'));\n```\n\n**断言**：同 id 只发一次；`dropped` 后再 `add` 仍 false；`waiting` 不增 attempts；普通失败 5s→20s 退避（中间那次 Later 不计数）。\n\n## 5. 自检清单\n\n- [ ] 能说出 stage 表 7 行的顺序及「首行命中」的含义。\n- [ ] 能解释 `afterCommit` 为什么不能替代 `Effects`。\n- [ ] 能写出 `(kind,key)` 合并时哪些字段变、哪些不变。\n- [ ] 能说明 `behind` 的作用范围与 3 次阈值。\n- [ ] 能列出 restart 后留存的四类东西（Session / 目录 / 订阅 / 待投递消息 + effect 行）。\n\n## 6. 回到动态演示\n\n| 步骤 | 对应源码 |\n|---|---|\n| 1 stage 派生 | `src/core/stage.ts:ticketStage` |\n| 3–4 事务边界 | `src/core/ports.ts`、`src/app/store.ts:atomic` |\n| 5 心跳 | `src/app/passes.ts:pumpOnce` |\n| 13–14 收据 + effect | `src/app/outbox.ts:send`、`src/app/store.ts:receipts.add` |\n| 15 保序 | `src/app/outbox.ts:deliver`、`receipts.behind` |\n| 20 三分 | `src/app/effects.ts:attempt` |\n| 21 恢复 | `src/executor/dsh.ts:resume`、`docs/003:144-152` |\n","doc":"# 003 Execution\n\nThis document follows an accepted Ticket through execution, delivery and recovery. It builds on [001 Domain model](001-domain.md) and [002 Authorization](002-authorization.md).\n\n## Ticket stages\n\nEach open Ticket has one stage, determined by what it is waiting for. Read the table from top to bottom; the first matching row wins.\n\n| Stage | Condition | Panel label |\n| --- | --- | --- |\n| person / delivery | Delivering an Input to the Executor Session failed; it is retried after 2 seconds, then after a delay that doubles up to a minute, and a success, a new Assignment or the Ticket's end clears it | Input undelivered |\n| person / answer | It has an Attention | Awaiting answer |\n| person / review | The latest Report is `ready` | Awaiting review |\n| person / blocked, failed | The latest Report is `blocked` or `failed`, and no person's message reached the Ticket since | Blocked · Failed |\n| working / queued | No Assignment, or a pending one | Queued |\n| idle | The latest Report is `waiting`, or the Assignment ended | Waiting for a Trigger |\n| working | Everything else | Working |\n\nA `person` stage means the Ticket cannot continue without human input. A new human message releases a `blocked` or `failed` Ticket to its Executor, so it moves to the next matching stage, usually `working`.\n\nAn `idle` Ticket has finished its turn without an outstanding question. A Trigger on a subscribed Thread can continue it.\n\n## The Executor\n\nEach Ticket gets an Executor Session named `worker-<ticket id>` and a directory named after the Ticket's short name. Directories are created under the configured execution root, which defaults to `<stateDir>/work`.\n\nExecutor Sessions run commands without approval as the operator's OS user. Their `dsh-superagent-worker` preset contains the tools needed for work and moves foreground shell commands to background jobs after 5 seconds. This lets a worker receive new messages at the next step instead of waiting for a long command to finish.\n\nThe main Session uses `dsh-superagent-router`, with the same 5-second shell and job-wait limits and a smaller tool set for routing. Sessions retain the preset selected at creation. Worker subagents use DeepSeek Harness's `standard` preset.\n\n### Background work and worker slots\n\nWhen a turn ends with shell jobs or subagents still running, the Ticket keeps its worker slot and stays working. It is not reported as waiting, and the main Session receives no waiting report. A completed job or subagent wakes the Executor with its result in the same slot. Once a turn ends with no background work, the Executor reports waiting normally.\n\nAfter each turn, background work has at most 30 minutes to finish. At that limit, shell jobs are killed and the Ticket is reported waiting. The report includes the Executor's last words and which jobs were killed or subagents remain active. Subagents are allowed to continue. The Executor reads killed-job results on its next turn.\n\nA handoff to a person frees the slot immediately and leaves the Report in effect. This applies after a `ready` Report or a question, unless another Input arrived since, and after any `blocked` or `failed` Report.\n\nAt handoff, subagents stop. Shell jobs, such as a server offered for review, may continue until the Assignment ends. They hold no slot and are exempt from the 30-minute limit, including after later turns. Their completion does not wake the Executor; it reads the results on its next turn.\n\nA person can also start a turn by writing directly in the Executor Session. Its background work follows the same rules.\n\nWhen an Assignment ends, its shell jobs are killed without waking the Session. Its subagents are released, and any completion turns they wake are dropped. The replacement Assignment and its waiting Inputs start after that shutdown finishes.\n\nStopping or restarting the plugin inside the DeepSeek Harness process uses the same shutdown path. Inputs not yet taken into Session history are retained. Shutdown waits up to 10 seconds for each worker's background work; a process restart ends that work outright. An Assignment interrupted while busy restarts with a recovery note.\n\nWorker subagents, including nested ones, use DeepSeek Harness's `standard` preset with the worker's permissions. They retain only the worker's allowed work tools, and lose those tools when the Ticket ends. Under `standard`, a shell command moves to the background after 60 seconds. A subagent's jobs are killed when it ends.\n\n### Preparing a Ticket directory\n\nBefore the first Assignment, if the Ticket directory does not exist, the prepare command runs once with `sh` in the execution root. It has ten minutes to finish. Without a prepare command, the worker starts in an empty directory.\n\nA failed command fails the Ticket and records its output. A retry or a person's message on one of the Ticket's Threads tries preparation again. A typical command uses `git worktree` to create a checkout. A pull request belongs to the Ticket when its branch's last path segment matches the Ticket's short name.\n\n### Concurrency\n\nA Ticket holds a worker slot from the start of a launch, including preparation, or from the delivery that wakes its idle Executor. It also holds the slot throughout an active turn.\n\nThe configured concurrency limit applies to these slots, with one extra slot for a person's message or a status request. Such a wake can use the extra slot when normal slots are full, and takes the next free slot before a new launch. New work therefore cannot prevent a person from continuing an existing Ticket.\n\nOther Inputs, such as CI results, wait for a normal slot. A launch waits in `working / queued` until a slot is free. Launches run concurrently, so a slow prepare command delays only its own Ticket.\n\n### Execution variables\n\nThe prepare command and Executor instructions receive the same execution variables. The command reads environment variables; the Executor reads their values and descriptions in its prompt. None contains credentials.\n\n| Variable | Registered by | Value |\n| --- | --- | --- |\n| `DSH_SUPERAGENT_DIR`, `DSH_SUPERAGENT_NAME`, `DSH_SUPERAGENT_TICKET` | Executor | The Ticket's directory, short name and id |\n| `DSH_SUPERAGENT_BLOCKED_COMMANDS` | Executor | Commands the Executor may not run |\n| `DSH_SUPERAGENT_GITHUB_REPOSITORY` | GitHub | The repository the Source watches, `owner/name` |\n| `DSH_SUPERAGENT_GITHUB_ACCOUNT`, `DSH_SUPERAGENT_GITHUB_COMMIT_EMAIL` | GitHub | The agent account and its commit email |\n| `DSH_SUPERAGENT_GITHUB_NUMBER`, `DSH_SUPERAGENT_GITHUB_PR_HEAD` | GitHub | The Issue or pull request that started the Ticket, and its head ref when it is a pull request |\n| `DSH_SUPERAGENT_FEISHU_BOT`, `DSH_SUPERAGENT_FEISHU_CHAT` | Feishu | The bot, and the chat that started the Ticket |\n\nTicket-specific values come from its directory and originating Trigger. Other values come from the current deployment settings. Only the panel can change execution environment settings; text sent to the main Session cannot change the configured shell command.\n\nWorkers reach GitHub through the agent account's `gh` and Feishu through the bot's `lark-cli`. Blocked commands fail when invoked by name.\n\nThese wrappers and directories establish defaults, not a security boundary. A worker can still execute a program by absolute path.\n\n## Merging\n\nAuto-merge is governed by the **Delivery requirements** prompt. The host has no merge-specific decision logic.\n\nBy default, the Executor never enables auto-merge as the agent account: GitHub attributes the merge to whoever enabled it. Delivery requirements must name another account's CLI for merging. Without one, people merge the pull request.\n\nThe default instructions allow auto-merge only for a pull request opened for the Ticket, when it is ready, the required approvals cover the head commit, and additions plus deletions total fewer than 200 lines. Before pushing another revision, the Executor withdraws auto-merge.\n\nReviews without a body, such as approvals, also arrive as Triggers and can wake an Executor waiting for review. These instructions govern the agent, not GitHub's merge rules. To enforce approvals, require them in branch protection and dismiss stale approvals. Omit the merge CLI or remove the auto-merge paragraph to require manual merging.\n\n## How a Ticket ends\n\n- **Ready without a pull request:** a `ready` Report ends the Ticket as completed.\n- **Nothing to do:** an Executor that finds no work for a person to act on, such as a request that does not reproduce or is superseded, reports `dropped`. The Ticket ends without a message, unless a matched rule asks for one, and a person's later message on its Threads resumes it.\n### Pull requests\n\nA Ticket follows the pull request it started from once its Executor reports it. It also follows each pull request opened from its branch once reported by the Executor or found by the GitHub Source. Reopened pull requests are followed again.\n\nThe Ticket is done when none of the pull requests it opened remain open. If it opened none, all pull requests it follows must be closed. It then ends with the outcome of the last relevant close and keeps its Subscriptions, allowing a later human comment to resume it.\n\nA close does not end the Ticket while resumed, retried or recovered work is unfinished. It also waits if the Executor acknowledged or answered a follow-up it owns but has not since made a non-progress Report or ended a turn after reading that message. A later `ready` Report ends the Ticket once the same pull-request completion rule is satisfied.\n\nChat Channels receive one final notice about the pull-request outcome. GitHub already displays the outcome on the pull request itself. Removing a Ticket's Subscription to a pull request also stops it following that pull request.\n\n\"Awaiting review\" therefore means a `ready` Report with a pull request.\n\n### Follow-ups and context Threads\n\nThe Executor decides human follow-ups on its Ticket's own Threads. It handles in-scope requests and hands back requests beyond its scope or for another Ticket. Once no Executor owns the message, it becomes a candidate for the main Session. The main Session may otherwise act on the follow-up only to stop work at the person's request.\n\nAn Input counts as read after the Session takes it into a step and subsequently reports or ends a turn. When a Ticket ends, unread messages that were not acknowledged, answered or handed back return to Eval, as described in [002 Authorization](002-authorization.md). Read messages left without action, such as thanks, do not.\n\nThreads followed only for context still deliver messages, but do not give the Ticket ownership of human follow-ups or resume ended Tickets. Those messages can be assessed independently.\n\nSources poll subscribed Threads while a live Ticket subscribes, and for two weeks after the later of the last Trigger and the subscribing Tickets' end. Afterwards, messages arrive only through ordinary intake: GitHub notifications or Feishu live events.\n\n## Failure and recovery\n\n### Executor blocked or failed\n\nWhen an Executor Session reports `blocked` or `failed`, or fails to start or errors, which records `failed`, the Ticket takes no automatic Input.\n\nA passing failure of the model provider or the network, an HTTP 408, 429 or 5xx or a refused, reset or timed-out connection, is tried again first, three times with a growing backoff: a launch runs again, and a worker whose turn failed is told to go on; a failed prepare command is not tried again.\n\nOnce failed, CI and bot messages are recorded on it, but they are not delivered and do not wake the Session.\n\nIts tools stay available, so a person can continue in the Session directly.\n\nA launch that failed is not tried again on its own.\n\nA person's message, a later Report that is neither `blocked` nor `failed`, or a retry ends the hold.\n\nIt is worked out from the stored Reports and Inputs, so a restart keeps it.\n### Retry\n\nAvailable while an open Ticket is in `person / delivery`, `person / blocked` or `person / failed`: a new Assignment, which starts its worker again and takes the Inputs that wait, is the remedy for each.\n\nOnce a person's message reached a blocked or failed Ticket, the Executor has the message, so the Ticket shows as working, or as queued when a failed launch starts again, and offers no retry, unless delivering that message failed.\n\nA retry ends the current Assignment and starts a new one in the same Executor Session, directory, branch and pull request.\n\nThe Executor model applies only when a Session is created; an existing Session keeps its model.\n### Restart\n\nRunning Assignments end with \"host restarted\" and new ones start with a recovery note that tells the Executor to check its directory, git history and GitHub before repeating any outside action, oldest Ticket first.\n\nAssignments that are waiting, ready, blocked or failed stay as they are, unless an Input reached them after that Report, in which case they start again too.\n\nSessions, directories, Subscriptions, pending messages and the stored work below survive a restart, and so does the record of which messages each Executor Session took into its history, which a step does once it claimed them and before its model call: a message taken by a turn the restart cut off counts as read once a Report or the end of a turn follows, while one a step claimed but a cancel or error cut off before the history counts as unread.\n\nA retry or a restart gives the new Assignment again the messages delivered to the Assignment it replaces that its Executor Session did not take, which a cancel or a cut-off step may have dropped; a copy still waiting in the Session, kept by a restart or persisted across a crash, is taken out before the new Assignment's first message, so the new delivery is the only copy.\n### Stored work\n\nWhat dsh-superagent does after a decision, such as relaying a candidate, a follow-up or a report to the main Session, launching an Assignment or delivering an Input, is stored first and done afterwards.\n\nA relay or a delivery that fails, such as when its Session cannot be reached, is retried after 2 seconds, then after a delay that doubles up to a minute; a launch that fails fails its Ticket, unless the failure was a passing one, as above.\n\nEach kind of work reports an error among the overview's system problems only after one item failed three times in a row; a failed Input delivery shows on its Ticket instead.\n\nRelays to the main Session keep their order, and so do notices; a failed one holds back the later ones of its kind.\n### Source failure\n\nThe GitHub Source reads each Issue, pull request and Thread on its own: a failed read keeps its error on its Thread, is read again on the next poll, and counts towards an error of the Source, which it reports after three failed polls in a row by default; any successful poll resets the count.\n\nGitHub answers 404 also when the agent lost access to a private repository, so a 404 is retried.\n\nA notified Issue or pull request whose reads keep failing is dropped a day after its first failed read, and at once when GitHub reports it as deleted; it then no longer fails the poll, its Thread keeps the error, and the Source's state names it.\n\nIts read position stays where it was, so a later notification or a poll of its Thread reads what the failed reads missed.\n\nThe Feishu event consumer reports every failure, and polling of subscribed topics keeps each failure on its Thread.\n\nA malformed item in a GitHub list or a Feishu page is skipped, and the Source's state counts it.\n### Channel failure\n\nOutgoing messages are stored and sent as stored work, retried with backoff from 5 seconds, doubling up to 300.\n\nA Ticket's messages to one conversation go out in the order they were queued, so its acknowledgement comes before its later answer or result: a message waits while an earlier one of the same Ticket to the same conversation has not gone out, until that one has failed three times in a row and shows as a problem.\n\nMessages of other Tickets, and messages of no Ticket, do not wait for it.\n\nA message with failed attempts is a system problem until it goes out or is withdrawn.\n\nA message is dropped only when its Source no longer listens to the conversation, or when the Source answers that the conversation can never receive it; while its Source is off, it waits.\n\nThe Sources answer that for a deleted Issue or a locked conversation on GitHub, and for a recalled message or one Feishu no longer finds on Feishu.\n\nA reply to a review comment that no longer exists goes to the pull request's conversation instead.\n\nA dropped message keeps its record, with when and why it was dropped and the Ticket it was for, so it is never queued again; a dropped acknowledgement reads as dropped, not sent.\n### Pause processing\n\nStops dispatch, new Evals, Eval timeouts, Input delivery and replies; a launch already under way waits until processing resumes.\n\nSources keep recording Triggers, and a running Executor turn is not interrupted.\n\nA person's message to an ended Ticket waits: the first pass after the pause resumes the Ticket, if its Mandate holds under the Policy then.\n\nAn Eval in progress does not expire during a pause; its deadline moves later by the pause's length.\n### Invalid configuration\n\nA stored Source configuration that its kind rejects disables that Source instance.\n"},"L04":{"readme":"# L04 · 提示词\n\n> 对应原型原文：`dsh-superagent-prototype/docs/004-prompts.md`\n> 先修：L02（权限由代码强制）、L03（执行环境与 Session 装饰）。\n\n## 这课学什么\n\n提示词在这套系统里不是一堆字符串，而是**版本化配置 + 固定顺序装配 + 每次模型请求注入**的一条流水线。学完要能回答：为什么改提示词文本永远改不了 gate、Mandate、工具检查与账户包装。\n\n三个关键词：8 段装配顺序、`effect:'next-request'`、Default updated。\n\n## 三个问题\n\n1. 为什么 `runtime/policy` 必须放最后，orchestrator 与 worker 的段集合为什么不同？\n2. 保存一个版本后，运行中的 Session 何时、如何看到新版本？\n3. 团队 override 与升级后的 Default updated 怎么处理？\n\n## 课程材料\n\n| 文件 | 用途 |\n|---|---|\n| `README.md` | 本文件 |\n| `TUTORIAL.md` | 精读 `app/prompts.ts` / `versions.ts` / `sessions.ts` / `skill-files.ts` + 2 个实验 |\n| `index.html` + `data.js` | 14 个模块、17 步流转、版本生效状态机、8 个真实代码锚点 |\n\n## 学习路径\n\n1. 读 `docs/004` 的装配顺序、优先级表、版本与升级三段。\n2. 对照 `prompts/orchestrator.md`、`dispatch.md`、`work.md`、`worker.md`、`shared.md` 看内置文本长什么样（每句一行是有原因的）。\n3. 播放动态演示：第 1–5 步是保存，第 6–8 步是 next-request 注入，第 9–13 步是装配与优先级，第 16–17 步是升级与 rebase。\n4. 跑两个实验：8 段装配器、revision + base 模拟器。\n\n## 动态演示怎么看\n\n- 第 6 步 `panel → session` 只发 notice，**不重启、不取消、不唤醒**。\n- 第 7 步是版本生效的唯一时点：`systemPrompt.section` 在下次模型请求回调时重读。\n- 第 13 步特意说明 `runtime/policy` 放最后不是因为权限最高，而是让 Policy 变化不改动前面的 prompt 文本。\n- 状态机把「客户端草稿 phase」与「服务端版本生效」放在一起，注意 `pending → bound` 的分界。\n\n## 验收标准\n\n- [ ] 能按顺序列出 orchestrator 的 8 段装配，并指出 worker 少了哪三段。\n- [ ] 能解释 `[dsh-superagent prompt revision N]` 出现在哪里、由谁注入。\n- [ ] 能说出 `effect:'next-request'` 与 `KV.sessions.prompts` 的关系。\n- [ ] 能复述优先级表的 5 层，并指出最强与最弱分别是谁。\n- [ ] 能解释「把 override 改回默认 = 删除 override」与「省略 base = 保留 base」。\n\n## 与前课的关系\n\n承接 L02 的 Policy / gate、L03 的 Executor 环境与 Session 装饰。新增版本快照、装配器、团队段、override、内置 parts、代码强制事实。\n\n## 易错点速查\n\n| 误解 | 正确理解 |\n|---|---|\n| 保存即生效 / 必须重启 | `Saving does not restart, cancel or wake a Session`；下次请求（含同一 turn 后续 step）生效 |\n| 改提示词能改权限 | gate / Mandates / 工具检查 / 账户包装由代码强制；外部文本只是数据 |\n| 省掉 `base` 就是清空 | 保留已保存的 `base` |\n| 与默认相同是「保留自定义」 | 等于删除 override，反而重新跟随未来默认 |\n| Policy 段最后 = 优先级最高 | 是稳定性考虑；它属于第 2 层「内置与生成段」 |\n\n## 源码坐标\n\n```\ndocs/004-prompts.md              装配顺序 / 优先级 / 版本 / 升级\nsrc/app/prompts.ts               TEAM_SECTIONS / PART_KEYS / promptParts / policySection / savePrompts\nsrc/app/versions.ts              Versions.save（不可变快照 + 指针）\nsrc/app/sessions.ts              decorate / systemPrompt.section / promptFor\nsrc/app/skill-files.ts           promptFile（把 md 合成段落）\nsrc/policy.ts                    policyVersion\ntests/prompts.spec.ts            装配顺序与 override 规则断言\n```\n\n## 下一步\n\nL05 转向人这一侧：面板如何把只读视图、写命令与回刷组织成「尽量少占用注意力」的交互。\n","tutorial":"# L04 代码教程 · 提示词\n\n片段逐字抄自 `dsh-superagent-prototype`。实验代码纯 JS，可直接运行。\n\n## 1. 源码地图\n\n| 路径 | 符号 | 看什么 |\n|---|---|---|\n| `src/app/prompts.ts` | `TEAM_SECTIONS` / `PART_KEYS` / `builtInParts` / `promptParts` | 装配顺序与 15 个 override 键 |\n| `src/app/prompts.ts` | `policySection` / `promptParts` / `savePrompts` / `Prompts.save` | 生成段、版本与校验 |\n| `src/app/versions.ts` | `Versions.save` | 不可变快照 + 指针 |\n| `src/app/sessions.ts` | `decorate` / `systemPrompt.section` / `promptFor` | 版本注入与工具白名单 |\n| `src/app/skill-files.ts` | `promptFile` | 内置文本从 md 装载 |\n| `docs/004-prompts.md` | 优先级表 | 五层优先级 |\n\n## 2. 逐段精读\n\n### 2.1 团队段与内置文本\n\n`src/app/prompts.ts`：\n\n```ts\nexport const TEAM_SECTIONS = ['communication', 'scope', 'delivery'] as const\nexport type TeamSection = typeof TEAM_SECTIONS[number]\n/** Markdown headings for each team section; fixed prompt sections refer to them by these exact names. */\nconst TEAM_HEADINGS: Record<TeamSection, string> = { communication: 'Communication', scope: 'Ticket scope', delivery: 'Delivery requirements' }\n```\n\n固定段按**标题**引用团队段，不复制其内容 —— 升级内置文本时团队内容不必改写。`src/app/skill-files.ts`：\n\n```ts\nexport function promptFile(name: string): string {\n  const paragraphs = packaged('prompts', `${name}.md`).text.trim().split(/\\n(?:[ \\t]*\\n)+/)\n  return paragraphs.map(paragraph => paragraph.split('\\n').map(line => line.trim()).join(' ')).join('\\n')\n}\n```\n\n这解释了为什么 `prompts/*.md` 每句一行：空行分段，段内拼接成一行。\n\n### 2.2 `promptParts` — 顺序就是优先级\n\n```ts\n  return [\n    fixed('runtime/shared'), fixed(`runtime/${role}`),\n    ...TEAM_SECTIONS.map(team),\n    ...['subscriptions', 'replies', role === 'orchestrator' ? 'dispatch' : 'work'].map(name => fixed(`runtime/${name}`)),\n    ...role === 'orchestrator' ? [fixed('runtime/admission')] : [],\n    fixed('runtime/handoff', `runtime/handoff/${role}`),\n```\n\norchestrator 额外有 `runtime/admission` 与末尾的 `runtime/policy`；worker 用 `runtime/work` 且止于 `runtime/environment`。空团队段被 `.filter(part => part.text)` 去掉。`tests/prompts.spec.ts` 直接断言 `parts[role].at(-1).name === 'runtime/policy'`（对 orchestrator）。\n\n### 2.3 `policySection` — 每次请求现算\n\n```ts\n  const line = (text: string) => text.replace(/\\s*\\n\\s*/g, ' ')\n  const rules = settings.policy.rules.filter(rule => rule.enabled).map(({ id, name, instruction }) => `- ${line(name)} (${id}): ${line(instruction)}`)\n  const part = rules.length ? 'runtime/policy' : 'runtime/policy/none'\n  return { key: part, text: fill(builtIn(config, part), { version: policyVersion(settings), mode: settings.eval.mode, rules: rules.join('\\n') }) }\n```\n\n`{version}` 来自 `policyVersion(settings)`（rules + mode + sources 的哈希），所以 Policy 一变，运行中的 Eval 必须丢弃重排（L02）。模板必须保留 `{version}` / `{mode}` / `{rules}`，否则 `promptPlaceholders` 报错。\n\n### 2.4 `systemPrompt.section` — 版本注入的真正位置\n\n`src/app/sessions.ts`：\n\n```ts\n    binding.disposers.push(agent.ctx.systemPrompt.section({ name: 'dsh-superagent-policy', order: 9999, interpolate: false, text: context => {\n      const version = this.promptFor(agent, context.signal !== undefined)\n      const current = ticket && host.store.tickets.get(ticket.id)\n      const composed = host.prompts.compose(version.config, master ? 'orchestrator' : 'worker', current ? host.environment(current) : undefined)\n      return `[dsh-superagent prompt revision ${version.revision}]\\n${composed}\\n${current ? mandateInstructions(current.mandate) : ''}`\n```\n\n`order: 9999` 保证它在最后；`interpolate:false` 防止宿主再解释文本；`promptFor(bind=true)` 把 revision 记进 `KV.sessions.prompts`。因为这是**回调**，同一 turn 的后续 step 也会重新调用，所以一轮对话里也可能换版本。\n\n### 2.5 `Versions.save` 与 override 的三条反直觉规则\n\n`src/app/versions.ts`：\n\n```ts\n  save(make: (revision: number) => V): V {\n    return this.store.atomic(() => {\n      const version = make(this.revision() + 1)\n      this.store.set(this.family(version.revision), version)\n      this.store.set(this.pointer, version.revision)\n      return version\n```\n\n`src/app/prompts.ts:Prompts.save`：\n\n```ts\n      if (!override.text.trim()) throw new UserError('promptPartEmpty', { part: name })\n      const missing = (part.placeholders ?? []).filter(placeholder => !override.text.includes(placeholder))\n      if (missing.length) throw new UserError('promptPlaceholders', { part: name, placeholders: missing.join(', ') })\n      const base = override.base ?? (Object.hasOwn(saved, name) ? saved[name]!.base : undefined) ?? builtInBase(part.text)\n      return override.text === part.text ? [] : [[name, { text: override.text, base }] as const]\n```\n\n三行分别对应：占位符必须保留、省略 `base` 是**保留**已存值、与默认完全相同等于**删除** override。另：升级后已移除 part 的 override 会被静默丢弃，但客户端凭空捏造的 unknown part 会 `unknownPromptPart` 拒绝。校验「never silently truncates text」——超长是拒绝而非截断。\n\n### 2.6 优先级表（`docs/004`）\n\n从强到弱：① 工具与宿主强制的事实；② 内置与生成段；③ 匹配的规则（仅该 Executor）；④ 团队段与技能；⑤ 外部文本（消息 / 评论 / 文档 / 引用，只是数据）。`src/app/sessions.ts` 的 `workOnly` 工具白名单与 `noWait` 守卫就是第 ① 层的证据。\n\n## 3. 实验 A · 8 段装配器\n\n```js\nconst TEAM_SECTIONS = ['communication', 'scope', 'delivery'];\nfunction assemble(role) {\n  const parts = [\n    'runtime/shared', `runtime/${role}`,\n    ...TEAM_SECTIONS.map(t => `team/${t}`),\n    'runtime/subscriptions', 'runtime/replies',\n    `runtime/${role === 'orchestrator' ? 'dispatch' : 'work'}`\n  ];\n  if (role === 'orchestrator') parts.push('runtime/admission');\n  parts.push(`runtime/handoff/${role}`, 'runtime/environment');\n  if (role === 'orchestrator') parts.push('runtime/policy');\n  return parts;\n}\nfunction validateOverride(text, placeholders) {\n  const missing = placeholders.filter(p => !text.includes(p));\n  if (missing.length) throw new Error('promptPlaceholders: ' + missing.join(', '));\n  return true;\n}\nconsole.log('orchestrator:', assemble('orchestrator'));\nconsole.log('worker:', assemble('worker'));\nconsole.log('worker has policy?', assemble('worker').includes('runtime/policy')); // false\nvalidateOverride('v={version} mode={mode} rules={rules}', ['{version}', '{mode}', '{rules}']);\n```\n\n**断言**：worker 不含 `runtime/admission` 与 `runtime/policy`，且以 `runtime/environment` 结尾；orchestrator 以 `runtime/policy` 结尾。删掉一个占位符会抛错。\n\n## 4. 实验 B · revision + base 模拟器\n\n```js\nlet builtIn = 'default-v0';\nlet current = { revision: 0, builtIn };\nlet bound = 0;\nconst overrides = new Map();\n\nfunction save(config, baseRevision) {\n  if (baseRevision !== current.revision) throw new Error('PromptConflict → 409');\n  current = { revision: current.revision + 1, builtIn };\n  return { effect: 'next-request', revision: current.revision };\n}\nfunction modelRequest() {                       // systemPrompt.section 回调\n  bound = current.revision;\n  return `[dsh-superagent prompt revision ${bound}]`;\n}\nfunction setOverride(part, text, base) {\n  if (text === builtIn) { overrides.delete(part); return 'removed: 与默认相同 = 删除 override'; }\n  overrides.set(part, { text, base: base ?? overrides.get(part)?.base ?? builtIn });\n  return 'saved';\n}\nconsole.log(save({ text: 'team' }, 0), 'bound=' + bound);   // 已存但尚未生效\nconsole.log(modelRequest(), 'bound=' + bound);              // 下次请求才绑定\nconsole.log(setOverride('scope', 'our scope'));\nconsole.log('升级前 base =', overrides.get('scope').base);\nbuiltIn = 'default-v1';                                     // 升级改了内置文本\nconsole.log('Default updated?', overrides.get('scope').base !== builtIn); // true\nconsole.log('Keep my text →', setOverride('scope', 'our scope', builtIn)); // rebase base\nconsole.log('Use new default →', setOverride('scope', builtIn));            // 删除 override\n```\n\n**断言**：保存后 `bound` 不变；`modelRequest()` 才追上；升级后 `base !== builtIn` 触发 Default updated；改回与默认相同会删除 override（之后自动跟随未来默认）。\n\n## 5. 自检清单\n\n- [ ] 能写出两种角色的装配差异。\n- [ ] 能指出版本注入的回调位置与 `order` 值。\n- [ ] 能说出优先级表的 5 层及最强 / 最弱项。\n- [ ] 能解释 `base` 省略、与默认相同、unknown part 三种情况的不同结果。\n- [ ] 能解释为什么升级只让「被 override 的段」需要人工处理。\n\n## 6. 回到动态演示\n\n| 步骤 | 对应源码 |\n|---|---|\n| 1–2 保存与同源 | `src/app/http.ts:208-211,75-79` |\n| 3–4 校验与冲突 | `src/app/prompts.ts:164-181,202-215` |\n| 5 版本快照 | `src/app/versions.ts:21-28` |\n| 6–8 next-request | `docs/004:95`、`src/app/sessions.ts:244-249,329-339` |\n| 9 内置文本 | `src/app/skill-files.ts:29-32` |\n| 10–13 装配与优先级 | `src/app/prompts.ts:102-119`、`docs/004:59,65-71` |\n| 16–17 升级 rebase | `src/app/prompts.ts:186-194`、`src/client/prompts.tsx:161-171` |\n","doc":"# 004 Prompts\n\nThis document explains what the agents read, what a team can edit, and when changes take effect. It builds on [000 Philosophy](000-philosophy.md) through [003 Execution](003-execution.md). Prompt text is written in English.\n\n## What a team writes\n\nA team can edit three team sections, add skills, and override every built-in system-prompt part. Most defaults live under `prompts/` and `skills/`. Tool descriptions, notices and cards remain in code and cannot be edited through prompt settings.\n\n| Section | Holds |\n| --- | --- |\n| Communication | When to message people, how messages read, the line that begins every GitHub message (`This is by an automated agent, not a human` by default), how to handle reviews, and which ordinary accounts are review bots |\n| Ticket scope | When a Ticket goes on and when it stops with a draft |\n| Delivery requirements | Evidence in pull requests, the auto-merge condition with its line threshold, and the commit author; without one, the Executor commits as the agent account's no-reply address |\n| Team skills | Knowledge the agents load when they need it, such as an `identities` skill that says which Feishu user is which GitHub account |\n\nThe built-in text covers the roles, tool usage, host mechanics, authorization rules, and the GitHub and Feishu skills. It refers to the team sections by their headings instead of repeating them.\n\n### Built-in parts and templates\n\nOverrides use these keys:\n\n| Parts | Keys |\n| --- | --- |\n| Shared instructions and roles | `runtime/shared`, `runtime/orchestrator`, `runtime/worker` |\n| Working instructions | `runtime/subscriptions`, `runtime/replies`, `runtime/dispatch`, `runtime/work`, `runtime/admission` |\n| Handoff instructions | `runtime/handoff/orchestrator`, `runtime/handoff/worker` |\n| Source skills | `skill/feishu`, `skill/github` |\n| Generated sections | `runtime/environment`, `runtime/policy`, `runtime/policy/none` |\n\nThe generated sections are editable templates. They must retain these placeholders:\n\n- `runtime/environment`: `{variables}`, filled with execution environment lines.\n- `runtime/policy`: `{version}`, `{mode}` and `{rules}`, with one line per enabled rule.\n- `runtime/policy/none`: `{version}` and `{mode}`, used when no rule is enabled.\n\nEditing a part changes the instructions the model receives. It does not change the gate, Mandates, tool checks or account wrappers, which remain enforced by code.\n\nOn an explicit human request, the main Session can also save overrides with `orchestrator_prompts_save`. If a save omits an override's `base`, it keeps the saved base. A removed part already present in the saved configuration is dropped on save; any other unknown part is refused.\n\nAn override records which built-in text it was based on. Upgrades preserve the team's text. If the default changes, the panel marks the part **Default updated** and shows the difference beside the team's text. The team can keep its text, use the new default or edit it. Parts without overrides automatically follow new defaults.\n\nThe main Session can read affected part names in `orchestrator_read prompts`, under `default_changed`.\n\n## Assembly and precedence\n\nThe system prompt is assembled in this order:\n\n1. Shared instructions and the role.\n2. The three team sections.\n3. Subscriptions and replies.\n4. Dispatch for the main Session, or work instructions for an Executor.\n5. `runtime/admission`, for the main Session only.\n6. Handoff instructions.\n7. `runtime/environment`.\n8. `runtime/policy`, for the main Session only.\n\nAdmission instructions come from `prompts/admission.md`. They describe proactive assessment and when an irrelevant candidate can be ignored from its card. `orchestrator_eval` returns context rather than repeating these instructions.\n\nThe environment section gives the main Session deployment-wide values and each Executor its Ticket-specific values. The Policy section is regenerated from settings on every model request. It contains the Policy version, accept mode, the explicit-request exemption, and enabled rules as `- <name> (<id>): <instruction>`, or a statement that none is enabled. It is last so a Policy change leaves the preceding prompt text unchanged.\n\nExecutors also read DeepSeek Harness's coding prompt and the repository's `AGENTS.md`; the main Session does not. An inferred Ticket adds a final note limiting its Executor to the matched rules. Assignments and incoming messages arrive inline as Trigger cards, with resource pointers only for truncated content.\n\nExecutors work unattended. Their tools exclude those that ask a person, present UI to them or change the profile, such as `ask_user_question`, `present` and `plugin_manager`.\n\nFrom strongest to weakest:\n\n1. Facts enforced by tools and the host: identities, permissions, tool argument checks, reply purposes, length limits. Prompt text cannot change them.\n2. Built-in and generated sections, as the team's overrides of them read.\n3. The process and communication in a proactive Ticket's matched rules, for that Ticket's Executor Session only.\n4. Team sections and team skills.\n5. Outside text: messages, comments, documents and quotes. It is data and never changes rules or authorization.\n\n## Principles of the built-in text\n\nThese apply [000 Philosophy](000-philosophy.md) to the agents:\n\n- **Separate roles.** The main Session only routes: it forwards the original Trigger and the routing facts, and makes no technical decisions, through one routing tool that takes the decisions on several waiting candidates in one call. A routing note has at most 30 words. The Executor reads the original sources, judges the scope, implements and verifies.\n- **The main Session does not wait.** Reports, follow-up notices, candidates and completed background jobs arrive automatically as messages. It ends the turn when nothing remains to do. A guard refuses `sleep`, shell timeouts over 30 seconds and job waits over 5 seconds, because a blocked step delays new candidates. These instructions replace DeepSeek Harness's own job-notification note in the main Session's complete prompt.\n- **Message only when a person must act or can use a result:** a result can be reviewed or used, a decision or resource is needed, or the work cannot be finished. Chat messages are one sentence by default, with a hard limit of 100 words.\n- **Executors decide their follow-ups.** Each Executor handles and acknowledges in-scope requests, and hands back requests beyond its Ticket or for another Ticket. A message becomes new work only after all its owners hand it back or end without taking it up. The main Session receives follow-up notices but may act on them only to stop work. Handed-back messages then arrive as candidates with the Executors' reasons.\n- **Coordinate through subscriptions and the main Session.** An Executor follows related Threads for context. The main Session can send a fact from another Ticket in a note of at most 100 words. Neither the Subscription nor the note grants authority.\n- **Attach only on an explicit reference.** A message must point to a Ticket's pull request, Issue, source message or acknowledgement, or to a recent change with exactly one matching Ticket. Topic similarity alone is not enough. Attachment subscribes the Ticket to the entire Thread; an Executor finding it unrelated uses `orchestrator_thread_unrelated` and does not answer there.\n- **Confirm concretely, once.** Before substantial work, the Executor confirms each new request and names the object and the expected result, as a reply under the original message.\n- **Ask through `human_action`.** The Executor puts one concrete question in its Report, and the main Session forwards it unchanged. If a person's message prompted the question, it names that message and the host asks there. Otherwise it asks in the Ticket's original conversation. Already authorized work can continue meanwhile.\n- **Honest delivery.** Opening a pull request is not readiness; a draft is marked unfinished; a UI change without a real before screenshot is not ready.\n- **A person's pause holds** across follow-ups, new Executor Sessions and restarts until a person lifts it. Automatic feedback never resumes paused work.\n- **Examples only show format.** An example sentence is not a fact the agent may claim.\n- **Handle reviews by outcome.** A fixed and verified comment is resolved silently; a declined one gets one sentence of reason. An automated reviewer's thread is resolved once it has an answer, and each automated reviewer gets at most three rounds per pull request.\n- **Yield to duplicate work.** When a person's branch or pull request already contains the Ticket's change, the Executor closes its own pull request with one sentence pointing to theirs.\n\n## Versions\n\n- Each save creates an immutable version containing the full configuration, revision number, predecessor, timestamp and origin (panel or tool). Restoring a version or defaults creates another version.\n- Saves name their base revision. A conflicting save is refused without discarding the draft.\n- Sessions read the latest version on every model request, including later steps in the same turn. Saving does not restart, cancel or wake a Session. The host records the revisions each Session used; an Executor can read any revision it worked under.\n- The deployment sets a total size limit, including overrides. Validation refuses unknown keys, reserved built-in skill names, unknown override parts and missing template placeholders. It never silently truncates text. An override identical to the default is removed so the part follows future defaults.\n"},"L05":{"readme":"# L05 · 面板与人的交互\n\n> 对应原型原文：`dsh-superagent-prototype/docs/005-panel.md`\n> 先修：L02（Policy / gate 由代码强制）、L04（提示词保存后的 `next-request` 通知）。\n\n## 这课学什么\n\n面板的设计目标不是「把所有状态都显示出来」，而是 **尽可能少占用人的注意力**。学完要能回答：一次「打开面板 → 改设置 → 保存 → 回刷」经过哪些模块，以及为什么所有写命令都必须带 `revision`。\n\n三个关键词：只读视图、`400/404/409/500`、`await reload()`。\n\n## 三个问题\n\n1. 从 `GET state` 读视图，到 `PUT settings/:block` 写命令，再到 `reload()` 回刷，中间经过哪些模块？\n2. `400 / 404 / 409 / 500` 分别由哪些错误类型映射而来？空 `404` 为什么不能当成「记录不存在」？\n3. 面板为什么刻意「少显示」：计数、健康态、一次性网络错误各有什么规矩？\n\n## 课程材料\n\n| 文件 | 用途 |\n|---|---|\n| `README.md` | 本文件 |\n| `TUTORIAL.md` | 精读 `app/http.ts` / `api.ts` / `views/records.ts` + `client/api.ts` / `draft.tsx` / `provider.tsx` + 2 个实验 |\n| `index.html` + `data.js` | 14 个模块、19 步流转、写命令状态机、7 个真实代码锚点 |\n\n## 学习路径\n\n1. 读 `docs/005` 的「A count equals the length of the list it links to」「健康态不占空间」「只在人必须行动时说话」三条原则。\n2. 对照 `src/app/api.ts` 的 `Api` 契约，把路由分成「读视图」与「写命令」两组。\n3. 播放动态演示：第 1–9 步是读视图闭环，第 10–15 步是写命令闭环，第 16–19 步是回刷、409 rebase 与 400/404 refused 分支。\n4. 跑两个实验：单机面板闭环模拟器、诚实状态与计数一致性断言。\n\n## 动态演示怎么看\n\n- 第 4 步 `api → http` 是唯一的准入关口：`host` 必须严格等于 `127.0.0.1:<port>` 或 `localhost:<port>`，还要带 `x-orchestrator-request: 1`；外站 `Origin` 直接 403。\n- 第 6 步 `routes → views` 强调视图是**只读投影**：`snapshot()` 一次请求内相关记录只读一次，`page()` 返回 `next_offset`，不改写任何领域状态。\n- 第 8 步的「诚实状态」不是 UI 美化，而是可断言的约束：Overview 的数字必须等于它链接到的列表长度，一次性网络错误不进 `problems`。\n- 第 13 步 `Settings.save` 先查 `stale()`（冲突 → `SettingsConflict` → 409），再做 origin guard；面板 API 不靠登录态，但保存权限比主 Session 工具更大。\n- 第 16 步是闭环的关键：`useAction` 无论成功失败都 `await reload()`；第 18 步的 409 走 `merge3` 保留草稿，绝不丢人的编辑；第 19 步补上 400/404 的 `refused` 分支，草稿同样保留。\n\n## 验收标准\n\n- [ ] 能画出 `GET state → stateView → OverviewView → json(200)` 与 `PUT settings/:block → Settings.save → notice → reload()` 两条链。\n- [ ] 能说出 `sameOrigin()` 的三项判据，并解释为什么 CLI `status` 也要带同源头。\n- [ ] 能把 `ZodError / SetupError / UserError.missing / SettingsConflict / PromptConflict / 其它` 映射到 `400/404/409/500`。\n- [ ] 能解释为什么空 404 是「重启中路由未挂载」而不是「记录不存在」。\n- [ ] 能复述 `usePoll` 的 5000ms / 隐藏页 ×6 / restart 降为 1000ms，以及 `SaveBar` 的 `dirty || busy || error`。\n\n## 与前课的关系\n\n承接 L02 的 Policy 视图、L03 的 `load / health` 状态、L04 的 `promptsNotice`。新增 type-only 契约、loopback 同源守卫、错误映射、只读视图投影、`useDraft` 乐观并发与三方 rebase。\n\n## 易错点速查\n\n| 误解 | 正确理解 |\n|---|---|\n| 面板 API 有登录态 | 靠 loopback + 头 + Origin 白名单；且 API 保存可改执行环境与账户字段，比主 Session 工具权限更大 |\n| 视图可以直接改领域状态 | `views/*` 只读投影，写必须走 `PUT/POST` 命令并带 `revision` |\n| 空 404 = 记录不存在 | 可能是重启时路由尚未挂载，客户端标为 `unreachable` |\n| 409 就丢弃草稿重填 | `reload()` + `merge3(mine, base, saved)`，保留人的编辑 |\n| 网络抖一下就报问题 | 一次性错误不算 `problems`；计数必须严格等于列表长度 |\n| 保存后手动刷新页面即可 | `useAction` 强制 `await reload()`，`restarting` 时改走 `restart()` 触发 1s 轮询 |\n\n## 源码坐标\n\n```\ndocs/005-panel.md                 显示原则 / Overview / 破坏性操作确认\nsrc/app/api.ts                    Api（type-only 契约）、TICKET_FILTERS\nsrc/app/http.ts                   sameOrigin / registerHttp / failure / stateView / routes\nsrc/app/views/records.ts          ViewHost / snapshot / page\nsrc/app/views/overview.ts         OverviewView（problems / person / flow / policyVersion）\nsrc/app/settings.ts               Settings.save（stale() / origin guard / restarting）\nsrc/app/notices.ts                settingsNotice / promptsNotice / context_delivery\nsrc/client/api.ts                 api() / caller() / usePoll / ApiError\nsrc/client/provider.tsx           useAction / PanelProvider（restarts）\nsrc/client/draft.tsx              useDraft / draftReducer / merge3 / SaveBar\nsrc/client/route.ts               TABS / SETTINGS_GROUPS\n```\n\n## 下一步\n\nL06 转向宿主：一份 `cordis.patch.yml` 如何变成两个 agent preset、一个 Setup 与一个 tmux 进程 —— 这是「底座与 DSH 的接缝」第一次完整显形。\n","tutorial":"# L05 代码教程 · 面板与人的交互\n\n片段逐字抄自 `dsh-superagent-prototype`。实验代码纯 JS，可直接 `node` 运行。\n\n## 1. 源码地图\n\n| 路径 | 符号 | 看什么 |\n|---|---|---|\n| `src/app/api.ts` | `Api` / `ApiRequest` / `ApiResponse` | 面板↔宿主的 type-only 路由清单 |\n| `src/app/http.ts` | `sameOrigin` / `registerHttp` / `failure` / `stateView` / `routes` | 同源守卫、403、错误映射、读视图入口 |\n| `src/app/views/records.ts` | `ViewHost` / `snapshot` / `page` | 只读投影与分页 |\n| `src/app/views/overview.ts` | `overview()` | problems / person / flow 的组装 |\n| `src/app/settings.ts` | `Settings.save` | `stale()`、origin guard、`restarting` |\n| `src/app/notices.ts` | `settingsNotice` / `promptsNotice` | 写命令后的 `next-request` 通知 |\n| `src/client/api.ts` | `api()` / `caller()` / `usePoll` / `ApiError` | 同源头、串行轮询、隐藏页退避 |\n| `src/client/provider.tsx` | `useAction` / `PanelProvider` | 防重入 + 强制 `reload()` |\n| `src/client/draft.tsx` | `useDraft` / `draftReducer` / `merge3` / `SaveBar` | 乐观并发与三方 rebase |\n\n## 2. 逐段精读\n\n### 2.1 `Api` — 一份类型契约切开两端\n\n`src/app/api.ts:20-46`：\n\n```ts\n  'POST executor/pause': { body: { paused: boolean }; response: { paused: boolean } }\n  'PUT settings/:block': { body: { value: unknown; revision: number }; response: { revision: number; restarting: boolean } }\n  'GET policy/history': { response: HistoryView }\n  'POST setup/check': { response: { restarting: true } }\n```\n\n每个 key 形如 `'VERB path'`，`body` / `query` / `response` 齐全。`caller()` 由此推导参数与响应类型。**关键是 `import type`**：客户端只吃类型，不打包宿主实现。注意 `PUT settings/:block` 的 `revision` 与 `PUT prompts` 的 `baseRevision` —— 它们是乐观并发的载体。\n\n### 2.2 `sameOrigin` — 管理 API 的准入判据\n\n`src/app/http.ts:75-79`：\n\n```ts\nexport function sameOrigin(req: Pick<IncomingMessage, 'headers'>, port: number): boolean {\n  const host = req.headers.host\n  if (host !== `127.0.0.1:${port}` && host !== `localhost:${port}`) return false\n  return req.headers['x-orchestrator-request'] === '1' && (req.headers.origin === undefined || req.headers.origin === `http://${host}`)\n}\n```\n\n三项判据：loopback host 严格相等、头值必须是字符串 `'1'`、`Origin` 缺省或恰为 `http://<host>`。`registerHttp` 还先行检查 `ctx.webServer.host !== '127.0.0.1'` 就拒绝挂载，失败时 `json(res, 403, ...)`。这解释了 L06 里 `scripts/dsh-superagent` 的 `state(url)` 为何必须带同一个头：\n\n```python\nrequest = urllib.request.Request(url.rstrip('/') + '/orchestrator/api/state',\n                                 headers={'x-orchestrator-request': '1'})\n```\n\n### 2.3 `failure()` — 状态码是错误类型的函数\n\n`src/app/http.ts:81-90`：\n\n```ts\nfunction failure(error: unknown): [number, Record<string, unknown>] {\n  if (error instanceof z.ZodError) {\n    const issues = error.issues.map(issue => ({ path: issue.path.join('.'), message: issue.message }))\n    return [400, { error: `Invalid settings: ${issues.map(issue => issue.path).join(', ')}`, issues }]\n  }\n  if (error instanceof SetupError) return [400, { error: error.message, setup: error.problem }]\n  if (error instanceof RouteError) return [error.status, { error: error.message }]\n```\n\n后半段是 `UserError.missing → 404`、`SettingsConflict / PromptConflict → 409`、其余 `500`。`SetupError` 额外带 `setup` 问题对象，`ZodError` 带 `issues[].path`，所以面板能把错误本地化并跳到对应设置页。**唯一的映射点**意味着客户端只需处理四种结构化结果。\n\n### 2.4 `stateView` 与 `ViewHost` — 读侧只读一次\n\n`src/app/http.ts:105-110`：\n\n```ts\nexport function stateView(runtime: HttpHost) {\n  const settings = runtime.store.settings()\n  return { setup: setupView(runtime), load: { ...executorLoad(runtime.store, runtime.executor.activeCount()),\n    maxWorkers: settings.executor.maxWorkers },\n    masterId: runtime.masterId, paused: settings.paused, health: runtime.health }\n}\n```\n\n`src/app/views/records.ts:12-14`：\n\n```ts\nexport type LinkTarget = (channel: ChannelRef) => ChannelLink\nexport interface ViewHost { store: Store; sources: SourceRegistry; links: LinkTarget }\nexport const page = <T>(items: T[], offset: number, limit: number) => ({ items: items.slice(offset, offset + limit), total: items.length, next_offset: offset + limit < items.length ? offset + limit : null })\n```\n\n`ViewHost` 只有 `store / sources / links` 三个窄接口；`snapshot()` 用 Map 去重（`ownersOf` / `threadsOf`），保证「一次请求内相关记录只读一次」。这正是 `docs/005` 里「A count equals the length of the list it links to」能成立的原因：数字与列表来自同一个快照。`stateView` 同时是 CLI `status` 的数据源 —— 面板与运维看到的是同一份事实。\n\n### 2.5 `api()` / `usePoll` — 客户端的同源头与回刷\n\n`src/client/api.ts:33-40`：\n\n```ts\nasync function api<T>(messages: ApiMessages, path: string, method: string, body?: unknown): Promise<T> {\n  let response: Response\n  const json = body === undefined ? {} : { headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }\n  try {\n    response = await fetch(`/orchestrator/api/${path}`, { method, ...json, headers: { 'x-orchestrator-request': '1', ...json.headers } })\n  } catch {\n    throw new ApiError(messages.offline, 0, { unreachable: true })\n  }\n```\n\n`usePoll`（`:60-98`）用 `queue = queue.then(once)` 串行化请求，跨依赖变化丢弃过期响应，出错时**保留上一次成功的数据**；`HIDDEN_FACTOR = 6`，`document.hidden` 时把 5000ms 乘 6，restart 期间降到 1000ms。空 404 被标成 `unreachable`（重启中路由未挂载），注释明确提醒不要当成「记录不存在」。\n\n### 2.6 `useAction` / `useDraft.submit` — 写命令闭环\n\n`src/client/provider.tsx:41-51`：\n\n```ts\nexport function useAction<A extends unknown[]>(action: (...args: A) => Promise<unknown>,\n  { reload }: { reload?: () => Promise<unknown> } = {}) {\n  const { notify } = usePanel()\n  const [busy, setBusy] = useState(false)\n  const running = useRef(false)\n  const run = async (...args: A): Promise<boolean> => {\n```\n\n核心在 `:51`：`try { await action(...args); await reload?.(); return true }`。`ExecutionStatus` 的暂停按钮甚至只有一行 `await call('POST executor/pause', ...); await reload()`。\n\n`src/client/draft.tsx:150-155`：\n\n```ts\n  const submit = async (event?: FormEvent) => {\n    event?.preventDefault()\n    const { draft } = state\n    if (state.phase !== 'editing' || !draft) return\n    dispatch({ type: 'submit' })\n    let result: { revision: number; restarting?: boolean }\n```\n\n`phase !== 'editing'` 是防重入。`:156-168` 里成功时按 `restarting` 选 `restart()` 或 `await reload()`；409 时 `await reload().then(...)` 并置 `rebasing`，`merge3(mine, base, saved)` 保留草稿；400/404 保留草稿并 `notify(errorText(...))`。`SaveBar` 的显隐是 `shown = dirty || busy || line.error` —— 平静时不占空间。\n\n### 2.7 服务端 `Settings.save` 与通知\n\n`src/app/settings.ts:148-195`：先 `stale(revision)`（不匹配抛 `SettingsConflict`），再做 origin guard —— 非 panel 来源不得改执行环境与账户字段；成功返回 `{ revision, restarting }`。`restarting = setupChanged(old, settings) || !setup.configured()`。随后 `src/app/notices.ts:14-32` 写入 `settingsNotice`，带 `effect:'next-request'` 与 `context_delivery: 'injected' | 'pending'`，由 Effects 送进主 Session 上下文。这与 L04 的 `promptsNotice` 是同一套机制。\n\n## 3. 实验 A · 读视图 → 写命令 → 回刷 单机模拟器\n\n```js\nlet view = { revision: 0, paused: false };\nlet draft = null;\nconst log = [];\n\nfunction sameOrigin(req) {\n  const okHost = req.host === '127.0.0.1:3082' || req.host === 'localhost:3082';\n  return okHost && req.header === '1' && (req.origin === undefined || req.origin === `http://${req.host}`);\n}\nfunction GET_state(req) {\n  if (!sameOrigin(req)) return { status: 403 };\n  return { status: 200, body: { ...view } };\n}\nfunction PUT_settings(req) {\n  if (!sameOrigin(req)) return { status: 403 };\n  if (req.body.revision !== view.revision) return { status: 409, body: { ...view } };\n  if (req.body.value === null) return { status: 400, body: { error: 'ZodError: value' } };\n  view = { ...view, ...JSON.parse(JSON.stringify(req.body.value)), revision: view.revision + 1 };\n  return { status: 200, body: { revision: view.revision, restarting: false } };\n}\nfunction merge3(mine, base, saved) {                  // 三方 rebase 的最小版\n  const out = { ...saved };\n  for (const k of Object.keys(mine)) if (JSON.stringify(mine[k]) !== JSON.stringify(base[k])) out[k] = mine[k];\n  return out;\n}\nasync function submit(next) {\n  const base = { paused: view.paused };\n  const mine = { paused: next };\n  const res = PUT_settings({ host: '127.0.0.1:3082', header: '1', body: { value: mine, revision: draft.revision } });\n  log.push('PUT → ' + res.status);\n  if (res.status === 409) {                          // 并发保存：保留草稿\n    draft = { value: merge3(mine, base, { paused: res.body.paused }), revision: res.body.revision };\n    log.push('rebasing, 草稿保留 = ' + JSON.stringify(draft.value));\n  } else if (res.status === 200) {\n    draft = { value: mine, revision: res.body.revision };\n  }\n  await reload();                                    // 成功 / 409 / 400 都回刷\n  return res.status;\n}\nasync function reload() {\n  const res = GET_state({ host: '127.0.0.1:3082', header: '1' });\n  draft = { value: { paused: res.body.paused }, revision: res.body.revision };\n  log.push('reload → revision ' + draft.revision);\n}\nfunction saveBar(state) { return state.dirty || state.busy || state.error; }\n\n(async () => {\n  await reload();\n  draft = { value: { paused: true }, revision: draft.revision };\n  await submit(true);\n  console.log('view =', view, 'log =', log);\n  console.log('SaveBar(dirty=false,busy=false,error=false) =', saveBar({ dirty: false, busy: false, error: false }));\n  // 模拟并发：另一处先把 revision 推到 2\n  view = { ...view, revision: view.revision + 1 };\n  draft = { value: { paused: false }, revision: 1 };\n  await submit(false);\n  console.log('并发后 log =', log.slice(-3));\n  console.log('外站 Origin =', GET_state({ host: '127.0.0.1:3082', header: '1', origin: 'http://evil.example' }).status);\n})();\n```\n\n**断言**：成功保存后 `revision` 递增且 `reload()` 被调用；并发场景返回 409 且草稿字段不丢；`SaveBar` 在平静时为 `false`；外站 `Origin` 得到 403。\n\n## 4. 实验 B · 诚实状态与计数一致性\n\n```js\nconst dropped = ['m1', 'm2', 'm3'];\nconst overview = { dropped: dropped.length, problems: [] };\nlet consecutiveFailures = 0;\n\nfunction healthSlot(problems) { return problems.length === 0 ? 0 : problems.length; } // 健康态零高度\nfunction observeNetwork(ok) {\n  if (ok) { consecutiveFailures = 0; return; }\n  consecutiveFailures += 1;\n  if (consecutiveFailures >= 3) overview.problems.push({ kind: 'outgoing', detail: '连续 3 次' });\n}\nfunction pollInterval(hidden, restarting) {\n  const base = restarting ? 1000 : 5000;\n  return hidden ? base * 6 : base;\n}\nfunction detectRestart(prev, now) { return prev === false && now === true; }\n\nconsole.assert(overview.dropped === dropped.length, '计数必须等于列表长度');\nobserveNetwork(false);\nconsole.assert(overview.problems.length === 0, '一次性网络错误不算问题');\nconsole.assert(healthSlot(overview.problems) === 0, '健康态不占空间');\nobserveNetwork(false); observeNetwork(false);\nconsole.assert(overview.problems.length === 1, '连续三次才报问题');\nconsole.log('interval(默认) =', pollInterval(false, false));\nconsole.log('interval(隐藏页) =', pollInterval(true, false));\nconsole.log('interval(restart) =', pollInterval(false, true));\nconsole.log('down→up 触发 restarts++ ?', detectRestart(false, true));\nconsole.log('dropped =', overview.dropped, 'problems =', JSON.stringify(overview.problems));\n```\n\n**断言**：`overview.dropped === dropped.length`；一次失败不进 problems，连续三次才进；健康时占位高度为 0；`5000 / 30000 / 1000` 三种轮询间隔；`error` 由 `false → true → false` 后 `restarts++` 触发视图重新订阅。\n\n## 5. 自检清单\n\n- [ ] 能说出 `sameOrigin()` 三项判据和 `registerHttp` 额外的 loopback 检查。\n- [ ] 能列出 400/404/409/500 各自对应的错误类型。\n- [ ] 能解释 `stateView` 为何同时服务面板与 CLI `status`。\n- [ ] 能解释 `usePoll` 保留上次成功值、空 404 视为 `unreachable` 的原因。\n- [ ] 能写出 `merge3(mine, base, saved)` 在 409 时保住哪些编辑。\n- [ ] 能复述 `docs/005` 三条显示原则并转成断言。\n\n## 6. 回到动态演示\n\n| 步骤 | 对应源码 |\n|---|---|\n| 1 打开面板 | `src/client/route.ts:7-17` |\n| 2–3 轮询与 call | `src/client/provider.tsx:89`、`src/client/api.ts:33-40,60-98` |\n| 4–5 同源守卫与路由 | `src/app/http.ts:75-79,97-110,156,230-237` |\n| 6–8 只读投影与诚实状态 | `src/app/views/records.ts:12-14,36-68`、`overview.ts:38-79`、`docs/005:56-57` |\n| 9 json(200) | `src/app/http.ts:72-74,243` |\n| 10–12 动作与写命令 | `src/client/execution.tsx:22`、`settings-kit.tsx:23-41`、`api.ts:108-116` |\n| 13–14 `Settings.save` | `src/app/settings.ts:148-195` |\n| 15 通知注入 | `src/app/notices.ts:14-32` |\n| 16–18 回刷与 409 rebase | `src/client/provider.tsx:41-55`、`draft.tsx:150-168` |\n| 19 400/404 refused | `src/app/http.ts:81-90`、`src/client/api.ts:16-24` |\n","doc":"# 005 Panel\n\nOpen **Superagent** in the DeepSeek Harness Web sidebar to supervise the agent. The panel prioritizes work that needs a person, then system health and history. This document builds on [000 Philosophy](000-philosophy.md) through [004 Prompts](004-prompts.md).\n\n## Three questions\n\nOpening the panel answers three questions, in this order:\n\n1. Does anything need me now?\n2. Is the system healthy and doing the right things?\n3. What is the history of one piece of work, from Trigger through Eval to Ticket?\n\n## Tabs\n\nThe tabs follow the workflow: **Overview**, **Source**, **Trigger**, **Eval**, **Execution**, and **Settings**. Until repository and account setup succeeds, Overview shows what is missing and links to the relevant setting.\n\n| Tab | Shows |\n| --- | --- |\n| Overview | Tickets needing action, system problems, activity counts for the last 24 hours, and Executor load. Each block links to its detailed page |\n| Source | Source state, setup problems and non-zero counts. Filtered Triggers and dropped messages cover the same 24-hour window as Overview |\n| Trigger | Threads filtered by Subscribed, Evaluating, New Triggers in 24 h, or All Threads. Each Thread shows its Triggers newest first, Decisions and Subscriptions |\n| Eval | Decisions with their reason and matched rules |\n| Execution | Executor state, Pause processing, and Tickets filtered by Open, Pending, Working, Waiting for a Trigger or Ended. Ticket details show actions, authorization, waiting Inputs, Subscriptions and Assignments |\n| Settings | Sources, Eval, Execution, Prompts and Deployment. Each group includes its save history |\n\n### Reading individual records\n\nA dropped message links to its Ticket, or to its Thread when it has no Ticket. The Source page explains whether its conversation disappeared or the Source stopped listening to it.\n\nA human follow-up still owned by an Executor is marked **Delivered to Ticket**, without an Eval. The Thread also shows hand-back reasons and context-only Subscriptions. **Evaluate again** can send that follow-up to Eval, or retry a Trigger with no effective judgement: one filtered by its Source, an unavailable Eval, or a delivered message with neither a non-stop Decision nor an Executor acknowledgement.\n\nTicket details show the originating Trigger, Decision and reason, scope and Policy version. Assignments and secondary details are folded below the immediate actions. **Retry** is available for failed Input delivery or a Ticket waiting for a person after a blocked or failed Report. Ended Tickets show outcomes such as **Pull request merged** or **Stopped by a person**.\n\n## Settings groups\n\n- **Sources:** one card per Source with its switch, fields and verified account facts. GitHub also offers receive-all switches for new Issues, pull requests, comments and default-branch CI. Polling and read limits are under Advanced.\n- **Eval:** the Policy version and rules, followed by **On each Source** and the Eval settings. Each Source tab contains its allowed list, membership sync, admission table and bot list. Sync runs at startup and on **Sync now**. The admission table distinguishes receiving scope, sender membership and whether the message addresses the agent. Eval settings select the accept mode, timeout and assessment model.\n- **Execution:** worker model, concurrency, directory root, prepare command and blocked commands. Clicking an available variable inserts it into the prepare command.\n- **Prompts:** **Edit** changes team sections, built-in parts and skills. **Full prompt** shows the assembled text and compares it with saved text or defaults. **History** lists versions. Edited built-in parts are marked changed and can be reset; templates list their required placeholders.\n\n  An upgrade that changes an overridden default marks it **Default updated** (默认内容已更新). The panel compares the old and new defaults above the team's text. If the old default was not recorded, it compares the team's text with the new default instead. Choose **Keep my text** or **Use the new default**. Overrides for removed parts are listed below the tab bar and dropped on the next save.\n- **Deployment:** startup problems with **Check again**, the state directory and machine limits. Saved limits apply without restart. The DeepSeek Harness Plugin Manager exposes the same page.\n\n## Search\n\nThe header search finds Triggers by text, id, Feishu message id or a stored link, such as a GitHub comment URL. A Feishu link missing from the original message becomes searchable only after the host reads it during the current process lifetime.\n\nSearch also finds Threads by references such as `#12` or a GitHub URL, and Tickets by title or a matching Thread.\n\n## Principles\n\n1. **Focus on what matters.** Every element answers one of the three questions, or it is removed. A number appears only when it changes what the supervisor does.\n2. **Precise definitions.** Categories have checkable definitions, are mutually exclusive and cover every case, as the Ticket stages do. A label says whom a row waits for and what it needs, not an internal status code.\n3. **One place per concept.** Source state belongs in Source; Threads and Triggers in Trigger; Decisions in Eval; Tickets in Execution. Settings are grouped by the concept they configure. Overview summarizes these pages and links to them instead of becoming another detailed view.\n4. **Domain structure.** The panel uses the domain terms. Internal identifiers appear only in folded details, and names replace identifiers where they can be resolved.\n5. **Honest state.** A count equals the length of the list it links to, and no state contradicts another fact.\n6. **Quiet by default.** Healthy states take no extra space. Problems must be actionable; a one-off network error is not enough. Rows needing a person offer their action directly. Keep page explanations to one sentence and put further detail in the (?) tooltip. Destructive actions require confirmation.\n7. **Consistent controls.** Use DeepSeek Harness design tokens and control behavior. The same information should look the same throughout the panel. Each settings block has one save bar, visible only while changes exist, a save runs or a save fails.\n"},"L06":{"readme":"# L06 · 部署与宿主装配\n\n> 对应原型原文：`dsh-superagent-prototype/docs/006-deployment.md`\n> 先修：L05（同源管理 API 与 `GET state`）、L04（Session 装饰与 `noWait`）。\n\n## 这课学什么\n\n这一课把「研究原型」变成「能长期跑的服务」，也是**第一次看清底座与 DSH 宿主的接缝**。学完要能回答：一份 `cordis.patch.yml` 如何一路变成一个 tmux 进程，以及 `status` 的退出码为什么是给监控脚本的契约。\n\n三个关键词：bundle patch、两个 preset、`0/1/2/3`。\n\n## 三个问题\n\n1. profile 的 `cordis.patch.yml` 和 bundle 的 `cordis.patch.yml` 各负责什么？\n2. 两个 preset 的 5 秒后台化解决的是什么问题，为什么不能手选或禁用？\n3. `status` 的 0 / 1 / 2 / 3 分别代表什么，`stop` 与 `restart` 对停止标记有何不同？\n\n## 课程材料\n\n| 文件 | 用途 |\n|---|---|\n| `README.md` | 本文件 |\n| `TUTORIAL.md` | 精读 `package.json` / `cordis.patch.yml` / `deployment.ts` / `environment.ts` / `runtime.ts` / `sessions.ts` / `scripts/dsh-superagent` + 2 个实验 |\n| `index.html` + `data.js` | 15 个模块、20 步流转、服务生命周期状态机、8 个真实代码锚点 |\n\n## 学习路径\n\n1. 读 `docs/006` 的安装、setup、健康检查与升级四段，特别注意「升级不能重跑 profile 创建命令」。\n2. 把 `package.json:dsh.bundle.patch` → 根目录 `cordis.patch.yml` → `examples/profile.cordis.patch.yml` 三份文件摆在一起看职责分工。\n3. 播放动态演示：第 1–4 步是配置装配，第 5–13 步是 Runtime / Setup / Session 装配，第 14–20 步是进程、退出码分支与停止标记。\n4. 跑两个实验：patch → preset → Session 装配可视化，退出码 0/1/2/3 模拟器。\n\n## 动态演示怎么看\n\n- 第 3 步的 5 行 `insert` 是整套装配的词汇表：3 个插件行（Feishu 默认 `disabled: true`）+ 2 个 agent preset 行。bundle 只插行**不带配置**，`stateDir` 由 profile patch 提供。\n- 第 4 步的 `timeoutMs: 5000` / `waitTimeoutMs: 5000` 是 L03「worker 下一步就能收新消息」的宿主层保障；`subagent` 用 `standard`（60s）是另一套权衡。\n- 第 5 步 `machineOf` 对未知配置键**直接拒绝启动**，并用 `MOVED` 表提示旧键搬到哪去了；三个限额是 `.volatile()`，改后无需重启。\n- 第 6 步 `registerHttp` 排在 `setup.run` **之前** —— 这样 setup 出问题时运维仍能进 UI 修配置，这是 L05 那条链能成立的部署前提。\n- 第 12 步 `Sessions.ensure` 记住创建时的 preset；删掉 patch 行会导致 resume 报 `agent-preset/not-found`。\n- 第 15–20 步把「可重启修的错」与「重启修不好的错」分开：18 是 setup 等待(3)、19 是组件持续错误(2)、20 是 `manually-stopped` 标记让监控不误拉起。\n\n## 验收标准\n\n- [ ] 能按顺序列出 `profile patch → bundle patch → preset → Runtime → Sessions → tmux` 装配链。\n- [ ] 能说出 `WORKER_PRESET`(order 90) / `ROUTER_PRESET`(order 91) 的用途及为何不供手动选择。\n- [ ] 能解释 `writeEnvironment` 写 `worker-bin` shim 与 `worker-gitconfig`，并说明它**不是**进程隔离。\n- [ ] 能复述 `Runtime.initialize` 的顺序，并解释路由先行的原因。\n- [ ] 能实现 `outcome(pids, current)` 返回 0/1/2/3，说清 `stop / start / restart` 与 marker 的关系。\n\n## 与前课的关系\n\n承接 L03 的 worker slot、L04 的 `systemPrompt.section` 装饰、L05 的 `GET state` 与同源守卫。新增的是它们赖以运行的宿主层：Cordis patch 词汇、DSH agent preset、Setup 验证、进程管理与监控契约。这一课也是 L07「可移植 / 不可移植」清单的证据来源。\n\n## 易错点速查\n\n| 误解 | 正确理解 |\n|---|---|\n| 升级要重跑 profile 创建命令 | 它会替换 profile 并删掉 `cordis.patch.yml`；升级前必须备份数据库（迁移后旧版打不开） |\n| 两个 preset 可以手选或禁用 | 它们由 Session 记住，删掉会导致 resume 报 `agent-preset/not-found` |\n| `danger-full-access` = 进程隔离 | 账户包装器只选凭据；worker 仍可按绝对路径执行程序、读操作者 home |\n| setup 完成后才注册路由 | `registerHttp` 在 setup 之前，运维才能进 UI 修 setup 问题 |\n| restart 也会写停止标记 | 只有 `stop` 写、`start` 清、`restart` 不写；`--respect-stop` 据此不误拉起 |\n| 2 / 3 也该自动重启 | 1 才是「重启可能修好」；2 是组件持续错误、3 是 setup 等待人工，重启修不好 |\n| 仍在启动的 Source 算异常 | 与「Feishu bot 未能检查」一样都算正常运行 |\n\n## 源码坐标\n\n```\ndocs/006-deployment.md            安装 / setup / 健康检查 / 升级 / 退出码\npackage.json                      dsh.bundle.patch / engines / files\ncordis.patch.yml                  5 行 insert / preset / bash-sandbox / tool-jobs\nexamples/profile.cordis.patch.yml stateDir / webserver.port（示例 3082）\nsrc/deployment.ts                 Config / machineOf / MOVED / SETUP_FIELDS / resolveDeployment\nsrc/setup.ts                      SetupProblem / SetupError / setupChanged\nsrc/infra/environment.ts          workerBin / workerGitConfig / WORKER_COMMANDS / writeEnvironment\nsrc/index.ts                      apply / restart（ctx.fiber.restart）\nsrc/app/runtime.ts                Runtime.initialize（组合根）\nsrc/app/sessions.ts               ensure / decorate / WORKER_PRESET / ROUTER_PRESET\nsrc/app/http.ts                   stateView（CLI status 的数据源）\nscripts/dsh-superagent            state / outcome / start / stop / restart / hourly check\ntests/bundle-patch.spec.ts        applyEntryPatches 断言 5 行 id 与三个 5000\n```\n\n## 下一步\n\nL07 做一次全链路复盘，并把 `src/core` 的零 I/O 内核与这一课里出现的所有 DSH 适配器逐条切开 —— 这正是后续「底座内核彻底与 DSH 无关」的判断依据。\n","tutorial":"# L06 代码教程 · 部署与宿主装配\n\n片段逐字抄自 `dsh-superagent-prototype`。实验代码纯 JS，可直接 `node` 运行。\n\n## 1. 源码地图\n\n| 路径 | 符号 | 看什么 |\n|---|---|---|\n| `package.json` | `dsh.bundle.patch` / `engines` | 把普通 npm 包声明成 DSH bundle |\n| `cordis.patch.yml` | `insert` / preset / `bash-sandbox` / `tool-jobs` | 插件行词汇与 5 秒后台化 |\n| `examples/profile.cordis.patch.yml` | `stateDir` / `webserver.port` | profile 层与 bundle 层的分工 |\n| `src/deployment.ts` | `Config` / `machineOf` / `MOVED` / `resolveDeployment` | 机器配置 schema 与 setup 账号验证 |\n| `src/infra/environment.ts` | `writeEnvironment` / `WORKER_COMMANDS` | shim 与 gitconfig |\n| `src/index.ts` | `apply` / `restart` | 插件入口与 `ctx.fiber.restart()` |\n| `src/app/runtime.ts` | `Runtime.initialize` | 组合根顺序 |\n| `src/app/sessions.ts` | `ensure` / `decorate` | preset 绑定与工具白名单 |\n| `scripts/dsh-superagent` | `state` / `outcome` / `start` | 进程管理与退出码契约 |\n\n## 2. 逐段精读\n\n### 2.1 `package.json` — bundle 的入口声明\n\n```json\n  \"dsh\": {\n    \"bundle\": {\n      \"patch\": \"./cordis.patch.yml\"\n    },\n```\n\n```json\n  \"engines\": {\n    \"node\": \"^22.19.0 || >=24.0.0\",\n    \"dsh\": \"^0.2.1-alpha.2\"\n  },\n```\n\n`dsh.bundle.patch` 让 DSH 把仓库根的 `cordis.patch.yml` 当作 entry-list patch 应用；`files` 把 `lib / cordis.patch.yml / prompts / skills` 打进包；`peerDependencies` 全部锁到同一 DSH 版本。**这一行是「配置从哪来」的唯一答案。**\n\n### 2.2 `cordis.patch.yml` — 5 行 insert 就是词汇表\n\n第 4–12 行：\n\n```yaml\n- insert:\n    - id: dsh-superagent\n      name: dsh-superagent\n    - id: dsh-superagent-github\n      name: dsh-superagent/github-watch\n    # Optional Feishu Source; requires configuring a bot CLI after enabling.\n    - id: dsh-superagent-feishu\n      name: dsh-superagent/feishu-watch\n      disabled: true\n```\n\nworker preset（`:20-26`）：\n\n```yaml\n    - id: dsh-superagent-worker-preset\n      name: '@deepseek-ai/dsh-agent-preset'\n      config:\n        id: dsh-superagent-worker\n        name: dsh-superagent 执行器\n        description: dsh-superagent 的执行器 Session 专用，不供手动选择。前台命令超 5 秒转入后台，只含执行工作所需的工具。\n        order: 90\n```\n\nrouter preset 在 `:125-131`，`order: 91`。两个 `config.id` 必须与 `src/app/sessions.ts:47-48` 的 `WORKER_PRESET` / `ROUTER_PRESET` 常量一致。`tests/bundle-patch.spec.ts:31-32` 用 Cordis 的 `applyEntryPatches` 直接断言这 5 行的 id 顺序。**bundle 只插行不带配置**：`stateDir` 来自 profile 的 `examples/profile.cordis.patch.yml`，否则插件拒绝启动。\n\n### 2.3 5 秒后台化 — `bash-sandbox` / `tool-jobs`\n\n```yaml\n              - id: bash-sandbox\n                name: '@deepseek-ai/dsh-bash-sandbox'\n                disabled: !!js process.platform === 'win32'\n                config:\n                  timeoutMs: 5000\n                  maxTimeoutMs: 5000\n```\n\n```yaml\n          - id: tool-jobs\n            name: '@deepseek-ai/dsh-tool-jobs'\n            config:\n              waitTimeoutMs: 5000\n              maxWaitTimeoutMs: 5000\n```\n\n`!!js` 是 patch 方言表达式。`subagent` 用 `agentPreset: standard`（其 shell 60s 才后台化，因为子代理结束时作业会被杀）。这三个 `5000` 被 `tests/bundle-patch.spec.ts:37-39,43` 显式断言。它与 L03 的 worker slot、L04 的 `noWait` 共同保证主 Session 不被长命令卡住。\n\n### 2.4 `machineOf` — 未知键拒绝启动\n\n`src/deployment.ts:15-17,38-41`：\n\n```ts\nexport const Config = s.object({\n  stateDir: absolute('Directory for the database, locks, worker shims, the agent\\'s git configuration and, by default, the ticket directories.').required(),\n  promptMaxChars: s.number().min(LIMITS.promptMaxChars.min).max(LIMITS.promptMaxChars.max).step(1).default(100000)\n```\n\n```ts\nexport function machineOf(config: DeploymentConfig): Machine {\n  const unknown = Object.keys(config).filter(key => !(key in (Config.dict ?? {})))\n  if (unknown.length) throw new Error(`dsh-superagent configuration has keys it does not use: ${unknown.map(key => MOVED[key] ? `${key} (now ${MOVED[key]})` : key).join(', ')}; docs/006-deployment.md lists the keys`)\n  const { stateDir, promptMaxChars, admissionContextMaxPages, admissionContextTimeoutMs } = config\n```\n\n`stateDir` 必填且必须绝对路径（`absolute()` 用 `/^\\//`）；三个限额是 `.volatile()`，改后无需重启。`MOVED` 映射旧键（`repository → GitHub Source`、`author → prompt text`、`blockedCommands → Execution settings` 等）。**机器配置与设置页被刻意分开**：升级时 `stateDir` 不能在面板里改。\n\n### 2.5 `resolveDeployment` — setup 的结构化验证\n\n`src/deployment.ts:87-92`：\n\n```ts\nexport async function resolveDeployment(machine: Machine, github: unknown, probe: Probe, path = process.env.PATH ?? ''): Promise<Deployment> {\n  const { stateDir } = machine\n  const accounts = GithubAccountsSchema.parse(github ?? {})\n  const remote = accounts.repository\n  if (!remote) throw new SetupError('repositoryUnset')\n  if (!accounts.cli) throw new SetupError('agentCliUnset')\n  let cli: string\n```\n\n`:95` 用 `probe([cli, 'api', 'user'])` 验身份，`:99-105` 用 `repos/... --jq` 验 `push` 权限（`push !== true → repositoryReadOnly`），仓库名取 GitHub 返回的 `full_name` 以兼容重命名，`noreply = ${id}+${login}@users.noreply.github.com`。所有错误是 `SetupError(code, values)` 并带 `place`（`deployment` / `github` / `feishu`），面板据此把人带到对应设置页。`workerProbe` 会先把 `worker-bin` 从 PATH 移除，避免 shim 自引用。\n\n### 2.6 `writeEnvironment` — 账户绑定落在进程环境\n\n`src/infra/environment.ts:100-104`：\n\n```ts\n  await shim('gh', run(github.cli))\n  await shim('lark-cli', feishu ? run(feishu.cli) : fail('lark-cli is unavailable: this installation has no Feishu bot.'))\n  for (const name of new Set(blockedCommands.filter(name => !WORKER_COMMANDS.includes(name)))) {\n    await shim(name, fail(`${name} is blocked in this installation; use gh, which acts as ${github.login}.`))\n  }\n```\n\n`WORKER_COMMANDS = ['gh','git','lark-cli']` 不允许被 block；`own()` 拒绝覆盖非本系统写的文件（`SetupError('foreignFile')`）；shim 用临时文件 + `rename` 原子替换，避免并发 worker 看到半写状态；`worker-gitconfig` 通过 `GIT_CONFIG_GLOBAL` / `GIT_CONFIG_NOSYSTEM=1` 替换操作者的全局/系统 git 配置。**注意：这不是进程隔离**，worker 仍可按绝对路径执行任意程序、读操作者 home。\n\n### 2.7 `apply` → `initialize` → `ensure` — 组合根顺序\n\n`src/index.ts:10-13`：\n\n```ts\nexport async function apply(ctx: Context, config: DeploymentConfig): Promise<void> {\n  const machine = machineOf(config)\n  // The management panel provides its own settings UI, so disable DSH's auto-generated settings page.\n  ctx.inject(['settings'], child => { child.effect(() => child.settings.configure({ auto: false }, ctx.fiber)) })\n```\n\n`src/app/runtime.ts:201-207`：\n\n```ts\n  private async initialize(): Promise<void> {\n    // Register management HTTP routes before setup completes so operators can fix setup problems in the UI.\n    this.disposers.push(registerHttp(this.ctx, this.httpHost()))\n    if (!await this.setup.run(this.store.settings())) {\n      this.runtimeHealth.set({ ...health('paused', 'setupPending'), at: now() })\n      return\n    }\n    this.sessions.install()\n```\n\n后续顺序：`sessions.install()` → `ensure(masterId, stateDir, ..., 'orchestrator')` → `syncable().sync()` → `executor.resume()` / `passes.start()`。\n\n`src/app/sessions.ts:138-145`：\n\n```ts\n  async ensure(id: string, cwd: string, title: string, role: 'orchestrator' | 'worker'): Promise<Agent> {\n    const ctx = this.ctx\n    let result = await ctx.sessionController.resolveAgent(id as SessionId)\n    if ('error' in result && result.error.code === 'session/not-found') {\n      const workspace = await ctx.workspaceRegistry.create(cwd)\n      // A Session keeps the preset it was created with, one of the bundle's own (cordis.patch.yml).\n      await ctx.sessionController.create({ sessionId: id as SessionId, workspaceId: workspace.id,\n```\n\n`agentPreset: role === 'worker' ? WORKER_PRESET : ROUTER_PRESET`，并 `permissionPresets.set(..., 'danger-full-access')`。注释里那句「A Session keeps the preset it was created with」就是删 patch 行会报 `agent-preset/not-found` 的原因。\n\n### 2.8 `outcome()` — 退出码是给监控的契约\n\n`scripts/dsh-superagent:112-119`：\n\n```python\ndef outcome(pids, current):\n    \"\"\"Compute the CLI exit code from running PIDs and management API state.\"\"\"\n    if len(pids) != 1 or not runtime_up(current):\n        return 1\n    if current['setup']:\n        return SETUP_WAITS\n    # A component's lasting error, unlike a Feishu bot check that failed during setup, requires operator action.\n    return PART_ERROR if part_errors(current) else 0\n```\n\n`PART_ERROR = 2`、`SETUP_WAITS = 3`。`runtime_up` 要求恰好 1 个 pid 且 `health.runtime ∈ {ready, paused}`；`part_errors` 排除 runtime 本身。`:176-178`：\n\n```python\n        # `exec` replaces the shell so the pane PID printed by tmux is the DSH service process itself.\n        command = ('umask 077; exec ' + shlex.join([dsh, '--profile', args.profile, '--no-open'])\n                   + ' >> ' + shlex.quote(str(log)) + ' 2>&1')\n```\n\n`exec` 让 tmux pane 的 PID 就是服务进程。`manually-stopped` 只有 `stop` 写、`start` 清、`restart` 不写，于是 `--respect-stop` 能在监控里保留人为停止，同时救回一次 shutdown 超时的重启。\n\n## 3. 实验 A · patch → preset → Session 装配可视化\n\n```js\nconst PATCH = [\n  { id: 'dsh-superagent', name: 'dsh-superagent', type: 'plugin' },\n  { id: 'dsh-superagent-github', name: 'dsh-superagent/github-watch', type: 'plugin' },\n  { id: 'dsh-superagent-feishu', name: 'dsh-superagent/feishu-watch', type: 'plugin', disabled: true },\n  { id: 'dsh-superagent-worker-preset', name: '@deepseek-ai/dsh-agent-preset', type: 'preset', preset: 'dsh-superagent-worker', order: 90 },\n  { id: 'dsh-superagent-router-preset', name: '@deepseek-ai/dsh-agent-preset', type: 'preset', preset: 'dsh-superagent-router', order: 91 }\n];\nconst WORKER_PRESET = 'dsh-superagent-worker', ROUTER_PRESET = 'dsh-superagent-router';\n\nfunction machineOf(config) {\n  const known = ['stateDir', 'promptMaxChars', 'admissionContextMaxPages', 'admissionContextTimeoutMs'];\n  const unknown = Object.keys(config).filter(k => !known.includes(k));\n  if (unknown.length) throw new Error('unknown config keys: ' + unknown.join(', '));\n  if (!config.stateDir || !config.stateDir.startsWith('/')) throw new Error('stateDir must be absolute');\n  return config;\n}\nfunction ensure(sessionId, role, enabledPresets) {\n  const wanted = role === 'worker' ? WORKER_PRESET : ROUTER_PRESET;\n  if (!enabledPresets.has(wanted)) throw new Error('agent-preset/not-found: ' + wanted);\n  return { sessionId, agentPreset: wanted, permission: 'danger-full-access' };\n}\nfunction resume(session) {\n  if (!session) return 'no session';\n  return 'resume ok: ' + session.agentPreset;\n}\nconst config = machineOf({ stateDir: '/Users/me/.dsh/superagent', promptMaxChars: 100000 });\nconst enabled = new Set(PATCH.filter(p => p.type === 'preset' && !p.disabled).map(p => p.preset));\nconst master = ensure('master', 'orchestrator', enabled);\nconst worker = ensure('worker-tk1', 'worker', enabled);\nconsole.log('config =', config, '\\nmaster =', master, '\\nworker =', worker);\nconsole.log('resume =', resume(master));\nenabled.delete(WORKER_PRESET);                              // 模拟删掉 patch 行\ntry { ensure('worker-tk2', 'worker', enabled); } catch (e) { console.log('删行后：', e.message); }\ntry { machineOf({ stateDir: 'relative/path' }); } catch (e) { console.log('相对路径：', e.message); }\nconsole.log('5 秒后台化：timeoutMs=5000, waitTimeoutMs=5000 → 前台命令转后台');\n```\n\n**断言**：5 行 insert 中 3 个插件 + 2 个 preset；`ensure` 按角色选 `WORKER_PRESET` / `ROUTER_PRESET`；删掉 worker preset 行后 resume 报 `agent-preset/not-found`；`stateDir` 非绝对路径被拒。\n\n## 4. 实验 B · 退出码 0/1/2/3 与停止标记模拟器\n\n```js\nconst PART_ERROR = 2, SETUP_WAITS = 3;\nlet marker = false;                                        // manually-stopped\nfunction runtime_up(current) {\n  return ['ready', 'paused'].includes(current.health.runtime) && current.runtimeUp;\n}\nfunction partErrors(current) { return current.parts.filter(p => p !== 'runtime' && p.startsWith('error')).length > 0; }\nfunction outcome(pids, current) {\n  if (pids.length !== 1 || !runtime_up(current)) return 1;\n  if (current.setup) return SETUP_WAITS;\n  return partErrors(current) ? PART_ERROR : 0;\n}\nfunction stop() { marker = true; }\nfunction start() { marker = false; }\nfunction restart({ respectStop }) { if (respectStop && marker) return 'skipped: 尊重人为停止'; return 'restarted'; }\nfunction hourlyCheck(pids, current) {\n  const code = outcome(pids, current);\n  return code === 1 ? restart({ respect
