them the typed Ticket and `MandateBasis`, with `threadKey`, `ticketOutcome`, `reached`, `followupOwners`, `settled`, `waitsForPerson`, `liveTicket`, `runningAssignment`, `latestAssignment` and `latestReport` |\n| `src/core/ports.ts` | The ports: `Repositories`, `Policy`, `SourceScope`, `Assessor`, `Executor`, `Outbox`, and the domain events |\n| `src/core/engine.ts` | The Engine, the core's entry point, and the role interfaces `EngineForSources`, `EngineForMainSession`, `EngineForPeople`, `EngineForSettings` and `EngineForExecutor` |\n| `src/core/part.ts` | `EnginePart`, the base of the Engine's parts, and `EngineOptions` |\n| `src/core/intake.ts` | `Intake`: Triggers from Sources, to their Tickets and, unless a person's message reached one, to Eval |\n| `src/core/evals.ts` | `Evals`: the Evals of Threads and their Decisions |\n| `src/core/tickets.ts` | `Tickets`: the Ticket lifecycle, the Threads a Ticket follows, Subscriptions and Inputs |\n| `src/core/assignments.ts` | `Assignments`: the Executor's facts and its workers' Reports |\n| `src/core/replies.ts` | `Replies`: the Engine's Channel writes |\n| `src/core/stage.ts` | `ticketStage` and `canRetry`: the Ticket stages of [003 Execution](003-execution.md) |\n| `src/core/errors.ts` | `UserError` and `USER_ERRORS` |\n| `src/core/reasons.ts` | `Reason`, `REASONS` and `reasonText`: why the core recorded a Decision or set a Trigger aside, by code |\n| `src/core/ids.ts` | `key`: ids derived from their inputs, equal for equal inputs |\n| `src/core/memory.ts` | `MemoryRepositories`: the Store's repositories in memory, in the Store's order and with its nested rollback, for domain tests |\n| `src/core/index.ts` | The core's exports |\n| `src/app/runtime.ts` | The Runtime, the composition root, with its start and stop |\n| `src/app/setup.ts` | Setup, and `setupChanged`, whether a save changes a field setup reads |\n| `src/app/passes.ts` | Passes, the pass scheduler |\n| `src/app/outbox.ts` | The Outbox: the Engine's `Outbox` port, the receipts and the `reply` effects that send them |\n| `src/app/notices.ts` | The main Session's notices and relays: `eventNotice`, `reportRelay`, `resultRelay` and `followupRelay` |\n| `src/app/store.ts` | The Store, and `Receipt`, a message of the outbox |\n| `src/app/store-read.ts` | `storeReads`: the Store's read queries for the views, the tools and the Sources' polls, which never write |\n| `src/app/migration.ts` | The schema 11 migration: one step from schema 10 that writes every stored record in its current shape |\n| `src/app/effects.ts` | Effects |\n| `src/app/versions.ts` | `Versions`: a record kept as numbered snapshots with a pointer to the current one, for the settings and the prompts |\n| `src/app/cache.ts` | `TextCache`: texts kept in memory within a size, the least recently used dropped first |\n| `src/app/settings.ts` | Settings |\n| `src/app/settings-history.ts` | `policyHistory`: each saved settings revision with what it changed from the one before |\n| `src/app/prompts.ts` | Prompts, `builtInParts`, the built-in parts a team may override, and `promptParts`, the order of a role's prompt sections |\n| `src/app/context.ts` | The built-in prompt text, read from `prompts/`, and the transcript entries Sessions read |\n| `src/app/skill-files.ts` | Packaged text: `promptFile`, which joins a file's one-sentence lines into paragraphs, and the bundled skills |\n| `src/app/sessions.ts` | Sessions |\n| `src/app/delivery.ts` | `AgentDelivery`: delivers a message to a DeepSeek Harness agent once per request id, also across a restored Session |\n| `src/app/retry-health.ts` | `RetryHealth`: which Sessions wait on a model budget retry, for the `models` health entry |\n| `src/app/role-models.ts` | Resolves the Eval and Executor models, and seeds a new Session with its role's model |\n| `src/app/assessment.ts` | The MasterAssessor, the assessment schema and the window `orchestrator_eval` answers |\n| `src/app/execution-environment.ts` | The execution environment: its variables, a Ticket's values, the directory root and the lines of the prompt section, which `src/app/prompts.ts` fills into its template |\n| `src/app/source-context.ts` | `sourceContextOf`: each Source kind's `SourceContext` |\n| `src/app/links.ts` | `sourceLink`, the page of a Trigger's message, and `candidateCard` |\n| `src/app/cards.ts` | Compact cards of Triggers, Tickets, Threads and Decisions for models, the closed set of ticket card states `TICKET_STATES`, and `textPage` |\n| `src/app/resources.ts` | `RESOURCES` and `readResource`: what `orchestrator_read` reads, for each role |\n| `src/app/tools/tool.ts` | The `Tool` type, `readTool`, the `orchestrator_read` of both roles, and `AcknowledgementSchema` |\n| `src/app/tools/main.ts` | The main Session's tools |\n| `src/app/tools/executor.ts` | An Executor Session's tools |\n| `src/app/http.ts` | The `/orchestrator/api` routes: the same-origin check, request limits and one status per kind of failure |\n| `src/app/api.ts` | `Api`, every route with its parameters, query, body and response, and the filters of the lists; it imports only types, so the panel bundles it |\n| `src/app/views/text.ts` | The two forms of a view's text: `preview`, plain text on one line, and `markdown` without HTML; `plain` and `readable` |\n| `src/app/views/records.ts` | The rows the views share: Triggers, Tickets, Threads, Decisions and Channel links, and `ownersOf`, the owners of follow-ups as one request reads them |\n| `src/app/views/tickets.ts` | The Ticket lists by stage, a Ticket's page, the Mandate basis facts and the Executor's load |\n| `src/app/views/threads.ts` | The Thread lists, a Thread's timeline, the search and the Decision list |\n| `src/app/views/sources.ts` | The Source status: each Source instance's state, its last day's counts, and what it filtered and dropped in that day |\n| `src/app/views/settings.ts` | The settings page's view: each block with its revision, each Source's settings with its kind's form, and the execution environment |\n| `src/app/views/overview.ts` | The overview: Tickets that need a person, problems, the last day's flow and the Executor's load |\n| `src/executor/dsh.ts` | The DshExecutor, `WorkerSlots`, `ticketExecution`, `inputMessage` and `mandateInstructions` |\n| `src/executor/background.ts` | A worker's background work in DeepSeek Harness, the shell jobs its Session owns (`ctx.jobs`) and its subagents (`ctx.subagents`): `runningJobs`, `untilQuiet`, `killJobs`, `collectJobs`, `stopSubagents`, `stopBackground`, `until`, and `cancelled`, the workers whose turn a stop of their subagents cancelled |\n| `src/infra/commands.ts` | `Commands`, the CLI transport: `run`; `api` and `pages`, limited to the configured repository and validated; `lark` as the bot; `git`. `CliError` carries the code a command's output reports, such as a GitHub HTTP status, and a command that prints nothing fails with how it ended, never with its arguments; `validItems` skips and counts the malformed items of a list |\n| `src/infra/environment.ts` | The agent's process environment: command shims, the git configuration and credential helper, `runAsWorker`, and the checks of the environment and of a Ticket's directory |\n| `src/infra/paths.ts` | The package's root, where packaged files are |\n| `src/infra/text.ts` | Word counts and the chat message limit, `fill` and `sameName` |\n| `src/infra/health.ts` | The `HealthBoard`, every part's health entry, each claimed by its one writer |\n| `src/sources/kind.ts` | The `SourceKind` protocol |\n| `src/sources/registry.ts` | `SourceRegistry` |\n| `src/sources/host.ts` | `SourceHost`, `SourceContext`, `Health`, `health` and the fixed health texts |\n| `src/sources/poll.ts` | What GitHub and Feishu polling share: `POLL_HORIZON_MS`, `polled`, `cursorAt`, and `pollThreads`, which keeps a failure on its Thread as `pollError` |\n| `src/sources/github.ts` | The GitHub kind and plugin entry, exported as `./github-watch`: a poll round of notifications, the pull requests of open Tickets with their CI, and subscribed Threads |\n| `src/sources/github-trigger.ts` | GitHub comments, reviews, Issue bodies and CI changes as Triggers, and GitHub addresses |\n| `src/sources/github-pull.ts` | The pull request rules: which pull requests a Ticket follows (`claimPull`, `observePull`), the closes it reports to the Engine, and `pullEndNotices`, the chat notice of a Ticket that ended merged or closed |\n| `src/sources/github-channel.ts` | The GitHub Channel: comments and review thread replies, `sent` or `gone` |\n| `src/sources/github-read.ts` | CI snapshots, repository reads, the `github/` resources, and `githubThreadContext`: an Issue's or pull request's conversation by page |\n| `src/sources/feishu.ts` | The Feishu kind and plugin entry, exported as `./feishu-watch` |\n| `src/sources/feishu-trigger.ts` | Feishu messages as Triggers, by one rule for live events, history pages and topic pages |\n| `src/sources/feishu-loops.ts` | The Feishu loops: the event consumer, history recovery, chat names and polling of subscribed topics |\n| `src/sources/feishu-channel.ts` | The Feishu Channel: topic replies, `sent` or `gone` |\n| `src/sources/feishu-read.ts` | The `feishu/` reads of a Trigger's message, its root, parent and topic, and `feishuThreadContext`, which gives them to assessments with their images |\n| `src/sources/admission-context.ts` | The bounded window an assessment starts from: the first pages of a Trigger's Thread, read through its kind, and the messages around the Trigger |\n| `src/sources/feishu-image.ts` | Reads a Feishu message's image as an attachment for the assessing Session |\n| `src/client/index.tsx` | The client plugin entry: the sidebar entry, the main panel and the page in DeepSeek Harness's Plugin Manager |\n| `src/client/app.tsx` | The panel: header, search, glossary, tabs and the page of the current route |\n| `src/client/provider.tsx` | What every page reads from its host: copy, calls, navigation, notices, the state poll, and `restart`, which reads the state quickly while dsh-superagent restarts |\n| `src/client/api.ts` | Calls and polls of the management API, typed by `src/app/api.ts`, and the Decision filters of the Eval status |\n| `src/client/route.ts` | The tabs, the settings groups, the typed routes that `parseRoute` reads, and the route memory with the settings group opened last |\n| `src/client/overview.tsx` | The overview |\n| `src/client/source.tsx`, `trigger.tsx`, `eval.tsx`, `execution.tsx` | One file per stage: its status, and its settings where it has some |\n| `src/client/thread.tsx`, `ticket.tsx` | The record pages: a Thread with its timeline, and a Ticket with its authorization, Inputs and Assignments |\n| `src/client/settings.tsx` | The Settings tab: the group navigation and the group on screen |\n| `src/client/settings-kit.tsx` | The building blocks of settings blocks: the settings the stage groups share, `useBlockDraft`, the fields, among them a Source kind's, and the history of saves |\n| `src/client/prompts.tsx` | The Prompts settings: the page owns the view it read and its editor the draft, and the Edit, Full prompt and History tabs render from them; a built-in part's editor shows a changed default and keeps or drops the override |\n| `src/client/prompt-config.ts` | The prompt configuration by section, by the team sections, skill names, built-in parts (`part/<key>`, with `withOverride`) and part headings the prompt views give, and the line diff of the full prompt, as pure functions |\n| `src/client/deployment.tsx` | The Deployment settings, also shown in DeepSeek Harness's Plugin Manager |\n| `src/client/draft.tsx` | Settings drafts: `draftReducer`, their states and their merge with a newer saved revision, `saveBarText`, the save bar's line, and the save bar |\n| `src/client/controls.tsx` | Local copies of DeepSeek Harness's controls, which follow its markup, keyboard behaviour and design tokens, since the bundle does not import `@deepseek-ai/dsh-client-ui-primitives`; they read no context |\n| `src/client/widgets.tsx` | The small components the pages share, which read the panel's context: sections, page heads, load states, times, links, confirmed actions, the setup check and Markdown |\n| `src/client/rows.tsx` | The rows the pages share: a Ticket, a Thread and a Decision, a Thread's chip, and the folding of runs of automated messages |\n| `src/client/markdown.ts` | The Markdown subset of reports and questions, and the bare addresses in messages, as blocks and inline parts |\n| `src/client/text.ts` | Copy by key and the wording of domain values, reasons, senders and times |\n| `src/client/marks.ts` | The marks of the states the views classify: a Ticket's or a Thread's stage, a Source's state and a Decision's outcome, each as a dot, an icon, a tone and a label |\n| `src/client/locales.ts` | All copy in both languages, and the glossary of [001 Domain model](001-domain.md) |\n| `src/client/client.css`, `css.d.ts` | The panel's stylesheet, loaded as text |\n\n`src/sources/github.ts` and `src/sources/feishu.ts` are also the entries of the two Source plugins, built by `tsdown.config.ts` and exported in `package.json` as `./github-watch` and `./feishu-watch`. The bundle's `cordis.patch.yml` inserts the three plugins, with Feishu disabled.\n\n## Tests\n\n| Test | Covers |\n| --- | --- |\n| `tests/core-engine.spec.ts` | Domain rules on in-memory repositories: receiving, Eval, fan-out, resume and stop, interrupted Assignments, the pause, Policy changes, reports and outcomes, attaching, replies, failed deliveries and dismissed problems |\n| `tests/stage.spec.ts` | The Ticket stages, row by row |\n| `tests/policy.spec.ts` | Source scope, the gate, the admission table, Mandate revalidation, the Policy version, settings migrations and assessment outcomes |\n| `tests/registry.spec.ts` | `SourceRegistry`: instances, validation, Policy parts, Channels and Thread context |\n| `tests/sources.spec.ts` | The Feishu and GitHub Sources on a `SourceContext`: translation, polls and read positions, the pull request rules, health |\n| `tests/commands.spec.ts` | CLI calls as the deployment's accounts, the Channels' answers, and repository-scoped GitHub calls |\n| `tests/feishu-read.spec.ts`, `tests/github-read.spec.ts` | Feishu and GitHub reads |\n| `tests/admission-context.spec.ts`, `tests/feishu-image.spec.ts` | The Thread window of assessments, and Feishu image reads |\n| `tests/assessment.spec.ts` | What the MasterAssessor keeps per Eval, and when it lets go |\n| `tests/background.spec.ts` | Waiting for a worker's shell jobs and subagents: an end that woke it, and a host that stops |\n| `tests/bundle-patch.spec.ts` | The bundle's patch, read as DeepSeek Harness reads it, and the agent preset of Executor Sessions it defines |\n| `tests/effects.spec.ts` | The effect queue: coalescing, limits, retries with backoff, health and shutdown |\n| `tests/passes.spec.ts` | Passes: one at a time, the ones asked for during a pass run as one after it, and the runtime health a failed pass reports |\n| `tests/outbox.spec.ts` | The Outbox on a running Runtime: messages wait while processing is paused or their Source is not installed |\n| `tests/cache.spec.ts` | `TextCache` |\n| `tests/queue.spec.ts` | The Runtime's work through the effect queue, and what earlier versions stored |\n| `tests/followups.spec.ts` | A person's follow-up on a Ticket's Thread: its notice to the main Session, the tools that act on it, what a burst costs; a worker's hand-back and context follow, and the main Session's note |\n| `tests/health.spec.ts` | One health entry per part, each cleared by its own next success |\n| `tests/delivery.spec.ts` | `AgentDelivery` |\n| `tests/retry-health.spec.ts`, `tests/role-models.spec.ts` | Model budget retries, and the models of the two roles |\n| `tests/runtime.spec.ts` | The whole application on a simulated DeepSeek Harness host, through tools and HTTP |\n| `tests/tools.spec.ts` | The Sessions' tools: what `orchestrator_read` reads for each role, and the shapes and checks of the other main Session tools |\n| `tests/runtime-concurrency.spec.ts` | Work that overlaps: Triggers during a pass, Tickets that change during deliveries and launches |\n| `tests/http.spec.ts` | The same-origin and loopback checks, the status of each kind of failure, the body limit, path parameters and queries |\n| `tests/settings.spec.ts` | Settings saves that race a model or account check, a Policy sync that a save outran, and the refusals of the pause, a sync and a block |\n| `tests/views.spec.ts` | What the management views derive from the Store, such as the Thread a dropped message belongs to |\n| `tests/timeline.spec.ts` | A Thread's pages and a Trigger's neighbours by time and then id, with every received Trigger's time in one form |\n| `tests/migration.spec.ts` | The schema 11 migration: every stored record in its current shape, and the refusal of older schemas |\n| `tests/store.spec.ts` | Repositories and their working sets, in SQLite as in memory, the kv area, with every key of `KV` spelled only in `src/kv.ts` and the migration, settings history and queries |\n| `tests/prompts.spec.ts` | Prompt validation, assembly and versions |\n| `tests/cards.spec.ts` | The rules the built-in text must state, file by file |\n| `tests/model-surface.spec.ts` | Everything models read: tools, prompts, skills and inputs, checked against the tool schemas, the execution environment and the glossary, within a size budget per role |\n| `tests/deployment.spec.ts`, `tests/environment.spec.ts`, `tests/index.spec.ts` | The plugin configuration and setup, the agent's process environment, the plugin entry |\n| `tests/service-script.spec.ts` | `scripts/dsh-superagent` against fake `ps`, `tmux` and `dsh` |\n| `tests/client.spec.tsx`, `tests/navigation.spec.ts`, `tests/controls.spec.tsx` | The client plugin's registration and polling, Session navigation and route memory, the local controls, and the panel's imports, which have no cycle |\n| `tests/panel-overview.spec.tsx`, `panel-source.spec.tsx`, `panel-trigger.spec.tsx`, `panel-eval.spec.tsx`, `panel-execution.spec.tsx` | Each page of the panel, against a fake management API answered by route |\n| `tests/panel-settings.spec.tsx`, `panel-prompts.spec.tsx`, `panel-deployment.spec.tsx`, `panel-panel.spec.tsx` | The settings groups, drafts and history, the prompts, the Deployment page, and the panel's search, glossary and route memory |\n| `tests/draft.spec.ts`, `tests/prompt-config.spec.ts`, `tests/markdown.spec.ts`, `tests/marks.spec.ts` | Draft states, merges and the save bar's line; the prompt configuration by section and the line diff; the Markdown subset and its links; the mark of every state the views classify |\n| `tests/locales.spec.ts`, `tests/styles.spec.ts` | The copy in both languages, the stylesheet |\n| `tests/class-docs.spec.ts` | Every class in `src` has a JSDoc block before it |\n| `tests/docs.spec.ts` | Numbered documents link only to earlier ones, every local link resolves, no document has merge conflict markers, and this document's tables list every module and every test |\n\n`tests/fixtures/` holds what several tests share: `host.ts`, a simulated DeepSeek Harness host; `panel-server.ts` and `panel.tsx`, the fake management API and the panel around a page; `deployment.ts`, a resolved deployment; `git.ts`, the environment of every git the tests start, which names no repository; and `async.ts`.\n\n## Persistence\n\nOne SQLite file, `<stateDir>/orchestrator.sqlite`, which only the Store opens.\n\n| Table | Holds | Written by |\n| --- | --- | --- |\n| `trigger` | Each Trigger, its time `at` in the one form `Date#toISOString` gives, set when the Engine receives it, so times compare as text | Engine |\n| `disposition` | Where each Trigger went: `filtered` with the Source's reason code, its Eval and Decision, the Tickets it reached, by fan-out or attachment, whether it was requeued, the Tickets that handed it back with their reasons, and those whose Executor acknowledged or answered it | Engine |\n| `trigger_thread` | Which Threads each Trigger is on, with its time and whether a person wrote it, so a Thread's Triggers are read without scanning every Trigger, in order of time and then id: a page of a Thread's timeline continues from a `<at>|<id>` cursor, and Triggers that share a time are not skipped | Store, with each Trigger |\n| `thread` | Threads: Subscriptions, the Tickets that follow it for context, queued Triggers, the Eval in progress, the count of its expiries and `meta`; the generated columns `active`, set while Triggers are queued or an Eval runs, and `subscribed`, its Source while a Ticket subscribes to it | Engine; Sources write `meta` |\n| `ticket` | Tickets with their Mandate, origin, execution, Assignments, Channels, Inputs and the Threads they follow; the generated columns `open`, set while it has not ended, and `active`, set while Inputs are undelivered or the latest Assignment is pending or running | Engine |\n| `decision` | Decisions, by Thread | Engine |\n| `effect` | The effect queue: per kind and key, the payload, its order, failed attempts with the last error, and when it is due | Effects; the schema 11 migration queues what earlier versions kept for the main Session |\n| `outbox` | The receipt of each message for a Channel, by id, with the Ticket it is for and its `status`, `pending`, `sent` or `dropped`, kept so an id is never queued twice; for a dropped message, when and why, as the generated column `dropped`, its time, and a reason code. A message that waits has a `reply` effect, which holds its attempts | The Outbox |\n| `kv` | Every other record, by key | The part that names it |\n\nA generated column is computed from its row's JSON and is empty outside its set, and each has an index over its set, so a pass reads only active work. A database that predates a column gets it when the Store opens it.\n\n`KV` (`src/kv.ts`) defines each key-value record's owner, key and type. All readers and writers use these entries; only migration code names older keys.\n\n| Records | Keys or contents |\n| --- | --- |\n| Schema | Current schema version |\n| Settings versions | `settings-revision`, `settings-version:<n>`, `settings-block-revision:<block>`; snapshots include origin, Policy version and affected Tickets |\n| Prompt versions | `prompt-revision`, `prompt-version:<n>` |\n| Main Session | `master-id` |\n| Session prompt history | `session-prompts:<session id>` |\n| Source state | Read positions such as `github-cursor:<number>`, PR CI fingerprints and seen Feishu-topic messages; keys begin with the kind or `thread-` plus a Thread key |\n| Display names | `source-labels:<source id>` |\n\nDismissal is stored on its Decision. Input text is rendered from the Ticket when read, so neither needs a separate key-value record.\n\nRead caches use bounded in-memory `TextCache` instances and are lost on restart. A Session paging through an original Source record or prompt preview must reread offset 0 after a restart. Feishu links resolved after intake are cached the same way; link-based search finds them only after that link has been read during the current process lifetime.\n\nNothing deletes old records yet, so these grow without bound: the `trigger`, `disposition` and `decision` rows; ended Tickets and their Threads; the outbox's receipts; and in `kv`, every saved settings revision and prompt version, the prompt revisions each Session worked under, and the Sources' records per Thread and per Issue or pull request.\n\n`SCHEMA_VERSION` only increases. A database of a newer version refuses to start; `src/app/migration.ts` upgrades a database of the pre-release schema 10 once, at start, and refuses an older one.\n\n## Model-facing interfaces\n\n### Main Session tools\n\nThe main Session has 14 application tools:\n\n| Purpose | Tools |\n| --- | --- |\n| Read and route | `orchestrator_read`, `orchestrator_route` |\n| Manage Tickets | `orchestrator_ticket_retry`, `orchestrator_ticket_request_status`, `orchestrator_ticket_note` |\n| Re-evaluate | `orchestrator_trigger_requeue` |\n| Assess proactive work | `orchestrator_eval`, `orchestrator_eval_read`, `orchestrator_eval_decide` |\n| Communicate and unsubscribe | `orchestrator_reply`, `orchestrator_thread_unsubscribe` |\n| Configure | `orchestrator_settings_save`, `orchestrator_policy_sync`, `orchestrator_prompts_save` |\n\n`orchestrator_route` accepts 1–20 decisions in order. Each accept, attach, stop or ignore runs as a separate Engine command. It also permits ignoring an inferred candidate directly from its card. `orchestrator_ticket_note` sends a fact as context, not authority.\n\nSettings saves select `policy`, `eval`, `executor`, `pause`, or `source`; the last also names its Source id. A prompt save with `preview: true` composes text without saving.\n\nThe main Session also has DeepSeek Harness's `skill`, `bash`, `read`, `read_image`, `job_output`, `job_list` and `job_kill`. Avoiding code reads is a prompt rule, not a tool restriction.\n\n### Presets and wait limits\n\nNew main Sessions use `dsh-superagent-router` (`ROUTER_PRESET`). Shell commands and job waits return after 5 seconds. If the Web UI selects another preset before the first turn, `Sessions` restores this preset, or `WORKER_PRESET` for a worker.\n\nThe `noWait` guard in `src/app/sessions.ts` refuses main-Session shell commands that invoke `sleep` at a command position, shell `timeoutMs` above 30 seconds, and `job_output` waits above 5 seconds. Reports and job results arrive automatically, so waiting only delays incoming candidates.\n\nExisting main Sessions on `standard` also need explicit timeouts for foreground commands and job waits; otherwise that preset's defaults hold the step for 60 and 30 seconds respectively. The host determines the current preset through `presetForSession`, falls back to the Session projection or header, and assumes `standard` if it cannot read the value.\n\n### Executor tools\n\nEach Executor has six application tools:\n\n| Tool | Purpose |\n| --- | --- |\n| `orchestrator_read` | Read resources available to its own Ticket |\n| `orchestrator_ack` | Acknowledge a request |\n| `orchestrator_report` | Report progress or an outcome, binding a pull request under the pull-request rules |\n| `orchestrator_thread_unrelated` | Drop an unrelated attached Thread, hand back its owned follow-ups and tell the main Session why |\n| `orchestrator_thread_follow` | Subscribe to a related Thread for context and tell the main Session |\n| `orchestrator_trigger_handback` | Hand back a message once, with a reason carried by its candidate |\n\nA hand-back returns `queued: false` if another Ticket still owns the message, or this Ticket never owned it. For example, a bot message went to Eval independently.\n\nThe worker preset is defined in `cordis.patch.yml` and selected through `WORKER_PRESET`. `WORK_TOOLS` in `src/app/sessions.ts` retains available file, search, shell, job, web, skill, todo and subagent tools. Workers do not receive tools for asking or presenting to a person, changing the profile, scheduling work outside worker slots, starting or messaging other Sessions, or editing external documents. Tool calls are refused after the Ticket ends.\n\n### Result shapes and assessment context\n\nRouting results use `{decision?, reason, ticket?}`. `orchestrator_route` returns `{results}`, preserving item order and adding each item's `trigger_id` and `kind`. Invalid or refused items return `refused` and a reason without stopping the batch.\n\nSettings and prompt saves return the saved configuration. Policy sync returns the Source, allowed-list size, and `added` and `removed` names.\n\n`orchestrator_eval` returns context rather than instructions. Assessment instructions live in `runtime/admission` (`prompts/admission.md`), and rules in `runtime/policy`. Its context includes:\n\n- The Trigger text, up to 4,000 characters, with image ids and other Triggers in the batch.\n- Up to eight `related_tickets`, open ones first, and `tickets_total`.\n- The Eval's `policy_version`.\n- A Thread window: the first five messages and five on either side of the Trigger. Messages use `{id, from, at, text}`, normally limited to 400 characters, or 1,200 for the two on either side. Truncated messages include `chars`; image references use `images`.\n- Other loaded messages as `{id, from, preview}` stubs of 50 characters. `orchestrator_eval_read` expands them by id.\n\nTicket cards use the closed `TICKET_STATES` set from `src/app/cards.ts`: an open stage such as `person/review` or `working/queued`, or an ended outcome. Acknowledgements are limited to 100 words whether submitted through accept, assessment or `orchestrator_ack`.\n\n### Read resources\n\n`RESOURCES` in `src/app/resources.ts` defines the resources and generates the tool's `resource` description.\n\n| Resources | Content |\n| --- | --- |\n| `tickets`, `triggers`, `threads`, `decisions` | Paged lists as `{items, next_offset}`; activity lists put newest first |\n| `decision/<id>` | One Decision |\n| `thread/<key>` | Label, Tickets, recent Decisions and a page of Triggers |\n| `trigger/<id>` | Message text, replied-to Trigger and neighboring messages, excluding CI runs |\n| `ticket/<id>` | Related ids, source-batch Triggers, Threads, and first pages of Assignments and Inputs |\n| Ticket subresources | `/assignments`, `/inputs`, `/assignment`, `/result`, `/report/<assignment id>`, `/transcript`, `/message/<n>`, `/input/<id>` |\n| `settings`, `settings/<block>` | Revisions and summaries, or a complete block ready to save |\n| `prompts`, `prompts/<revision>`, `prompts/current`, `prompts/defaults`, `prompt-preview/<id>` | Prompt configurations and composed text |\n| `models`, `models/<provider>` | Available models |\n| `feishu/<trigger id>/…`, `github/…` | Original Source records, described in the Source skills |\n\nTicket Threads are marked `context` for context-only follows and `bound` for Source bindings. Assignment pages are newest first and include report previews. Continue lists with `next_offset`. `/input/<id>` accepts an Input's name or id. `settings` includes small blocks in full and summarizes Policy and Source blocks.\n\nSource resources include message neighborhoods, `github/pulls/<n>/thread/<comment id>` and `github/commits/<sha>/checks`.\n\nAn original's messages read in one compact shape, `{id, from, at, text, reply_to?, path?, line?, url?}`, not as GitHub or Feishu records them.\n\nAn Executor Session reads only its own Ticket, its Threads, the Triggers that reached it or that its request held, the prompt versions it worked under and the originals, and its pages leave out the ids of what it cannot read, Decisions and other Tickets.\n\nEvery id a page shows reads through one of these, so a Session walks from one object to the next; hashes nothing reads by, such as an Eval's id or a Policy version, stay off the pages.\n\nA text page has 4,000 UTF-16 code units by default and 8,000 at most, a list 20 items by default and 50 at most.\n\nThe names `event/`, `task/` and `observation/` of earlier versions still resolve.\n\n### Messages delivered to Sessions\n\nThese messages are steered into the main Session's turn:\n\n| Message | Content |\n| --- | --- |\n| Candidate | Batch Trigger cards, Thread, `related_tickets`, `tickets_total`, `delivered_to`, referenced Tickets from Issue/PR links, `handed_back` reasons and the next action |\n| `follow_up` | One message as its Executor sees it, `replies_to`, receiving Tickets, and the reminder that Executors decide it while the main Session may only stop work |\n| `worker_report` | Ticket card, originating Trigger, state and summary up to 600 characters; `chars` and a read pointer when truncated |\n| `worker_attention` | Ticket card carrying the question |\n\nOther notices are injected without waking the main Session: `ticket_ended`, `settings_saved`, prompt saves, Trigger requeues, dropped Subscriptions and context follows. A settings notice names the block, changed paths and `read: settings/<block>`. The main Session receives no redundant notice for a save, requeue, unsubscribe or attach it performed itself.\n\nWorkers receive assignments and Inputs inline. The first message includes the title, up to 1,500 characters of assignment text and the source Trigger card. Inputs carry a Trigger card with up to 600 characters and `replies_to`, or plain Input text. Read pointers appear only for truncated content.\n\n### Panel-only actions\n\nThere is no tool for dismissing an unavailable Decision, rerunning setup, refreshing Source display names, or sending an Executor-owned human follow-up to Eval. The last action is deliberately refused by `orchestrator_trigger_requeue`. Other panel actions have equivalent tools.\n\nMost built-in instructions live in `prompts/*.md`, with one sentence per line joined by `promptFile`. Source skills live in `skills/dsh-superagent-*/SKILL.md`. Tool descriptions and fixed notices such as restart recovery notes remain in code. Assessment instructions live only in `prompts/admission.md`.\n\n`tests/model-surface.spec.ts` checks these surfaces for drift. [004 Prompts](004-prompts.md) explains the team's editable parts.\n\n## Configuration reload\n\nEvery plugin configuration key except `stateDir` is volatile. The panel's Deployment settings and DeepSeek Harness's Plugin Manager edit them through DeepSeek Harness's configuration form; the host writes `cordis.patch.yml` and updates the values in place, and dsh-superagent reads each limit when it uses it, so a change applies without a restart.\n\nA settings save that changes a Source field setup reads, such as an account's CLI, and any save while setup waits, restarts dsh-superagent. DeepSeek Harness's settings service does not serve the entry during that restart, so after its own restart dsh-superagent asks it to read the entry again, and an open form becomes editable again.\n\n## Reviewing a change against real data\n\nPoint `DSH_HOME` at a temporary directory and create a new profile there. Copy the database from a backup, disable every Source, pause processing and remove the main Session id. Give the GitHub and Feishu CLIs read-only stand-ins.\n\n## Open questions\n\n- Trust: which Trigger fields are trusted, such as the Source's actor and Thread membership, and which are not, such as the body and quotes.\n- Deployment isolation: the agent's profile on its own pinned DeepSeek Harness installation, so upgrading DeepSeek Harness elsewhere does not break it.\n"},"L08":{"readme":"# L08 · Cookbook 端到端实战\n\n> 对应原型原文：`dsh-superagent-prototype/docs/008-cookbook.md`\n> 先修：L01–L07 全部（这一课把前七课亲手串一遍）。\n\n## 这课学什么\n\n照 `docs/008` 的 **11 步**写出一个 webhook Source kind，从「映射一个外部事件」做到「构建 / 注册 / 重启生效 / 交付」。学完要能回答：接一个新 Source 的本质是什么，以及哪三个不变量保证它不会把系统搞乱。\n\n三个关键词：稳定 id、ScopeResult、游标只在成功后推进。\n\n## 三个问题\n\n1. 为什么 `Trigger.id` / `Thread.id` / `channel.address` 必须一次定稳？重读消息凭什么安全？\n2. `scope` 为什么只能依赖 `meta` 与配置？`channel.send` 为什么只有永久失败才返回 `gone`？\n3. 从写完 `apply()` 到真的能收消息，`tsdown` / `exports` / `patch` / `profile` / `restart` 各起什么作用？\n\n## 课程材料\n\n| 文件 | 用途 |\n|---|---|\n| `README.md` | 本文件 |\n| `TUTORIAL.md` | 精读 cookbook 的 `webhookTrigger` / `scope` / `sendWebhook` / `apply` / `pollQueue` / 构建装配 + 2 个实验 |\n| `index.html` + `data.js` | 18 个模块、20 步流转、端到端状态机、7 个真实代码锚点 |\n\n## 学习路径\n\n1. 通读 `docs/008` 的 11 步，先把 Step 1 的映射表抄下来 —— 它是后面所有代码的约束。\n2. 对照 `src/sources/kind.ts` 的 `SourceKind<C>` 类型总纲，看每一步补的是哪个可选字段。\n3. 播放动态演示：第 1–8 步是 Step 1–9 的编码，第 9–10 步是轮询与游标，第 11–13 步是构建与重启，第 14–19 步是一条消息走完 L07 的全链路（含 `gone` 分支），第 20 步是测试与文档索引。\n4. 跑两个实验：稳定 id + 去重 + scope + 游标模拟器，幂等收据 + gone / retry / 排序模拟器。\n\n## 动态演示怎么看\n\n- 第 1 步就点明不可回头的决定：`Trigger ids, Thread ids and Channel addresses are persisted`，以后改会让已有记录失联。`key('webhook', message.id)` 用稳定 id，编辑要区分就把 edit version 拼进 key（GitHub 用 `updated_at`）。\n- 第 4 步 `scope` 只吃 `meta` 与配置，因为 **revalidate 会用 Mandate 里存的 meta 重放**；被过滤的消息也必须交给 `receive`，面板才有 disposition 可解释。\n- 第 5 步 `--key message.id` 是幂等键：远端可能已收到但本地才发现失败。只有 `410` 这类永久不可达返回 `gone`，其余抛错让 Outbox 从 5s 退避到 300s。\n- 第 10 步是正确性核心：`ctx.state.set(cursor, page.next)` 在**所有** `ctx.receive` 成功之后。中断一轮游标不动，稳定 id 让重放全变 `duplicate`。时间戳游标用 `cursorAt(started)` 减 5 秒容忍迟到。\n- 第 11–13 步提醒「写完代码 ≠ 生效」：tsdown entry → `package.json` export → bundle 插件行（`disabled: true`）→ profile 开关 → 重启，一个都不能少。\n- 第 15–18 步就是 L07 那条链的复现：`explicit → orchestrator_route → Engine.decide → Outbox.send → channel.send`。注意 **Source 不能自己结束工单**，Ticket 何时结束仍由 Engine 决定。\n\n## 验收标准\n\n- [ ] 能写出 Step 1 映射表的五项（Trigger / Thread / Actor / Channel / scope row）。\n- [ ] 能解释 `webhookTrigger` 里 `sender.id === me → undefined` 与 `addressed: 'mention'` 的作用。\n- [ ] 能说明为什么 `policy.row` 必须等于 `scope` 返回的 `row`。\n- [ ] 能实现 `pollQueue`，并解释 `{ read: 3, unreadable: 1 }` 与 `cursor === 3` 两个测试断言。\n- [ ] 能列出从代码到生效的 5 个装配动作，以及 `tests/docs.spec.ts` 检查的两张索引表。\n\n## 与前课的关系\n\nL01 的 Trigger/Thread/Channel、L02 的 gate / explicit、L03 的 Outbox、L04 的 environment 变量、L05 的面板解释过滤、L06 的 bundle patch 与重启、L07 的端到端链路，在这 11 步里全部被用到一次。这是结课，不是新知识。\n\n## 易错点速查\n\n| 误解 | 正确理解 |\n|---|---|\n| 以后可以改 id / Thread / Channel | 三者持久化，改了会让已有记录失联；时间戳或随机数塞进 id 会让重放变成新工单 |\n| `scope` 可以读外部状态 | revalidate 会用存下的 meta 重放；只能依赖 `meta` 与配置 |\n| 过滤掉的消息不用交给 `receive` | 必须交，面板需要 disposition 才能解释为什么过滤 |\n| 任何发送失败都返回 `gone` | 只有永久不可达（如 410）才 gone；其余抛错交给 Outbox 退避 |\n| 游标可以边读边推进 | 必须全部 `receive` 成功后才推进；中断一轮游标不动 |\n| 写完 `apply()` 就能收消息 | 还需 entry / exports / patch 行 / profile 开关 / 重启 |\n| Source 能自己结束 Ticket | 只有 Engine 决定 Ticket 何时结束 |\n| `KV` key 字面量可以散落 | `tests/store.spec.ts` 要求 key 字面量只出现在注册表里 |\n\n## 源码坐标\n\n```\ndocs/008-cookbook.md              11 步教程 / 映射表 / 全部示例代码 / 测试断言\nsrc/sources/kind.ts               SourceKind<C> / SourceChannel / ScopeResult 类型总纲\nsrc/sources/registry.ts           SourceRegistry.register / send（waiting / sent / gone）\nsrc/core/ports.ts                 ScopeResult / SourceScope / Outbox\nsrc/app/outbox.ts                 Outbox.send（receipt + reply effect 同事务）\nsrc/kv.ts                         KV.webhook.cursor 注册表\nsrc/app/runtime.ts                Runtime.initialize / restart\ntsdown.config.ts                  entry: webhook-watch\npackage.json                      exports: ./webhook-watch\ncordis.patch.yml                  insert 插件行 disabled: true\ntests/webhook.spec.ts             真实 Store + stand-in ports 的端到端断言\ntests/docs.spec.ts                校验 007 的 Modules / Tests 索引表\ntests/store.spec.ts               KV key 字面量集中性\n```\n\n## 下一步\n\n八课到此闭环。若要继续，可把 L07 的「可移植 vs 要替换」清单当作底座改造的输入：保留 `src/core` + ports，替换 Runtime / DshExecutor / Sessions / Sources / bundle patch，并把 L06 的 Cordis patch 词汇降为纯组合层。\n","tutorial":"# L08 代码教程 · Cookbook 端到端实战\n\n片段逐字抄自 `dsh-superagent-prototype/docs/008-cookbook.md`。实验代码纯 JS，可直接 `node` 运行。\n\n## 1. 源码地图\n\n| 路径 | 符号 | 看什么 |\n|---|---|---|\n| `docs/008:19-29` | Step 1 映射表 | Trigger / Thread / Actor / Channel / scope row 五项的稳定约定 |\n| `src/sources/kind.ts` | `SourceKind<C>` / `SourceChannel` | 全部实现步骤的类型总纲 |\n| `docs/008:100-117` | `webhookTrigger` | 稳定 id、防环、`addressed` |\n| `docs/008:138-142` | `scope({meta}, config)` | 可重放的接收判据 |\n| `docs/008:163-179` | `sendWebhook` | `--key` 幂等与 410 → gone |\n| `docs/008:255-267` | `apply(ctx)` | `inject` / `ctx.effect` / AbortController |\n| `docs/008:300-324` | `pollQueue` | 读位点只在成功后推进 |\n| `docs/008:336-353` | entry / exports / patch / tests | 从代码到生效的装配 |\n| `src/sources/registry.ts` | `SourceRegistry.send` | `waiting` / `sent` / `gone` |\n\n## 2. 逐段精读\n\n### 2.1 Step 1 — 先把映射定死，再写代码\n\n`docs/008` 开头那句必须逐字记住：\n\n> Trigger ids, Thread ids and Channel addresses are persisted, so changing them later can disconnect existing records.\n\n一个外部事件映射为：Trigger = 一条消息、Thread = `${conversation}:${firstId}`、Actor = 队列 sender id、Channel = conversation + 被回复消息、scope = conversation 对应的 admission row。**这些值一旦落库就不能改**；若要把「编辑」当新事件，把 edit version 拼进 `key`（GitHub Source 用 `updated_at`）。Step 2 的 `ConfigSchema` 用 zod `.strict()`：`conversations[].listen ∈ {mentions, all}`、`pollSeconds` 默认 30（10..3600）、`health: ['webhook']` 注册时 claim —— 与 `runtime / effect kind / sync:` 等保留名冲突会被拒。\n\n### 2.2 Step 3 — `webhookTrigger`：稳定 id 与防环\n\n`docs/008:100-116`：\n\n```ts\nexport function webhookTrigger(message: QueueMessage, me: string): Trigger | undefined {\n  if (message.sender.id === me) return undefined\n  const thread = `${message.conversation}:${message.thread ?? message.id}`\n  return {\n    id: key('webhook', message.id),\n    source: 'webhook',\n    threads: [{ source: 'webhook', id: thread }],\n    actor: { source: 'webhook', id: message.sender.id },\n    human: !message.sender.bot,\n    ...(message.mentions_me ? { addressed: 'mention' as const } : {}),\n    at: message.at,\n    text: message.text,\n    channel: { source: 'webhook', thread: `webhook:${thread}`,\n      address: { conversation: message.conversation, message: message.id, ...(message.url ? { url: message.url } : {}) } },\n```\n\n- `sender.id === me → undefined`：绝不给自己造 Trigger（防环）。\n- `id: key('webhook', message.id)`：稳定 id，让 `Engine.receive` 能返回 `'duplicate'`，**重读消息因此安全**。\n- `...(mentions_me ? { addressed: 'mention' } : {})`：显式请求的来源，L02 的 gate 据此给 `explicit`。\n- `channel.thread` 决定同 Ticket 同会话的排序（L03 `receipts.behind`）。\n- `meta` 只放 Source 私有字段（conversation / messageId / root），因为下面 `scope` 要依赖它，而且 revalidate 会重放它。\n\n### 2.3 Step 4 — `scope` 只吃 `meta` 与配置\n\n`docs/008:138-142`：\n\n```ts\n  scope({ meta }, config) {\n    const conversation = config.conversations.find(item => item.id === meta.conversation)\n    if (!conversation) return { listened: false, reason: 'conversation_not_listed' }\n    return { listened: true, observed: conversation.listen === 'all', row: conversation.id }\n  },\n```\n\n`docs/008:149` 的原话是「Make it depend only on meta and configuration」。原因有两层：① `revalidate` 用 Mandate 里**存下来的 meta** 重放，读外部状态会得到不同结果；② 被过滤的消息**也必须交给 `ctx.receive`**，面板才能用 disposition 解释为什么过滤，所以 `Engine.receive` 有 `'filtered'` 这一返回值。`row` 必须与 Step 7 `policy.rows` 产出的值相同，否则准入表对不上。\n\n### 2.4 Step 5 — `sendWebhook`：幂等与永久失败\n\n`docs/008:163-174`：\n\n```ts\nexport async function sendWebhook(host: Pick<SourceContext, 'commands'>, message: OutboundMessage): Promise<'sent' | 'gone'> {\n  const { conversation, message: to } = message.channel.address\n  if (!conversation || !to) throw new Error('Missing webhook reply target')\n  try {\n    await host.commands.run('hookq', ['reply', '--conversation', conversation, '--to', to, '--key', message.id,\n      '--text', message.text])\n    return 'sent'\n  } catch (error) {\n    if (error instanceof CliError && error.code === 410) return 'gone'\n    throw error\n  }\n```\n\n`--key message.id` 是幂等键：发送可能在远端已收到之后才失败，重试时必须让远端识别为同一条。只有 `410`（消息被撤回 / Issue 被删这类**永久不可达**）返回 `'gone'`，Outbox 落 `channelGone` / `dropped` 并永不重排；其余失败 `throw`，交给 L03 的 5s → 300s 退避。`SourceRegistry.send` 在 kind 未安装时返回 `'waiting'`（`Later`），保序只限同票同会话。\n\n### 2.5 Steps 6–8 — 上下文、Policy、环境\n\n- `threadContext.read` 给 `orchestrator_eval` 初始窗口与 `eval_read` 翻页，`part ∈ {thread, root, parent}`，消息字段是有界的 `{id, from, at, text, bot?, url?}`；`repliesTo(trigger)` 返回 `key('webhook', meta.replyTo)`。\n- `policy.rows(stored)` 用 `ConfigSchema.parse` 为每个 conversation 产行，`cells` 由 `listen === 'all'` 决定 `listedUnaddressed / unlistedUnaddressed`；**`row` 必须等于 `scope` 返回的 `row`**。\n- `environment.variables` 前缀 `DSH_SUPERAGENT_<KIND>_`，**绝不放凭据**（凭据由 L06 的 worker shim 负责），非本 Source 的票返回空串。\n\n### 2.6 Step 9 — `apply` / `watch` / `pollQueue`\n\n`docs/008:255-267`：\n\n```ts\nexport const name = 'dsh-superagent-webhook'\nexport const inject = ['orchestrator']\nexport function apply(ctx: Context): void {\n  ctx.effect(() => ctx.orchestrator.sources.register(webhookKind), 'webhook: source kind')\n  ctx.effect(() => {\n    const source = sourceContext(ctx.orchestrator, webhookKind)\n    const controller = new AbortController()\n    // DSH ends its process on an unhandled rejection, so a failure that escapes the loop becomes the Source's health.\n    const running = watch(source, controller.signal)\n      .catch((error: unknown) => { source.report('webhook', { state: 'error', detail: String(error) }) })\n    return async () => { controller.abort(); await running }\n  })\n}\n```\n\n注册 kind 与轮询循环都用 `ctx.effect` 登记 disposer，卸载时自动清理。`watch` 里先 `await ctx.ready`、`if (!ctx.configured())` 就 `report('paused','setupPending')` 并返回；连续 3 次失败才 `report('error','pollFailures')`。`AbortController` 让 stop / restart 立即结束循环 —— `signal` 必须同时传给命令与 `delay`。\n\n`docs/008:300-316`：\n\n```ts\nexport async function pollQueue(ctx: SourceContext, signal: AbortSignal): Promise<{ read: number; unreadable: number }> {\n  const after = ctx.state.get(KV.webhook.cursor) ?? 0\n  const output = await ctx.commands.withSignal(signal).run('hookq', ['pull', '--after', String(after), '--json'])\n  const page = PageSchema.parse(JSON.parse(output))\n  let unreadable = 0\n  for (const item of page.items) {\n    if (signal.aborted) throw new Error('The webhook Source stopped during the read')\n    const message = MessageSchema.safeParse(item)\n    if (!message.success) { unreadable++; continue }\n    const trigger = webhookTrigger(message.data, page.me)\n    if (!trigger) continue\n    await ctx.receive(trigger)\n    const conversation = { label: { zh: '对话', en: 'Conversation' }, value: message.data.conversation }\n    for (const ref of trigger.threads) ctx.threads.describe(threadKey(ref), { facts: { conversation } })\n  }\n  ctx.state.set(KV.webhook.cursor, page.next)\n  return { read: page.items.length, unreadable }\n}\n```\n\n**最后一行 `ctx.state.set(...)` 是全篇最重要的顺序约束**：游标只在所有 `ctx.receive` 都成功之后推进。中断的一轮游标不动，重放时稳定 id 让每条消息都返回 `'duplicate'`，于是既不会丢、也不会重复建单。时间戳游标用 `cursorAt(started)` 减 5 秒容忍远端迟到。`KV.webhook.cursor` 的字面量只允许出现在 `src/kv.ts` 注册表里（`tests/store.spec.ts`）。\n\n### 2.7 Steps 10–11 — 从代码到生效，以及测试断言\n\n`docs/008:339-341,346-349`：\n\n```ts\nentry: { index: 'src/index.ts', 'github-watch': 'src/sources/github.ts', 'feishu-watch': 'src/sources/feishu.ts',\n  'webhook-watch': 'src/sources/webhook.ts' },\n    - id: dsh-superagent-webhook\n      name: dsh-superagent/webhook-watch\n      disabled: true\n```\n\n五步装配：`tsdown.config.ts` entry → `package.json` 的 `\"./webhook-watch\"` export → `cordis.patch.yml` 插入 `disabled: true` 的插件行（与现有 feishu 行同构）→ profile 里设 `disabled: false` → 构建 + 重启。`ctx.fiber.restart()` 会重新 `lockSync` / 开 Store / 注册 kind。改 Source 账户字段或 setup 等待中的保存也会触发重启（L05/L06）。\n\n`docs/008:388-396` 的测试断言把整条链钉死：\n\n```ts\n  expect(await pollQueue(h.ctx, new AbortController().signal)).toEqual({ read: 3, unreadable: 1 })\n  expect(await h.receive.mock.results[0]!.value).toBe('stored')\n  expect(await h.receive.mock.results[1]!.value).toBe('filtered')\n  expect(h.store.get(KV.webhook.cursor)).toBe(3)\n  // An allowed sender who mentions the agent makes an explicit request.\n  expect(h.engine.candidate(key('webhook', 'm1'))?.strength).toBe('explicit')\n```\n\n`tests/webhook.spec.ts` 用真实 Store + stand-in ports 跑完整链路；`tests/docs.spec.ts` 检查 `docs/007` 的 Modules / Tests 两张索引表是否完整 —— 加模块就必须补文档，这是架构文档的活校验。**Source 不能自己结束工单**：`Engine.decide` 在一个事务里造 Ticket + 首 Assignment + acknowledgement reply，Ticket 何时结束仍由 Engine 决定。\n\n## 3. 实验 A · 稳定 id + 去重 + scope + 游标 模拟器\n\n```js\nconst key = (kind, id) => `${kind}:${id}`;\nconst config = { conversations: [{ id: 'ops', listen: 'all' }] };\nconst triggers = new Map(), dispositions = new Map(), state = new Map();\nconst received = [];\n\nfunction webhookTrigger(m, me) {\n  if (m.sender === me) return undefined;                  // 防环\n  const thread = `${m.conversation}:${m.thread ?? m.id}`;\n  return { id: key('webhook', m.id), meta: { conversation: m.conversation },\n    thread, addressed: m.mentions_me ? 'mention' : undefined };\n}\nfunction scope({ meta }, cfg) {\n  const c = cfg.conversations.find(x => x.id === meta.conversation);\n  if (!c) return { listened: false, reason: 'conversation_not_listed' };\n  return { listened: true, observed: c.listen === 'all', row: c.id };\n}\nfunction receive(t) {\n  if (triggers.has(t.id)) return 'duplicate';\n  triggers.set(t.id, t);\n  const s = scope(t, config);\n  dispositions.set(t.id, s.listened ? 'stored' : 'filtered:' + s.reason);\n  return s.listened ? 'stored' : 'filtered';\n}\nfunction pollQueue(page, me) {\n  const after = state.get('cursor') ?? 0;\n  if (after >= page.next) return { read: 0, unreadable: 0 };\n  let unreadable = 0;\n  for (const item of page.items) {\n    if (item.broken) { unreadable++; continue; }\n    const t = webhookTrigger(item, me);\n    if (!t) continue;\n    received.push(receive(t));\n  }\n  state.set('cursor', page.next);                        // 全部 receive 之后才推进\n  return { read: page.items.length, unreadable };\n}\nconst page = { next: 3, me: 'bot', items: [\n  { id: 'm1', conversation: 'ops', sender: 'alice', mentions_me: true },\n  { broken: true },\n  { id: 'm2', conversation: 'random', sender: 'alice' }\n] };\nconsole.log('第一轮 =', pollQueue(page, 'bot'), 'receive =', received, 'cursor =', state.get('cursor'));\nconsole.log('自己发的 =', webhookTrigger({ id: 'm3', conversation: 'ops', sender: 'bot' }, 'bot'));\nstate.set('cursor', 0);                                   // 模拟中断后重放同一页\nconsole.log('重放 =', pollQueue(page, 'bot'), 'receive =', received.slice(3));\nconsole.log('稳定 id =', webhookTrigger({ id: 'm1', conversation: 'ops', sender: 'alice' }, 'bot').id);\n```\n\n**断言**：第一轮 `{read: 3, unreadable: 1}`、`receive = ['stored','filtered']`、`cursor = 3`；自己发的返回 `undefined`；游标不动时重放同一页全部为 `duplicate`；同一消息两次映射得到同一个稳定 id。\n\n## 4. 实验 B · 幂等收据 + gone / retry / 排序 模拟器\n\n```js\nconst receipts = new Map(), effects = [], remote = [];\nconst FAILURES_BEFORE_ERROR = 3;\nlet mode = 'success', clock = 0;\n\nfunction Outbox_send(m) {                                // receipt + effect 同事务\n  if (receipts.has(m.id)) return false;\n  receipts.set(m.id, { id: m.id, status: 'pending', attempts: 0, ticket: m.ticket });\n  effects.push({ kind: 'reply', key: m.id });\n  return true;\n}\nfunction delay(attempts) { return Math.min(300000, 5000 * 2 ** Math.min(attempts, 16)); }\nfunction deliver(id) {\n  const r = receipts.get(id);\n  if (!r || r.status !== 'pending') return 'skip';\n  const earlier = [...receipts.values()].find(x => x.ticket === r.ticket && x.id < id && x.status === 'pending');\n  if (earlier && earlier.attempts >= FAILURES_BEFORE_ERROR) { /* 前面的失败 3 次后放行 */ }\n  else if (earlier) return 'Later: behind(' + earlier.id + ')';\n  if (mode === 'gone') { r.status = 'channelGone'; return 'gone（永不重排）'; }\n  if (mode === 'error') {\n    r.attempts += 1; r.due = clock + delay(r.attempts);\n    return 'throw → attempts=' + r.attempts + ', due=+' + delay(r.attempts);\n  }\n  if (!remote.includes(id)) remote.push(id);           // --key message.id 远端去重\n  r.status = 'sent';\n  return 'sent';\n}\nconsole.log(Outbox_send({ id: 'm1', ticket: 'tk-1' }), Outbox_send({ id: 'm1', ticket: 'tk-1' }));\nconsole.log('effect 行数 =', effects.length, '| deliver =', deliver('m1'), '| remote =', remote);\nmode = 'error';\nconsole.log(Outbox_send({ id: 'm2', ticket: 'tk-2' }), deliver('m2'), deliver('m2'), deliver('m2'));\nconsole.log('m2 attempts =', receipts.get('m2').attempts, '（达 3 次后 health 报错）');\nmode = 'gone';\nconsole.log(Outbox_send({ id: 'm3', ticket: 'tk-3' }), deliver('m3'));\nconsole.log('重排 m3 →', deliver('m3'));\nconsole.log(Outbox_send({ id: 'm4', ticket: 'tk-4' }), Outbox_send({ id: 'm5', ticket: 'tk-4' }));\nconsole.log('同票后一条先送 →', deliver('m5'));          // behind 保序\n```\n\n**断言**：同 `id` 连发两次只有一行 effect、远端只出现一次；瞬时抛错 `attempts+1` 且 `delay` 从 5000 指数增长、封顶 300000；`410` 落 `channelGone` 且永不重排；同 Ticket 后一条被 `behind` 阻塞（`Later`），前一条失败 3 次后放行。\n\n## 5. 自检清单\n\n- [ ] 能写出 Step 1 映射表的五项并解释为什么不可改。\n- [ ] 能逐行解释 `webhookTrigger` 的稳定 id、防环、`addressed`、`channel.thread`。\n- [ ] 能说明 `scope` 为何只能依赖可持久化的 `meta` 与配置，以及 `row` 与 `policy.rows` 的关系。\n- [ ] 能区分 `'sent'` / `'gone'` / 抛错三种发送结果及其后果。\n- [ ] 能解释游标为什么必须在所有 `receive` 之后推进，与稳定 id 如何配合。\n- [ ] 能列出从代码到生效的 5 个装配动作，并复述 4 条测试断言。\n\n## 6. 回到动态演示\n\n| 步骤 | 对应源码 |\n|---|---|\n| 1–2 Step 1/2 映射与 ConfigSchema | `docs/008:21,47-54,79` |\n| 3 Step 3 webhookTrigger | `docs/008:100-117` |\n| 4 Step 4 scope | `docs/008:138-142,145,149` |\n| 5 Step 5 sendWebhook | `docs/008:163-179` |\n| 6–7 Step 6-8 上下文 / policy / environment | `docs/008:185-200,215-250` |\n| 8–10 Step 9 apply / watch / 游标 | `docs/008:255-267,289-291,300-324` |\n| 11–13 Step 10 构建与重启 | `docs/008:336-343,345-349,351` |\n| 14–16 端到端链路 | `docs/008:362-400,396,332`、`src/core/engine.ts:48` |\n| 17–18 Outbox / delivery | `src/app/outbox.ts:27-31`、`src/sources/registry.ts:95-98` |\n| 19 gone → dropped | `docs/008:163-179`、`src/app/outbox.ts:45-48` |\n| 20 Step 11 测试与文档索引 | `docs/008:353,413-425`、`tests/docs.spec.ts` |\n","doc":"# 008 Cookbook\n\nThis cookbook shows how to extend dsh-superagent. It uses the terms in [001 Domain model](001-domain.md) and [002 Authorization](002-authorization.md), and the components in [007 Architecture](007-architecture.md).\n\n## Add a Source\n\nThis recipe implements a Source kind called `webhook`. It reads an imaginary message queue through an invented CLI, `hookq`, and converts messages to Triggers. All other interfaces are part of dsh-superagent.\n\nThe implementation has four responsibilities: translate events, define receiving and authorization rules, provide replies and context, and maintain a polling loop. The numbered steps build those pieces in order.\n\nThe example assumes this CLI contract:\n\n- `hookq pull --after <n> --json` prints the messages after position `n`, oldest first: `{\"me\": \"<the agent's id on the queue>\", \"items\": […], \"next\": <position>}`. An item has `id`, `conversation`, `thread` (the id of the message that started its thread, absent on that message), `sender` with `id` and `bot`, `mentions_me`, `text`, `at` and `url`.\n- `hookq reply --conversation <id> --to <message id> --key <key> --text <text>` replies under a message, once per key. For a conversation that was deleted it fails with `{\"error\": {\"code\": 410, \"message\": \"…\"}}` on standard error.\n- `hookq thread --conversation <id> --root <message id> --json`, with `--after <cursor>` for a later page, prints a page of a thread, oldest first: `{\"items\": […], \"next\": \"<cursor>\"}`, without `next` on the last page.\n\nPut the kind and its plugin entry in `src/sources/webhook.ts`, following `src/sources/github.ts`. If the Source grows, split translation, Channel and polling code into separate modules as the Feishu Source does.\n\n### 1. Map the events onto the domain\n\nChoose stable mappings before writing code. Trigger ids, Thread ids and Channel addresses are persisted, so changing them later can disconnect existing records.\n\n| Concept | For the webhook queue |\n| --- | --- |\n| Trigger | One message |\n| Thread | A message and the replies to it in one conversation: `<conversation>:<id of the first message>` |\n| Actor | The sender's id on the queue, as the allowed list names it |\n| Channel address | The conversation and the message a reply goes under |\n| Receiving scope | A conversation, with its own row in the admission table |\n\n### 2. Configuration: schema, fields, facts and health\n\nThe module imports what the steps below use:\n\n```ts\nimport type { Context } from '@deepseek-ai/cordis'\nimport { setTimeout as delay } from 'node:timers/promises'\nimport { z } from 'zod'\nimport { key, threadKey, type OutboundMessage, type Trigger } from '../core/index.ts'\nimport { CliError } from '../infra/commands.ts'\nimport { KV } from '../kv.ts'\nimport { health, sourceContext, type SourceContext } from './host.ts'\nimport type { SourceKind } from './kind.ts'\n```\n\n```ts\nconst ConfigSchema = z.object({\n  conversations: z.array(z.object({\n    id: z.string().regex(/^[a-z0-9-]+$/),\n    listen: z.enum(['mentions', 'all']),\n  }).strict()).default([]),\n  pollSeconds: z.number().int().min(10).max(3600).default(30),\n}).strict()\nexport type WebhookConfig = z.infer<typeof ConfigSchema>\n\nexport const webhookKind: SourceKind<WebhookConfig> = {\n  kind: 'webhook',\n  title: { zh: 'Webhook 队列', en: 'Webhook queue' },\n  description: { zh: '接收 webhook 队列里下列对话的消息。', en: 'Receives the messages of these conversations from the webhook queue.' },\n  schema: ConfigSchema,\n  fields: [\n    { key: 'conversations', type: 'rows', label: { zh: '接收的对话', en: 'Conversations' }, columns: [\n      { key: 'id', type: 'text', label: { zh: '对话', en: 'Conversation' }, pattern: '[a-z0-9-]+' },\n      { key: 'listen', type: 'select', label: { zh: '接收', en: 'Receive' }, options: [\n        { value: 'mentions', label: { zh: '仅 @', en: '@ only' } }, { value: 'all', label: { zh: '全部消息', en: 'All' } }] },\n    ] },\n    { key: 'pollSeconds', type: 'number', advanced: true, min: 10, max: 3600,\n      label: { zh: '轮询间隔 / 秒', en: 'Polling interval / seconds' } },\n  ],\n  health: ['webhook'],\n  // find, scope, channel, threadContext, policy and environment follow in the next steps.\n}\n```\n\n- `kind` is the stable Source id. It appears in Trigger `source`, Thread-key prefixes, the `source:webhook` settings block and the Source Policy.\n- `schema` validates stored configuration and supplies defaults. Before an operator saves an instance, the registry creates an enabled instance from those defaults. Make defaults receive nothing; this example defaults to no conversations.\n- `fields` generates the Source settings form without custom panel code. A `rows` field edits entries keyed by its first column; `advanced` hides less common settings. Implement `refreshLabels` if the Source can resolve ids to display names. Save those names under `KV.sources.labels(kind)`. Columns with `choose` and `refresh` can then offer them.\n- Optional `facts(deployment)` displays values derived by setup, such as the account behind a CLI. Setup currently checks only GitHub and Feishu fields listed in `SETUP_FIELDS`, so this example supplies no facts.\n- `health` declares the Source's health entries, initially `starting`. Registration claims each name and refuses collisions with entries such as `runtime`, `reply`, `worker` or effect kinds. Use the kind's name and reserve `sync:<id>` for Policy syncs. An `error` makes the status script exit 2 and the hourly check notify the operator, so report it only when human action may be needed.\n\n### 3. Translate a message into a Trigger\n\nValidate CLI responses before converting them:\n\n```ts\n/** One message as `hookq pull` and `hookq thread` print it. */\nconst MessageSchema = z.looseObject({\n  id: z.string().min(1), conversation: z.string().min(1), thread: z.string().optional(),\n  sender: z.looseObject({ id: z.string(), bot: z.boolean().default(false) }), mentions_me: z.boolean().default(false),\n  text: z.string(), at: z.string(), url: z.string().optional(),\n})\ntype QueueMessage = z.infer<typeof MessageSchema>\n/** The answer of `hookq pull`, whose items are read one by one, and of `hookq thread`. */\nconst PageSchema = z.looseObject({ me: z.string(), items: z.array(z.unknown()), next: z.number().int() })\nconst ThreadPageSchema = z.looseObject({ items: z.array(MessageSchema), next: z.string().optional() })\n```\n\n```ts\n/** The Trigger of one queue message; the agent's own messages produce none. */\nexport function webhookTrigger(message: QueueMessage, me: string): Trigger | undefined {\n  if (message.sender.id === me) return undefined\n  const thread = `${message.conversation}:${message.thread ?? message.id}`\n  return {\n    id: key('webhook', message.id),\n    source: 'webhook',\n    threads: [{ source: 'webhook', id: thread }],\n    actor: { source: 'webhook', id: message.sender.id },\n    human: !message.sender.bot,\n    ...(message.mentions_me ? { addressed: 'mention' as const } : {}),\n    at: message.at,\n    text: message.text,\n    channel: { source: 'webhook', thread: `webhook:${thread}`,\n      address: { conversation: message.conversation, message: message.id, ...(message.url ? { url: message.url } : {}) } },\n    ...(message.url ? { url: message.url } : {}),\n    meta: { conversation: message.conversation, messageId: message.id, root: message.thread ?? message.id },\n  }\n}\n```\n\n- **Stable ids.** Derive the Trigger id from the queue id through `key`. `Engine.receive` returns `duplicate` for stored ids, and duplicate accepts create only one Ticket. Re-reading messages is therefore safe. To treat edits as new events, include an edit version in the id, as GitHub does with comment `updated_at`.\n- **Threads.** The first Thread is primary and owns the Eval. Additional Threads add Correlation context. The Source chooses the id; its full key is `webhook:<id>`.\n- **Sender.** Use Source-native ids in `actor`. Set `human: false` for bots and CI. Listed bots can only become inferred candidates. An empty actor id, as for CI, uses the admission cell for unlisted, unaddressed senders. Set `addressed` to `mention` or `direct` only when the message actually addresses the agent; this gives an allowed person's message explicit strength. Never produce a Trigger for the agent's own message.\n- **Reply destination and metadata.** `channel` identifies where replies go; `url` links to the source message. `channel.thread` groups messages for ordered delivery: a Ticket's later messages wait behind its earlier ones until an earlier message has failed three times. Other Tickets do not wait. Keep Source-specific fields in `meta`, such as the receiving conversation and Thread root. Both `meta` and `text` are untrusted data, not authorization.\n\nAgents can read the new kind through `orchestrator_read trigger/<id>` and `thread/<key>`. These expose message text, disposition and neighboring Triggers. A new kind does not automatically receive a built-in skill, resources for original service records or pull-request binding.\n\nText search works without extra code. Implement `find(query)` when people use Source-specific references such as message ids, URLs or `#12`. Return the Thread keys and search terms those references identify:\n\n```ts\n  find: query => ({ threads: [], terms: [...new Set(query.match(/\\bm[0-9]+\\b/g) ?? [])] }),\n```\n\nHere a queue message id in the query, such as `m42`, searches the Triggers for it.\n\n### 4. What the Source receives: scope\n\n```ts\n  scope({ meta }, config) {\n    const conversation = config.conversations.find(item => item.id === meta.conversation)\n    if (!conversation) return { listened: false, reason: 'conversation_not_listed' }\n    return { listened: true, observed: conversation.listen === 'all', row: conversation.id }\n  },\n```\n\nThe Engine calls `scope` through `SourceRegistry` for each incoming Trigger. Out-of-scope messages are stored as filtered with their reason and create no Thread. Pass messages to `receive` rather than silently dropping them in the polling loop, so the panel can explain filtering.\n\n`observed: true` means the Source receives unaddressed messages in that scope, allowing admission-table decisions for them. `row` identifies the corresponding admission row.\n\nRevalidation calls `scope` with the Mandate's stored metadata. Make it depend only on `meta` and configuration. Resuming requires `listened`, not `observed`. Without `scope`, a kind receives every Trigger it produces but observes none.\n\n### 5. Replies: the Channel\n\n```ts\n  channel: {\n    allowed: (address, config) => config.conversations.some(item => item.id === address.conversation),\n    send: sendWebhook,\n    link: address => ({ url: address.url ?? '',\n      label: { zh: `Webhook 对话 ${address.conversation}`, en: `Webhook conversation ${address.conversation}` } }),\n  },\n```\n\n```ts\nexport async function sendWebhook(host: Pick<SourceContext, 'commands'>, message: OutboundMessage): Promise<'sent' | 'gone'> {\n  const { conversation, message: to } = message.channel.address\n  if (!conversation || !to) throw new Error('Missing webhook reply target')\n  try {\n    await host.commands.run('hookq', ['reply', '--conversation', conversation, '--to', to, '--key', message.id,\n      '--text', message.text])\n    return 'sent'\n  } catch (error) {\n    if (error instanceof CliError && error.code === 410) return 'gone'\n    throw error\n  }\n}\n```\n\n- **Idempotent sends.** Outbox calls `SourceRegistry.send`, which invokes `channel.send`. Messages wait while the Source plugin is unloaded. A send may fail after the remote service received it, so retries must not duplicate messages. Use `message.id` as an idempotency key: `hookq` supports `--key`; GitHub stores a hidden comment marker; Feishu accepts an idempotency key.\n- **Permanent versus retryable failure.** Return `sent` on success and `gone` only when delivery is permanently impossible, such as the example's 410. A gone message is retained as dropped and never queued again; it appears in `GET sources` and on the Source page. Throw for other failures so Outbox retries after 5 seconds, doubling to 300 seconds. `CliError.code` is the code reported by the CLI output.\n- **Allowed destinations.** `allowed(address, config)` checks only the saved address and current configuration. Put every required fact in the address; for example, Feishu records whether the chat is direct. A destination no longer listened to is dropped, while a disabled Source leaves messages waiting. Without `allowed`, all addresses are permitted while the Source is enabled.\n- **Links.** `link(address, links)` returns the URL and label the panel displays through `SourceRegistry.link`.\n\n### 6. Thread context for assessments\n\n```ts\n  threadContext: {\n    messageId: trigger => String(trigger.meta.messageId ?? ''),\n    // A queue thread is flat: its root, and the message a reply answers, are on its first page, as on GitHub.\n    read: async (commands, trigger, _part, cursor) => {\n      const page = ThreadPageSchema.parse(JSON.parse(await commands.run('hookq', ['thread', '--conversation',\n        String(trigger.meta.conversation), '--root', String(trigger.meta.root), '--json', ...(cursor ? ['--after', cursor] : [])])))\n      const messages = page.items.map(item => ({ id: item.id, from: item.sender.id, at: item.at, text: item.text,\n        ...(item.sender.bot ? { bot: true as const } : {}), ...(item.url ? { url: item.url } : {}) }))\n      return { messages, ...(page.next ? { next: page.next } : {}), body: { messages } }\n    },\n  },\n```\n\nProactive assessment needs the conversation around a Trigger. `orchestrator_eval` reads an initial window; `orchestrator_eval_read` expands pages, the root or the parent message. Implement the optional `threadContext` interface to provide these reads:\n\n- `read(commands, trigger, part, cursor, config)` returns a `ContextPart`. Its `messages` use `ContextMessage`: `{id, from, at, text}` plus applicable `bot`, `deleted`, `reply_to`, `url`, `path` and `line` fields. `next` is omitted on the last page. `body` is the content shown to the assessing Session, here the same messages. Optional `status` can describe special results such as Feishu's `chat_neighbours`. `part` is `thread`, `root` or `parent`.\n- `messageId(trigger)` finds the Trigger's own message among them.\n- `images(text)` and `image(…)` are for a kind whose messages carry images, as Feishu's do; the example leaves them out.\n\nA kind without `threadContext` gives assessments no Thread context; the Trigger's own text stays readable.\n\nIf messages reply to earlier messages, add `repliesTo(trigger)`. It returns the corresponding Trigger id, allowing follow-up notices and worker Inputs to show the replied-to message when stored. For example, if `hookq` supplies `reply_to` and translation stores it as `meta.replyTo`:\n\n```ts\n  repliesTo: trigger => typeof trigger.meta.replyTo === 'string' ? key('webhook', trigger.meta.replyTo) : undefined,\n```\n\n### 7. Who may ask: the Source's part of the Policy\n\n```ts\n  policy: {\n    schema: z.object({ allowed: z.array(z.object({ id: z.string().min(1), name: z.string().trim().max(100).optional() }).strict())\n      .default([]) }).strict(),\n    fields: [{ key: 'allowed', type: 'rows', label: { zh: '能发起工作的发送者', en: 'Senders who may originate work' }, columns: [\n      { key: 'id', type: 'text', label: { zh: '发送者', en: 'Sender' } },\n      { key: 'name', type: 'text', label: { zh: '名字', en: 'Name' }, optional: true }] }],\n    explicit: { zh: '名单里的人在消息里 @ 智能体。', en: 'Someone on the list mentions the agent in a message.' },\n    rows: stored => ConfigSchema.parse(stored).conversations.map(conversation => {\n      const all = conversation.listen === 'all'\n      return { id: conversation.id, label: conversation.id, note: all ? { zh: '全部消息', en: 'All' } : { zh: '仅 @', en: '@ only' },\n        cells: { listedUnaddressed: all, unlistedAddressed: true, unlistedUnaddressed: all } }\n    }),\n  },\n```\n\n- `schema` validates the Source Policy, including `allowed` sender ids. Id comparison is case-insensitive. Admission tables are validated separately and shared across kinds. This Policy part is saved at `policy.sources.webhook` and contributes to the Policy version.\n- `fields` generates the form under **Eval → On each Source**, beginning with `allowed`. `explicit` explains how to address the agent. Optional `unnamed: {person, bot}` supplies display labels for opaque ids such as Feishu's `ou_…`; this example omits it because queue ids are readable names.\n- `rows(config)` lists admission scopes and their available cells. Each row id must match the `row` returned by `scope`. Unaddressed-message cells are available only where the Source observes those messages. Kinds without `rows` use default cells.\n- Optional `bots` lists bots eligible for inferred candidacy, using the same entry shape as `allowed`. Without it, no bot is admitted.\n- Optional `sync: {label, ready(part), run(host, part, signal)}` refreshes membership at startup and on **Sync now**. Feishu uses chat membership. Failures appear under `sync:<id>` and retry after one minute, doubling to one hour until successful.\n\n### 8. Variables for the Executor\n\n```ts\n  environment: {\n    variables: [{ key: 'DSH_SUPERAGENT_WEBHOOK_CONVERSATION', description: {\n      zh: '接下工单的 webhook 对话；工单不是从这个来源来的时为空',\n      en: 'The webhook conversation that started the ticket; empty when the ticket did not start on this Source' } }],\n    values: ({ trigger }) => ({\n      DSH_SUPERAGENT_WEBHOOK_CONVERSATION: trigger?.source === 'webhook' ? String(trigger.meta.conversation ?? '') : '' }),\n  },\n```\n\nExecution settings show declared `variables` beside the prepare command even when the Source is disabled. While enabled, `values` supplies Ticket-specific values using deployment, configuration and the originating Trigger.\n\nThe prepare command reads environment variables; the worker reads their values in its instructions. Use the `DSH_SUPERAGENT_<KIND>_…` prefix, return an empty value for Tickets from another Source, and never include credentials.\n\n### 9. The plugin entry and its loop\n\n```ts\nexport const name = 'dsh-superagent-webhook'\nexport const inject = ['orchestrator']\nexport function apply(ctx: Context): void {\n  ctx.effect(() => ctx.orchestrator.sources.register(webhookKind), 'webhook: source kind')\n  ctx.effect(() => {\n    const source = sourceContext(ctx.orchestrator, webhookKind)\n    const controller = new AbortController()\n    // DSH ends its process on an unhandled rejection, so a failure that escapes the loop becomes the Source's health.\n    const running = watch(source, controller.signal)\n      .catch((error: unknown) => { source.report('webhook', { state: 'error', detail: String(error) }) })\n    return async () => { controller.abort(); await running }\n  })\n}\n```\n\nThe plugin injects `orchestrator`. Its first effect registers the kind and unregisters it on disposal. The second runs the polling loop with a `SourceContext`. Disposal aborts the loop and awaits completion, including during application stop or restart.\n\n```ts\nasync function watch(ctx: SourceContext, signal: AbortSignal): Promise<void> {\n  await ctx.ready\n  // Setup restarts dsh-superagent once it resolves the accounts; until then the Source reads nothing.\n  if (!ctx.configured()) { ctx.report('webhook', health('paused', 'setupPending')); return }\n  let failures = 0\n  while (!signal.aborted) {\n    const config = ctx.config<WebhookConfig>('webhook')\n    if (!config) ctx.report('webhook', health('paused', 'sourceOff'))\n    else {\n      const at = new Date().toISOString()\n      try {\n        const { read, unreadable } = await pollQueue(ctx, signal)\n        failures = 0\n        ctx.report('webhook', { state: 'ready', detail: `${read} messages, ${unreadable} unreadable`, at })\n      } catch (error) {\n        failures += 1\n        // One network failure is retried on the next round; three in a row need a person.\n        if (!signal.aborted && failures >= 3) {\n          ctx.report('webhook', health('error', 'pollFailures', { count: String(failures), error: String(error) }))\n        }\n      }\n    }\n    await delay((config?.pollSeconds ?? 30) * 1000, undefined, { signal }).catch(() => {})\n  }\n}\n\n/** Read the queue after the cursor, take in each message, then move the cursor past them. */\nexport async function pollQueue(ctx: SourceContext, signal: AbortSignal): Promise<{ read: number; unreadable: number }> {\n  const after = ctx.state.get(KV.webhook.cursor) ?? 0\n  const output = await ctx.commands.withSignal(signal).run('hookq', ['pull', '--after', String(after), '--json'])\n  const page = PageSchema.parse(JSON.parse(output))\n  let unreadable = 0\n  for (const item of page.items) {\n    if (signal.aborted) throw new Error('The webhook Source stopped during the read')\n    const message = MessageSchema.safeParse(item)\n    if (!message.success) { unreadable++; continue }\n    const trigger = webhookTrigger(message.data, page.me)\n    if (!trigger) continue\n    await ctx.receive(trigger)\n    const conversation = { label: { zh: '对话', en: 'Conversation' }, value: message.data.conversation }\n    for (const ref of trigger.threads) ctx.threads.describe(threadKey(ref), { facts: { conversation } })\n  }\n  ctx.state.set(KV.webhook.cursor, page.next)\n  return { read: page.items.length, unreadable }\n}\n```\n\n\n- **Setup and the switch.** Wait for `ctx.ready`, and read nothing while `ctx.configured()` is false. Read `ctx.config(kind)` on every round: it is undefined while the Source is off.\n- **Cursors.** Store read positions in `ctx.state` using typed entries in `KV` (`src/kv.ts`), such as `webhook: {cursor: record<number>('webhook-cursor')}`. `tests/store.spec.ts` requires key literals to appear only in that registry. External packages can define keys with exported `record` and `family`. Setting `undefined` removes a record; `ctx.atomic` groups writes in a transaction.\n\n  Advance a cursor only after every covered Trigger has been stored. An interrupted round leaves the cursor unchanged; stable ids make replay safe. For timestamp cursors, `cursorAt(started)` from `src/sources/poll.ts` subtracts five seconds to allow for late remote writes.\n- **Thread metadata.** After receiving a Trigger, call `ctx.threads.describe(key, {label, url, facts})` to populate its display information. `ctx.threads.patch(key, meta)` delegates to `threads.patchMeta`, setting Source-owned keys or removing them when the value is `undefined`. Both ignore absent Threads, including those of filtered Triggers.\n- **Per-item errors.** Count malformed items and continue rather than failing the entire batch. `validItems(item, list, tally)` in `src/infra/commands.ts` supports this pattern. For independently polled Threads, use `pollThreads` from `src/sources/poll.ts`; it records each failure as `pollError`. Its `polled` predicate keeps live subscriptions and a two-week window after the later of the last Trigger and Ticket end.\n- **Health.** Write only declared entries through `ctx.report`. `health(state, code, values)` provides fixed messages such as `setupPending`, `sourceOff` and `pollFailures`. Count consecutive failures before reporting `error`.\n- **Abort.** Pass the signal to `ctx.commands.withSignal(signal)` and to `delay`, and check it between items, so a stop or a restart ends the loop at once.\n\nThis example does not send Source-originated notices. A Source that needs them calls `ctx.notify`; Outbox delivers them like other replies.\n\nIt also does not bind Threads to Ticket completion. Use `ctx.tickets.bindThread` and `threadClosed` only when a Source's Thread lifecycle determines whether work is done, as GitHub pull requests do. The Engine still decides when the Ticket ends.\n\n### 10. Register the plugin\n\nBuild the module as its own entry in `tsdown.config.ts`:\n\n```ts\nentry: { index: 'src/index.ts', 'github-watch': 'src/sources/github.ts', 'feishu-watch': 'src/sources/feishu.ts',\n  'webhook-watch': 'src/sources/webhook.ts' },\n```\n\nThen export the built file in `package.json` by adding `\"./webhook-watch\": \"./lib/webhook-watch.js\"` to `exports`, and add the plugin to the `insert` list of the bundle's `cordis.patch.yml`, disabled, as Feishu is:\n\n```yaml\n    - id: dsh-superagent-webhook\n      name: dsh-superagent/webhook-watch\n      disabled: true\n```\n\nEnable the plugin in a profile's `cordis.patch.yml` with `id: dsh-superagent-webhook` and `disabled: false`. Build and restart. The new Source appears in Sources settings and under **Eval → On each Source**.\n\nAdd its module and spec to the module and test tables in [007 Architecture](007-architecture.md). `tests/docs.spec.ts` checks that both indexes are complete.\n\n### 11. Tests\n\nCreate `tests/webhook.spec.ts` using the pattern in `tests/sources.spec.ts`: a real Store in a temporary directory, a `SourceRegistry` with `HealthBoard`, an Engine with stand-in ports, and a `SourceContext` from `sourceContextOf`.\n\nMock CLI calls by spying on `Commands.run`. Also spy on `withSignal`, because it normally returns a new `Commands` instance.\n\n```ts\nfunction host(overrides: Partial<SourceContextDeps> = {}) {\n  const store = new Store(join(mkdtempSync(join(tmpdir(), 'webhook-')), 'db.sqlite'))\n  store.saveSettings(SettingsSchema.parse({\n    sources: { webhook: { enabled: true, config: { conversations: [{ id: 'ops', listen: 'mentions' }] } } },\n    policy: { sources: { webhook: { allowed: [{ id: 'alice' }] } } },\n  }))\n  // The registry claims the kind's health entries on the board, where the test reads them.\n  const board = new HealthBoard()\n  const sources = new SourceRegistry(() => store.settings(), board)\n  sources.register(webhookKind)\n  const engine = new Engine({ repo: store, scope: sources, policy: () => settingsPolicy(store.settings(), sources),\n    assessor: { request: vi.fn() }, executor: { start: vi.fn(), deliver: vi.fn(), stop: vi.fn() },\n    outbox: { send: vi.fn(), status: () => undefined, withdraw: vi.fn() } })\n  const commands = new Commands(() => testDeployment(), {}, new AbortController().signal)\n  const receive = vi.fn((trigger: Trigger) => { const result = engine.receive(trigger); engine.evaluateDue(); return result })\n  // The Source's own notices go to the outbox, which keeps their receipts and sends nothing here.\n  const deps: SourceContextDeps = { store, engine, outbox: { send: message => { store.receipts.add(message) } }, commands, sources,\n    deployment: testDeployment(), ready: Promise.resolve(), configured: () => true, receive, ...overrides }\n  return { ...deps, store, engine, commands, receive, health: board.all, ctx: sourceContextOf(deps, webhookKind) }\n}\n/** The queue as `hookq` answers it. */\nfunction queue(h: ReturnType<typeof host>, answer: () => unknown) {\n  vi.spyOn(h.commands, 'withSignal').mockReturnValue(h.commands)\n  return vi.spyOn(h.commands, 'run').mockImplementation(async () => JSON.stringify(answer()))\n}\n\nit('takes in what the queue holds after the cursor, once, and moves the cursor after it', async () => {\n  const h = host()\n  queue(h, () => ({ me: 'agent', items: [message('m1'), { id: 'broken' }, message('m2', { conversation: 'elsewhere' })], next: 3 }))\n  expect(await pollQueue(h.ctx, new AbortController().signal)).toEqual({ read: 3, unreadable: 1 })\n  expect(await h.receive.mock.results[0]!.value).toBe('stored')\n  expect(await h.receive.mock.results[1]!.value).toBe('filtered')\n  expect(h.store.get(KV.webhook.cursor)).toBe(3)\n  // An allowed sender who mentions the agent makes an explicit request.\n  expect(h.engine.candidate(key('webhook', 'm1'))?.strength).toBe('explicit')\n  await pollQueue(h.ctx, new AbortController().signal)\n  expect(await h.receive.mock.results[2]!.value).toBe('duplicate')\n  h.store.close()\n})\n```\n\n`message(id, fields)` builds a queue item. Cover at least:\n\n- the translation: a stable id, the Thread, the actor, `human` and `addressed`, and no Trigger for the agent's own message;\n- a round: Triggers stored once, one outside the scope `filtered`, the cursor moved after them, an allowed sender's mention evaluated as `explicit`;\n- a round cut short, which keeps its cursor;\n- `send`: `sent`, `gone` for a 410 only, and a throw for any other failure, with the CLI's error built by `commandError`;\n- the Thread context: the messages of a page and the cursor of the next, as `tests/registry.spec.ts` reads a kind's Threads through `SourceRegistry.threadContext`;\n- the plugin: `apply` registers the kind and reports `setupPending` while setup waits, its disposers unregister the kind, and a failure that escapes the loop becomes the Source's health instead of an unhandled rejection;\n- the Source's part of the Policy and its admission rows, as `tests/registry.spec.ts` and `tests/policy.spec.ts` check the Feishu Source's.\n\n### Checklist\n\n1. Map Triggers, Threads, actors, Channel addresses and receiving scopes.\n2. Write the kind: `schema`, `fields`, `health`, and `facts` if setup derives any.\n3. Translate events into Triggers with stable ids, and drop the agent's own.\n4. Decide what the Source receives in `scope`, from `meta` alone.\n5. Give it a Channel whose `send` posts each message once and answers `gone` only when the conversation can never receive it.\n6. Give assessments its Thread context, if it can read a Thread.\n7. Give it a part of the Policy with `allowed` and the admission rows.\n8. Register its execution environment variables.\n9. Write the plugin entry and a loop that waits for setup, follows the switch, moves cursors after `receive`, keeps errors per item, reports health and stops on abort; name the cursors in `KV`.\n10. Add the build entry, the export and the `cordis.patch.yml` insert, and list the module and its spec in the tables of 007.\n11. Test it as `tests/sources.spec.ts` tests the other Sources.\n"}};</script>
