      the real code, the full interface list and the steps the block joins. ── */
#uml-modal > .modal-head, #uml-modal > .modal-body { width: min(1080px, 100%); }
.uml-top { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 14px; align-items: start; }
.uml-diagram {
  background: var(--panel-soft); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px; overflow-x: auto;
}
.uml-svg { display: block; width: 100%; min-width: 420px; height: auto; }
.uml-svg .uml-box { fill: var(--panel); stroke: var(--border-strong); stroke-width: 1.2; }
.uml-svg .uml-box.focus { stroke: var(--accent); stroke-width: 2; }
.uml-svg .uml-sep { stroke: var(--border); stroke-width: 1; }
.uml-svg .uml-rel { fill: none; stroke: var(--border-strong); stroke-width: 1.3; }

.uml-svg .uml-t-stereo { fill: var(--accent); font: 11px var(--mono); }

.uml-svg .uml-t-attr { fill: var(--muted); font: 11px var(--mono); }
.uml-svg .uml-t-method { fill: var(--text); font: 11px var(--mono); }

.uml-line { font-size: 14px; margin-bottom: 7px; color: var(--muted); overflow-wrap: anywhere; }
.uml-line b { display: block; color: var(--hint); font-size: 10px; font-weight: 500; letter-spacing: .05em; }
.uml-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; margin-top: 4px; }
.uml-col h3 { margin: 16px 0 8px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 5px; }
.uml-list { margin: 0; padding-left: 18px; }
.uml-list li { font-size: 13px; margin-bottom: 5px; color: var(--muted); overflow-wrap: anywhere; }
.uml-list.mono { font-family: var(--mono); font-size: 11.5px; }
.uml-note { font-size: 11.5px; color: var(--hint); }
.uml-tag { font: 10px var(--mono); background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 1px 5px; }
.uml-code { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; margin-bottom: 10px; }

.uml-code .sym { font: 500 12px var(--mono); }
.uml-code .path { display: block; font: 10px var(--mono); color: var(--hint); word-break: break-all; }
.uml-code pre { margin: 0; padding: 10px 12px; font-size: 11px; line-height: 1.55; overflow: auto; max-height: 230px; white-space: pre; }
.uml-code .why { padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
.uml-steps { display: flex; flex-wrap: wrap; gap: 6px; }
.uml-steps .btn { max-width: 100%; text-align: left; white-space: normal; }

@media (max-width: 1000px) {
  .hero-grid, .viz-grid, .uml-top, .uml-grid { grid-template-columns: 1fr; }
  .wrap { padding: 0 14px 130px; }
  .topbar-inner { padding: 8px 14px; }
  .modal { padding: 12px; }
  .modal-body { padding: 16px 18px 28px; max-height: calc(100vh - 90px); }

     a full-width card can afford a taller log than the 200px floor. */
  .flow-log { min-height: 0; }
  .log-list { height: 240px; }

  /* ── UML：点流转图里任一模块，弹出它的类框 + 主要代码 + 接口函数 ──────────

  function umlStereo(k) {
    return k === 'interface' ? '«interface»'

    for (i = 0; i < order.length; i++) {

    for (i = 0; i < neighbors.length; i++) {

      // sharing a 50px gap would stack their captions on the same spot.

    out.push('<rect class="uml-box focus" x="' + x + '" y="' + y + '" width="' + W1 + '" height="' + H1 + '" rx="7"/>');
    out.push('<line class="uml-sep" x1="' + x + '" y1="' + (y + HEAD) + '" x2="' + (x + W1) + '" y2="' + (y + HEAD) + '"/>');
    out.push('<line class="uml-sep" x1="' + x + '" y1="' + (y + HEAD + hA) + '" x2="' + (x + W1) + '" y2="' + (y + HEAD + hA) + '"/>');
    out.push('<text class="uml-t-stereo" x="' + (x + 12) + '" y="' + (y + 17) + '">' + esc(umlStereo(e.k)) + '</text>');
    out.push('<text class="uml-t-name" x="' + (x + 12) + '" y="' + (y + 36) + '">' + esc(umlCut(e.n || node.label, 30)) + '</text>');
    out.push('<text class="uml-t-file" x="' + (x + W1 - 10) + '" y="' + (y + 36) + '" text-anchor="end">' + esc(umlCut(e.f || '', 34)) + '</text>');
    out.push('<text class="uml-t-label" x="' + (x + 12) + '" y="' + (y + HEAD + 13) + '">字段 / 属性</text>');

  function umlCode(e) {

  function umlStepsOf(id) {

  }
  function renderUml(id) {

      '<div class="uml-line"><b>类型</b>' + esc(e.n || node.label) + ' · ' + esc(umlStereo(e.k)) + '</div>',

  function nodeById(id) {
    var list = S.data.nodes, i;
    for (i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function center(n) {
    return { x: PAD_X + n.col * COL_GAP + NODE_W / 2, y: PAD_Y + n.lane * ROW_GAP + NODE_H / 2 };
  }
  function pathPoints(a, b) {
    var A = center(a), B = center(b);
    if (a.id === b.id) {
      return [
        { x: A.x - NODE_W / 2, y: A.y },
        { x: A.x - NODE_W / 2 - 22, y: A.y - NODE_H / 2 - 16 },
        { x: A.x + NODE_W / 2 + 22, y: A.y - NODE_H / 2 - 16 },
        { x: A.x + NODE_W / 2, y: A.y }
      ];
    }
    if (a.lane === b.lane) {
      var right = a.col <= b.col;
      var x1 = right ? A.x + NODE_W / 2 : A.x - NODE_W / 2;
      var x2 = right ? B.x - NODE_W / 2 : B.x + NODE_W / 2;
      return [{ x: x1, y: A.y }, { x: x2, y: B.y }];
    }
    var down = a.lane < b.lane;
    var y1 = down ? A.y + NODE_H / 2 : A.y - NODE_H / 2;
    var y2 = down ? B.y - NODE_H / 2 : B.y + NODE_H / 2;
    var mid = (y1 + y2) / 2;
    return [{ x: A.x, y: y1 }, { x: A.x, y: mid }, { x: B.x, y: mid }, { x: B.x, y: y2 }];
  }
  function pathD(pts) {
    var out = 'M ' + pts[0].x + ' ' + pts[0].y, i;
    for (i = 1; i < pts.length; i++) out += ' L ' + pts[i].x + ' ' + pts[i].y;
    return out;
  }
  function pointAt(pts, t) {
    var lens = [], total = 0, i;
    for (i = 1; i < pts.length; i++) {
      var d = Math.sqrt(Math.pow(pts[i].x - pts[i - 1].x, 2) + Math.pow(pts[i].y - pts[i - 1].y, 2));
      lens.push(d); total += d;
    }
    if (total === 0) return pts[0];
    var left = t * total;
    for (i = 0; i < lens.length; i++) {
      if (left <= lens[i] || i === lens.length - 1) {
        var u = lens[i] ? Math.min(1, left / lens[i]) : 0;
        return {
          x: pts[i].x + (pts[i + 1].x - pts[i].x) * u,
          y: pts[i].y + (pts[i + 1].y - pts[i].y) * u
        };
      }
      left -= lens[i];
    }
    return pts[pts.length - 1];
  }

  function renderGraph() {
    var d = S.data, i, maxCol = 0, maxLane = 0;
    for (i = 0; i < d.nodes.length; i++) {
      maxCol = Math.max(maxCol, d.nodes[i].col);
      maxLane = Math.max(maxLane, d.nodes[i].lane);
    }
    S.viewW = PAD_X * 2 + maxCol * COL_GAP + NODE_W + 18;
    S.viewH = PAD_Y * 2 + maxLane * ROW_GAP + NODE_H + 16;

    /* The diagram is drawn in viewBox units, so its rendered type size is
       viewW-independent only while the wrap is narrower than GRAPH_MAX_W.
       Capping the wrap at a fixed pixel width freezes both the frame and the
       type: widening the pane (collapsing a sidebar) stops scaling the SVG up
       and simply adds whitespace around it. Below the cap the SVG still
       shrinks to fit — there is no way to draw 988 units in 700px otherwise. */
    var out = ['<div class="graph-wrap" id="graph-wrap" style="max-width:' +
      Math.min(S.viewW, GRAPH_MAX_W) + 'px">'];
    out.push('<svg viewBox="0 0 ' + S.viewW + ' ' + S.viewH + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="动态设计框架">');
    out.push('<defs><marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>');

    for (i = 0; i < d.nodes.length; i++) {

        x: PAD_X + d.nodes[i].col * COL_GAP, y: PAD_Y + d.nodes[i].lane * ROW_GAP,
        w: NODE_W, h: NODE_H
      });
    }
    for (i = 0; i < lanes.length; i++) {
      // Lane captions sit ABOVE their row: the left gutter is only PAD_X wide,
      // and labels like "领域内核 · 可移植" would otherwise run into the boxes.
      // The dashed rules are gone — at this type size a caption plus the row
      // gap already separates the lanes, and the rule cut through the caption.
      out.push('<text class="lane-label" x="' + (PAD_X - 2) + '" y="' + (PAD_Y + i * ROW_GAP - 10) + '">' + esc(lanes[i]) + '</text>');

    }
    var edges = d.edges || [];
    /* Edge labels are placed greedily: at this type size two labels can land on
       the same midpoint and bury a box, so each candidate point must be clear of
       every node box and every label already placed, or the label is dropped. */
    function hits(r, list) {
      for (var j = 0; j < list.length; j++) {
        var q = list[j];
        if (r.x < q.x + q.w + 2 && r.x + r.w + 2 > q.x && r.y < q.y + q.h + 2 && r.y + r.h + 2 > q.y) return true;
      }
      return false;
    }
    var labelTs = [0.5, 0.34, 0.66, 0.2, 0.8];
    for (i = 0; i < edges.length; i++) {
      var a = nodeById(edges[i].from), b = nodeById(edges[i].to);
      if (!a || !b) continue;
      var pts0 = pathPoints(a, b);
      out.push('<path class="edge" d="' + pathD(pts0) + '"/>');
      var text = edges[i].label;
      if (!text) continue;
      var size = 12, lw = textW(text, size) + 6, lh = size + 4;
      for (var t = 0; t < labelTs.length; t++) {
        var m = pointAt(pts0, labelTs[t]);
        var r = { x: m.x - lw / 2, y: m.y - lh / 2, w: lw, h: lh };
        if (r.x < 4 || r.y < 4 || r.x + r.w > S.viewW - 4 || r.y + r.h > S.viewH - 4) continue;
        if (hits(r, boxes) || hits(r, labelRects)) continue;
        labelRects.push(r);
        edgeLabels.push('<text class="edge-label" x="' + m.x + '" y="' + (m.y + 4) + '" text-anchor="middle">' + esc(text) + '</text>');
        break;
      }
    }
    S.paths = [];
    for (i = 0; i < d.steps.length; i++) {
      var s = d.steps[i], na = nodeById(s.from), nb = nodeById(s.to);
      var pts = (na && nb) ? pathPoints(na, nb) : [{ x: 0, y: 0 }, { x: 1, y: 1 }];
      S.paths.push(pts);
      var k = s.kind === 'fact' ? ' fact' : (s.kind === 'effect' ? ' effect' : '');
      out.push('<path id="fp-' + i + '" class="flow-path' + k + '" d="' + pathD(pts) + '" marker-end="url(#fa)"/>');
    }
    for (i = 0; i < d.nodes.length; i++) {
      var n = d.nodes[i], p = { x: PAD_X + n.col * COL_GAP, y: PAD_Y + n.lane * ROW_GAP };
      var kind = n.kind === 'kernel' ? ' kernel' : (n.kind === 'host' ? ' host' : (n.kind === 'human' ? ' human' : ''));
      var carry = n.carry ? ' carry' : '';
      out.push('<g id="nd-' + esc(n.id) + '" data-node="' + esc(n.id) + '" class="node' + kind + carry + '">');
      out.push('<title>点开 ' + esc(n.label) + ' 的 UML 类图、主要代码与接口函数</title>');
      out.push('<rect class="node-box" x="' + p.x + '" y="' + p.y + '" width="' + NODE_W + '" height="' + NODE_H + '" rx="10"/>');
      out.push('<text class="node-title" style="font-size:' + titleSize(n.label) + 'px" x="' + (p.x + NODE_W / 2) + '" y="' + (p.y + 29) + '" text-anchor="middle">' + esc(n.label) + '</text>');
      out.push('<text class="node-sub" style="font-size:' + subSize(n.sub) + 'px" x="' + (p.x + NODE_W / 2) + '" y="' + (p.y + 52) + '" text-anchor="middle">' + esc(n.sub || '') + '</text>');
      out.push('</g>');
    }
    out.push(edgeLabels.join(''));
    out.push('</svg><div class="packet" id="packet"><span class="dot"></span><span id="packet-text"></span></div></div>');
    out.push('<div class="graph-legend"><span class="legend-item"><i class="swatch kernel"></i>领域内核 / 可移植</span>' +
      '<span class="legend-item"><i class="swatch host"></i>宿主适配器 / DSH</span>' +
      '<span class="legend-item"><i class="swatch human"></i>人或外部世界</span>' +
      '<span class="legend-item">点任一模块 → UML / 代码 / 接口函数</span></div>');
    html('graph', out.join(''));
    for (i = 0; i < d.nodes.length; i++) {
      (function (id) { bind('nd-' + id, 'click', function () { openUml(id); }); })(d.nodes[i].id);
    }
  }

  function bind(id, type, fn) { var el = $(id); if (el && el.addEventListener) el.addEventListener(type, fn); }
  function logJump(j) { return function () { pause(); goto(j, false, true); }; }
  function bindLogRow(j) { bind('log-r' + j, 'click', logJump(j)); }

  function updateButtons() {
    if (!S.data) return;
    var b = $('btn-play');
    if (b) b.textContent = S.playing ? '❚❚ 暂停' : '▶ 播放';
    var p = $('progress'), c = $('counter');

      brief.title = cur ? cur.label : '尚未开始';
    }
  }

  function setPacket(pos, step) {
    var el = $('packet'), txt = $('packet-text');
    if (!el) return;
    if (!pos) { el.style.opacity = 0; return; }
    el.style.left = (pos.x / S.viewW * 100) + '%';
    el.style.top = (pos.y / S.viewH * 100) + '%';
    el.style.opacity = 1;
    el.className = 'packet ' + (step.kind === 'fact' ? 'fact' : (step.kind === 'effect' ? 'effect' : (step.kind === 'event' || step.kind === 'config' ? 'event' : '')));
    if (txt) txt.textContent = step.label;
  }

  function clearHighlights() {
    var d = S.data, i;
    for (i = 0; i < d.nodes.length; i++) cls('nd-' + d.nodes[i].id, nodeBase(d.nodes[i]));
    for (i = 0; i < d.steps.length; i++) {
      var s = d.steps[i];
      var k = s.kind === 'fact' ? ' fact' : (s.kind === 'effect' ? ' effect' : '');
      cls('fp-' + i, 'flow-path' + k);
    }
    var sm = d.states || { nodes: [], transitions: [] };
    for (i = 0; i < sm.nodes.length; i++) cls('sm-' + sm.nodes[i].id, 'sm-node');
    for (i = 0; i < sm.transitions.length; i++) cls('tr-' + i, 'trans');
    for (i = 0; i < d.snippets.length; i++) cls('cc-' + d.snippets[i].id, 'code-card');
  }

  function renderLog(i) {
    var d = S.data, j, log = '';
    /* The whole run is listed from the start — past, current and upcoming — so
       the panel is a playbill rather than an empty box waiting for playback,
       and any row can be clicked to jump straight to it. */
    for (j = 0; j < d.steps.length; j++) {
      var x = d.steps[j];
      var state = j < i ? ' done' : (j === i ? ' on' : ' pending');
      log += '<button type="button" id="log-r' + j + '" title="跳到第 ' + (j + 1) + ' 步：' + esc(x.label) + '" ' +
        'class="log-row' + state + '"><span class="n">' + (j + 1) + '</span>' +
        '<span class="k ' + esc(x.kind) + '">' + esc(x.kind) + '</span>' +
        '<span class="t">' + esc(x.from) + ' → ' + esc(x.to) + ' · ' + esc(x.label) + '</span></button>';
    }
    html('log-list', log);
    for (j = 0; j < d.steps.length; j++) bindLogRow(j);
    var box = $('log-list'), row = i >= 0 ? $('log-r' + i) : null;
    if (box && box.scrollTop !== undefined && row && typeof row.offsetTop === 'number') {
      // Keep the active row in view without yanking the list on every frame.
      var top = row.offsetTop - (box.clientHeight || 0) / 2 + 12;
      box.scrollTop = Math.max(0, top);
    }
  }

  function renderStep(i) {
    var d = S.data;
    clearHighlights();
    updateButtons();
    if (i < 0 || i >= d.steps.length) {
      setPacket(null, {});
      html('step-detail', '<div class="empty-state">按「播放」或「单步」，看一条消息 / 事件如何在模块之间流转。每一步都会同步点亮框架图、状态机、事件日志与对应代码。</div>');
      renderLog(i);
      return;
    }
    var s = d.steps[i];
    var na = nodeById(s.from), nb = nodeById(s.to);
    if (na) cls('nd-' + na.id, nodeBase(na) + ' active source');
    if (nb) cls('nd-' + nb.id, nodeBase(nb) + ' active target');
    cls('fp-' + i, 'flow-path' + (s.kind === 'fact' ? ' fact' : (s.kind === 'effect' ? ' effect' : '')) + ' on');

    var sm = d.states || { nodes: [], transitions: [] }, j;
    if (s.state) {
      addClass('sm-' + s.state, 'sm-node', 'active');
      for (j = 0; j < sm.transitions.length; j++) if (sm.transitions[j].to === s.state) addClass('tr-' + j, 'trans', 'active');
    }
    if (s.code) addClass('cc-' + s.code, 'code-card', 'active');

    html('step-detail', '<div class="step-head"><span class="step-no">' + (i + 1) + '</span>' +
      '<span class="step-kind ' + esc(s.kind) + '">' + esc(s.kind) + '</span></div>' +
      '<div class="step-label">' + esc(s.label) + '</div>' +
      '<div class="step-route">' + esc(s.from) + ' → ' + esc(s.to) + '</div>' +
      '<div class="step-note">' + esc(s.note) + '</div>' +
      (s.ref ? '<div class="step-note" style="margin-top:8px;color:var(--hint)">源码：' + esc(s.ref) + '</div>' : ''));

    renderLog(i);
  }

  function animate(i, done) {
    var s = S.data.steps[i], pts = S.paths[i];
    var duration = Math.max(180, 900 / S.speed);
    var start = now();
    cancelRaf(S.raf);
    function frame() {
      var t = Math.min(1, (now() - start) / duration);
      var eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      setPacket(pointAt(pts, eased), s);
      if (t < 1) S.raf = raf(frame);
      else if (done) done();
    }
    frame();
  }

  function cancelTimers() {
    cancelRaf(S.raf); S.raf = null;
    if (S.timer) clearTimeout(S.timer);
    S.timer = null;
  }

  function goto(i, chained, animateIt) {
    cancelTimers();
    var last = S.data.steps.length - 1;
    if (i < -1) i = -1;
    if (i > last) i = last;
    S.index = i;
    renderStep(i);
    if (i >= 0 && animateIt !== false) {
      animate(i, function () { if (chained) scheduleNext(); });
    } else if (chained) scheduleNext();
  }
  function scheduleNext() {
    if (!S.playing) return;
    S.timer = setTimeout(function () { advance(); }, Math.max(80, 300 / S.speed));
  }
  function advance() {
    if (!S.playing) return;
    if (S.index >= S.data.steps.length - 1) { S.playing = false; updateButtons(); return; }
    goto(S.index + 1, true, true);
  }
  function play() {
    if (S.playing) return;
    if (S.index >= S.data.steps.length - 1) { goto(-1, false, false); }
    S.playing = true; updateButtons(); advance();
  }
  function pause() { S.playing = false; cancelTimers(); if (S.data) updateButtons(); }
  function togglePlay() { if (S.view !== 'lesson') return; if (S.playing) pause(); else play(); }

  function bindKeys() {
    if (S.keysBound || !document.addEventListener) return;
    S.keysBound = true;
    document.addEventListener('keydown', function (e) {
      var k = e.key || '';
      if (k === 'Escape') { closeDoc(); closeUml(); return; }
      // A focused log row / button gets its own native Space/Enter behaviour;
      // the global playback shortcuts must not fire a second time for it.
      var tag = String((e.target && e.target.tagName) || '').toLowerCase();
      if (tag === 'button' || tag === 'input' || tag === 'select' || tag === 'textarea') return;
      if (S.view !== 'lesson' || !S.data || S.docKind || S.umlId) return;
      if (k === ' ' || k === 'Spacebar') { e.preventDefault && e.preventDefault(); togglePlay(); }
      else if (k === 's' || k === 'S') { pause(); goto(S.index + 1, false, true); }
      else if (k === 'r' || k === 'R') { pause(); goto(-1, false, false); }
      else if (k === 'ArrowRight') { pause(); goto(S.index + 1, false, true); }
      else if (k === 'ArrowLeft') { pause(); goto(S.index - 1, false, true); }
    });
  }

<script>window.WAY2SA_DOCS={"L01":{"readme":"# L01 · 领域模型\n\n> 对应原型原文：`dsh-superagent-prototype/docs/001-domain.md`\n> 建议同时读 `docs/000-philosophy.md`（33 行，讲「消耗尽可能少的人类注意力」）。\n\n## 这课学什么\n\n`001-domain.md` 不是功能说明，而是**词汇宪法**：它给系统定了一套不许乱用的概念，并用一张「Rejected concepts」表把 11 条捷径明确关掉。学完你要能跟住一个 Trigger 从 Source 走到 Ticket，说出每个概念各自「保持哪条规则」。\n\n一句话：`Work moves from Trigger to Eval to execution.` 但真正的重点在于——**Eval 和 Subscription 是两条完全不同的路**。\n\n## 先修\n\n无。这是课程起点。只需要知道原型是一个跑在 DeepSeek Harness 上的研究原型。\n\n## 三个问题\n\n1. 为什么已订阅 Thread 上人的消息既不产生 Decision，也不产生新授权？\n2. Mandate 记了什么，为什么只有 `accept` 能创建它？\n3. Ticket 为什么不跟随 Executor Session 的状态？Correlation 为什么不能路由？\n\n## 课程材料\n\n| 文件 | 用途 |\n|---|---|\n| `README.md` | 本文件：目标、路径、验收 |\n| `TUTORIAL.md` | 逐段精读 `core/model.ts` / `intake.ts` / `evals.ts` / `tickets.ts`，含 2 个可运行实验 |\n| `index.html` + `data.js` | 动态设计框架：12 个模块、16 步流转、Ticket 状态机、5 个真实代码锚点 |\n\n## 学习路径\n\n1. **读原文**（15 分钟）：先读 Flow 与 Concepts 表，再读 Rejected concepts，最后扫一遍 Glossary 与 Group/Values。\n2. **看动态演示**：从 `Source 产出 Trigger` 一路点到第 14 步「追问唤醒已结束 Ticket」，再用第 15–16 步看 Correlation 与 `ended` 两个边界。注意第 3–4 步（订阅 fan-out）与第 5–8 步（Eval → Mandate → Ticket）是两条路。\n3. **精读代码**：`TUTORIAL.md` 第 2 节，重点 `Intake.receive` 与 `Evals.start`。\n4. **做实验**：把「扇出 vs Eval」和「拒绝概念自检」两段代码粘进浏览器控制台，对照预期输出。\n\n## 动态演示怎么看\n\n- 实线 message / event 是前向消息；`fact` 用虚线，表示已经发生、被记录下来的事实。\n- 绿色块 = 零 I/O 领域内核（可移植）；橙色 = DSH 宿主适配器；蓝色 = 人或外部世界。\n- 第 4 步 `Subscription → Ticket` 标了「无 Eval」：这是全课最容易读错的地方。\n- 点任意步骤，右侧状态机会点亮对应状态，下方代码卡片同步高亮。\n\n## 验收标准\n\n能做到这 5 件事，就算过关：\n\n- [ ] 不看文档画出 `Source → Trigger → Thread → {Eval | Subscription} → Ticket → Assignment → Executor → Channel` 的分叉。\n- [ ] 解释「Admission checks on Subscriptions」为什么被拒绝。\n- [ ] 说出 Mandate 的 5 个字段类别，以及改变它的三个操作（accept / 人的 stop / revalidate 失败 —— 后两个在 L02 展开）。\n- [ ] 解释「A person is not a domain concept」在代码里的含义：Trigger 只带 Source 给的 actor。\n- [ ] 举出 3 条被拒绝的概念，并说出加回来会破坏什么。\n\n## 与前课的关系\n\n起点。本课出现的 12 个模块里，绿色内核块会在 L02 / L03 / L07 反复出现并变成淡色「承接块」。\n\n## 易错点速查\n\n| 误解 | 文档原话 / 正确理解 |\n|---|---|\n| 订阅 = 授权 | `A Subscription covers the whole Thread; the Mandate separates authorization from context` |\n| Correlation 可以路由 | `Subscriptions route; Correlation only adds context` |\n| Ticket 状态跟着 Session | `A Ticket can be handed off, resumed, or run by several Executors` |\n| 人是领域实体 | `A person is Trigger metadata`；跨 Source 身份映射只是 prompt text |\n\n## 源码坐标\n\n```\ndsh-superagent-prototype/docs/001-domain.md        Flow / Concepts / Rejected / Glossary\ndsh-superagent-prototype/src/core/model.ts         Trigger / Thread / Ticket / Mandate / followupOwners\ndsh-superagent-prototype/src/core/intake.ts        Intake.receive（唯一摄入口）\ndsh-superagent-prototype/src/core/evals.ts         Evals.start / decide / accept\ndsh-superagent-prototype/src/core/tickets.ts       Tickets.create / wake / end\ndsh-superagent-prototype/tests/core-engine.spec.ts 幂等与扇出断言\n```\n\n## 下一步\n\nL02 会在这套词汇上叠加「谁有权让工作开始」：gate、admission table、accept mode 与 Mandate basis。\n","tutorial":"# L01 代码教程 · 领域模型\n\n本教程只读 `dsh-superagent-prototype` 的真实源码。所有片段逐字抄录，路径相对原型仓库根。实验代码不依赖 DSH、Node 或任何 npm 包，可直接粘进浏览器控制台运行。\n\n## 1. 源码地图\n\n| 路径 | 符号 | 看什么 |\n|---|---|---|\n| `src/core/model.ts` | `Trigger` / `Thread` / `Ticket` / `Mandate` / `followupOwners` | 领域形状与「谁的追问归谁」 |\n| `src/core/intake.ts` | `Intake.receive` | 唯一摄入口：去重 → 过滤 → 扇出 → 排队 |\n| `src/core/part.ts` | `queueForEval` / `leftToWorkers` | Thread 的 pending 队列与越权保护 |\n| `src/core/evals.ts` | `Evals.start` / `decide` / `accept` | 批处理取最强、拒绝越权接单 |\n| `src/core/tickets.ts` | `Tickets.create` / `wake` | 一个事务里落地整张票 |\n| `docs/001-domain.md` | `Rejected concepts` | 哪些捷径被刻意关掉 |\n\n## 2. 逐段精读\n\n### 2.1 `Intake.receive` — 所有写都在一个同步事务里\n\n`src/core/intake.ts`：\n\n```ts\n    if (!trigger.threads.length) throw new Error('A trigger must belong to at least one thread')\n    if (this.repo.triggers.get(trigger.id)) return 'duplicate'\n    const at = this.now()\n    const filter = this.options.scope.scope(trigger)\n    if (!filter.listened) {\n      this.repo.triggers.save(trigger); this.repo.triggers.saveDisposition(trigger.id, { filtered: { code: filter.reason }, fanout: [], at })\n```\n\n- 第 1 行：Trigger 至少属于一个 Thread，这是 Eval 有一致视图的前提。\n- 第 2 行：id 命中直接返回 `duplicate` —— 这就是「重读消息安全」的全部实现，不需要额外去重表。\n- 第 4 行：`scope()` 是 `SourceScope` 端口；是否接收由 Source 决定，内核不解释 `meta`。\n- 第 6 行：不监听也**要存下来**并记 `filtered`，面板才能向人解释「为什么没反应」。\n\n### 2.2 `followupOwners` — 订阅不给授权的代码证据\n\n`src/core/model.ts` 里这个函数决定一条消息归谁：它先 `if (!trigger.human) return []`，再剔除 `handbacks`、`context`、`requeued`，只留下 live Ticket 或「非人工结束且有等待消息」的票。对应 `src/core/part.ts`：\n\n```ts\nif (!this.owners(trigger).length) this.queueForEval(trigger)\nfor (const ticketId of fanout) this.tickets.wake(ticketId)\n```\n\n- 有人认领 → 不进 Eval，只 `wake` 订阅票（送上下文）。\n- 无人认领 → 排进 primary Thread 的 `pending` 等 Eval。\n- `leftToWorkers` 在主 Session 试图越权路由一条已归 Worker 的消息时抛 `UserError('workerDecides')`。\n\n### 2.3 `Evals.start` — 一个批次取最强\n\n`src/core/evals.ts`：\n\n```ts\n    for (const trigger of triggers) {\n      const gate = policy.gate(trigger, thread, tickets)\n      if (!gate.admissible) { reasons.push({ code: gate.reason, triggerId: trigger.id }); continue }\n      const later = gate.strength === strongest?.strength && trigger.at >= strongest.trigger.at\n      const weaker = !strongest || stronger(strongest.strength, gate.strength) !== strongest.strength\n      if (weaker || later) strongest = { trigger, strength: gate.strength, basis: gate.basis }\n    }\n```\n\n- `policy.gate` 是确定性的第一层，模型研判在它之后。\n- 同强度取时间最新的 Trigger，避免批次里旧消息压过新消息。\n- `basis` 被保留下来，日后 `revalidate` 要用它复查（L02）。\n\n### 2.4 `Evals.decide` — 权限由代码强制\n\n```ts\n    if (outcome.kind === 'accept' && evaluation.strength !== 'explicit' && !this.policy().admitsInferred(outcome.rules ?? [])) {\n      throw new UserError('notExplicit')\n    }\n```\n\n推断候选不能在非 `auto` 模式下被直接接单。哪怕提示词或模型输出写了「accept」，这一行也会挡住 —— 这是 L04「文本改不了权限」的第一次出现。\n\n### 2.5 `Tickets.create` — 原子建单\n\n`src/core/tickets.ts` 在一个 `repo.atomic` 里完成：从 `triggerIds` 收集 `channels` → `prepareTicket` → `newAssignment`（`state:'pending'`）→ 对每个 thread `subscribe` → `replies.acknowledgeAccepted` → `executor.start` → `emit('ticket.created')`。任何一步失败，整张票都不存在。\n\n### 2.6 `Rejected concepts` — 比概念表更重要\n\n`docs/001-domain.md`：\n\n```\n| Admission checks on Subscriptions | A Subscription covers the whole Thread; the Mandate separates authorization from context |\n| Correlation that routes | Subscriptions route; Correlation only adds context |\n| Ticket state that follows the DSH Session | A Ticket can be handed off, resumed, or run by several Executors |\n```\n\n这三条分别保护：授权唯一来源、路由唯一来源、Ticket 状态自主。设计新底座时，这张表应当原样保留。\n\n## 3. 实验 A · 扇出 vs Eval 分类器\n\n目标：验证「bot 扇出但仍进 Eval」「人的追问命中订阅票则不进 Eval」「同 id 只存一次」。\n\n```js\nconst triggers = new Map();\nconst dispositions = new Map();\nconst subscriptions = new Map([['th-1', ['tk-1']]]);\nconst pending = [];\n\nfunction receive(t) {\n  if (triggers.has(t.id)) return 'duplicate';\n  triggers.set(t.id, t);\n  if (!t.listened) {\n    dispositions.set(t.id, { filtered: 'conversation_not_listed', fanout: [] });\n    return 'filtered';\n  }\n  const fanout = subscriptions.get(t.thread) || [];\n  dispositions.set(t.id, { fanout });\n  const owned = t.human && fanout.length > 0;   // followupOwners 的极简版\n  if (!owned) pending.push(t.id);               // queueForEval\n  return { stored: true, fanout, queuedForEval: !owned };\n}\n\nconsole.log(receive({ id: 'm1', thread: 'th-1', human: true,  listened: true  })); // 不进 Eval\nconsole.log(receive({ id: 'm2', thread: 'th-1', human: false, listened: true  })); // bot 扇出但进 Eval\nconsole.log(receive({ id: 'm1', thread: 'th-1', human: true,  listened: true  })); // duplicate\nconsole.log(receive({ id: 'm3', thread: 'th-2', human: true,  listened: false })); // filtered\nconsole.log('pending =', pending); // ['m2']\n```\n\n**预期断言**：`pending` 只有 `m2`；`m1` 的 disposition 里 `fanout:['tk-1']` 且没有产生任何 Decision；`m3` 有记录但没有 Thread。对照 `tests/core-engine.spec.ts` 与 `tests/followups.spec.ts`。\n\n## 4. 实验 B · 拒绝概念自检表\n\n目标：把 11 条 Rejected concepts 变成可运行的规则检查，防止自己设计底座时把捷径加回来。\n\n```js\nconst rejected = [\n  ['Principal / Membership 实体', /principal|membership/i, '人只是 Trigger 的 actor 元数据'],\n  ['跨 Source 身份映射',          /cross.?source.?map/i,     '映射是 prompt text，不是实体'],\n  ['订阅上做准入检查',            /admission.*subscription/i, '授权只来自 Mandate'],\n  ['Correlation 参与路由',        /correlation.*rout/i,       'Subscriptions route'],\n  ['Ticket 跟随 Session 状态',    /ticket.*session.*state/i,  'Ticket 自定义 open/ended'],\n  ['Eval 等待 / 自排延迟 Trigger', /eval.*(wait|delay)/i,      '等待属于 Source']\n];\nfunction audit(lines) {\n  return lines.flatMap(line => rejected\n    .filter(([, re]) => re.test(line))\n    .map(([name, , why]) => `${name} → ${why}`));\n}\nconsole.log(audit([\n  'We add a Principal entity and map identities across sources',\n  'Correlation now routes to the right ticket'\n]));\n```\n\n**预期输出**：4 条违规提示。这个实验的价值在于把「文档里的拒绝清单」变成可以放进 CI 的约束。\n\n## 5. 自检清单\n\n- [ ] 能说出 `Intake.receive` 的四个动作顺序。\n- [ ] 能解释 `duplicate` 为什么不需要额外去重表。\n- [ ] 能指出 `basis` 字段在 L02 的用途。\n- [ ] 能画出两条路径在 Ticket 汇合的位置。\n- [ ] 能背出至少 3 条 Rejected concepts 与理由。\n\n## 6. 回到动态演示\n\n| 步骤 | 对应源码 |\n|---|---|\n| 2 去重 + scope | `src/core/intake.ts:Intake.receive` |\n| 3–4 订阅 fan-out | `src/core/model.ts:followupOwners`、`src/core/part.ts` |\n| 5 排队 | `src/core/part.ts:queueForEval` |\n| 6 gate | `src/core/evals.ts:Evals.start` |\n| 7–8 建 Mandate / Ticket | `src/core/evals.ts:accept`、`src/core/tickets.ts:Tickets.create` |\n| 14 唤醒 | `src/core/tickets.ts:Tickets.wake` |\n| 15 Correlation 不路由 | `docs/001-domain.md:Rejected concepts` |\n| 16 Ticket ended | `docs/001-domain.md:35-36,56`、`ticketStage(ticket)` |\n","doc":"# 001 Domain model\n\nThis document names the concepts of dsh-superagent and the rules each one keeps. The code, the tools the agents call, the panel and the other documents use these terms and no others. Following [000 Philosophy](000-philosophy.md), the model holds only concepts the work needs, and a business need becomes an attribute of one of them.\n\n## Flow\n\nWork moves from Trigger to Eval to execution. A Source produces Triggers. A Trigger fans out as context to the Tickets subscribed to its Threads. A person's message that reached a Ticket this way stays with that Ticket; every other Trigger enters Eval, which decides whether it asks for new work. When Eval accepts, it creates a Ticket with a Mandate. An Assignment hands the Ticket to an Executor, and results go back to the Source through a Channel.\n\n```mermaid\nflowchart LR\n  S[Source] -->|Trigger| T[Thread]\n  T -->|batch| E[Eval]\n  T -->|Subscription fan-out| K[Ticket]\n  E -->|accept with Mandate / stop| K\n  E -->|ignore / unavailable| X[recorded]\n  P[Policy change] -->|notice| K\n  K -->|Assignment| W[Executor]\n  K -->|Channel| S\n```\n\n## Concepts\n\nSource, Thread, Eval, Mandate and Subscription form the core domain; the rest supports them.\n\n| Concept | Definition | Rules it keeps | Why it exists |\n| --- | --- | --- | --- |\n| Source | A stream of events. A Source kind is a reusable implementation; a Source instance is one configuration of a kind: whether it runs and what it listens to | Holds its read position and its own bot identity. Defines what counts as an event, including conditions that only hold over time. Drops the bot's own messages and Triggers outside what it listens to before they enter the domain. Translates each Trigger into the Threads it belongs to and the Channel addresses to reply on | A restart must not replay events |\n| Trigger | One immutable event with the Source's own metadata, such as its actor | Belongs to one or more Threads. Accepting a Trigger twice creates one Ticket | The unit of audit and of idempotence |\n| Thread | Triggers in time order; the Source defines which Triggers form one Thread | At most one Eval runs on it at a time. It may have several Tickets. It holds its Subscriptions, the running Eval and its Decision history | Gives Eval a consistent view and its context |\n| Correlation | The relation between Threads that one Trigger belongs to | Adds context; never routes | Lets Eval follow related evidence |\n| Channel | The write side of a Thread; the Source defines its addresses | A Thread may have several Channels; a Ticket holds a set of them | Acknowledgements, replies, pull requests and resolved reviews are all writes |\n| Policy | The versioned assessment rules and each Source's part: who may originate work through that Source, in that Source's own identities, how the list is synchronized, and which bots may make candidates | The Policy version covers the rules, the accept mode and the Source parts. A change that bears on a live Ticket, such as a change to a rule it was accepted under, is delivered to its Assignment; it does not revoke Mandates. Identities on different Sources are never mapped to each other | When the rules change, a running Eval must be discarded |\n| Eval | The judgement on a batch of Triggers, in two layers: gate and assessment | Input: the Trigger batch, a Thread snapshot, every Ticket on the Thread including ended ones, and the current Policy. Output: a Decision. Holds no state | Decides whether new work starts, goes on or stops |\n| Mandate | What an accept grants: the Policy version, the scope, the strength, the matched rules, the sender's identity on that Source and how the Source received the Trigger | Immutable; wider scope means a new Ticket. A Ticket's end does not end it: only a person's stop withdraws it, and a Policy that no longer holds it revokes it. Revalidated against the current Policy before an ended Ticket resumes | States why the work may be done, and how far it may go |\n| Ticket | A unit of authorized work | Only Eval creates one. Refers to its Mandate; holds its Channels and Inputs. Goes open → ended, and back to open when a person's message on one of its Threads resumes it, unless a person stopped it. Defines its own state instead of following the Executor's | Owns the execution and its reports |\n| Assignment | The binding of a Ticket to one Executor instance | A Ticket has several over time. Goes pending → running → ended independently of the Ticket. Only its final report may end the Ticket on the Executor's side | The Executor is outside the domain, but who executes must be inside it |\n| Subscription | A many-to-many relation between Tickets and Threads, held by the Thread | A matching Trigger fans out to every live subscribed Ticket, with no check of who sent it; a person's message that reaches a Ticket this way takes no Eval. A Thread an Executor follows for context reaches its Ticket the same way, but lends it no authority and does not resume it. An ended Ticket keeps its Subscriptions, including that of a pull request that closed or merged: a person's message resumes it under the same Mandate, with no Eval or Decision; messages from bots and CI do not reach it, since its Executor reads its Threads again when it resumes. A Ticket a person stopped receives nothing. The main Session attaches a Thread to an existing Ticket only when its message points at that Ticket explicitly. A person can drop every Subscription on a Thread; an Executor can drop only its own Ticket's Subscription to a Thread it finds unrelated, except the Thread its Ticket started on and a Thread a Source made it follow, such as its pull request's | Later discussion reaches the Executor without anyone mentioning the agent again |\n\nA person is not a domain concept. A Trigger carries its actor's identifier as the Source gives it. An allowed list is a Source's part of the Policy, in that Source's identities. That one person has accounts on several Sources is prompt text that the agents read when they need it.\n\nThe Executor, with its Sessions and directories, is outside the domain and connects through Assignments.\n\nAggregates: a Source holds its read position. A Thread holds its Subscriptions, its running Eval, which runs serially and merges Triggers that arrive meanwhile into the next batch, and its Decision history. A Ticket holds its Assignments, Channels and Inputs, and refers to Decisions by id.\n\n## Rejected concepts\n\n| Rejected | Reason |\n| --- | --- |\n| Principal or Membership as an entity, or mapping identities across Sources | A person is Trigger metadata; an allowed list is a Source's part of the Policy; a cross-Source mapping is prompt text |\n| Eval scheduling its own delayed Triggers | A condition that needs waiting is an ordinary Source, so Eval never depends back on Sources |\n| Waiting or revoked Eval states | Waiting belongs to Sources; an Eval that runs out of time queues its Triggers again, or ends `unavailable` |\n| At most one live Ticket per Thread | One Thread can carry several independent pieces of work; the assessment avoids duplicates from the Ticket list |\n| An \"append to Ticket\" Decision | Appending is Subscription fan-out and needs no Eval |\n| Admission checks on Subscriptions | A Subscription covers the whole Thread; the Mandate separates authorization from context |\n| Correlation that routes | Subscriptions route; Correlation only adds context |\n| Ticket state that follows the DSH Session | A Ticket can be handed off, resumed, or run by several Executors, so it defines its own state |\n| An Executor declaring that a person asked it to stop | Only Eval decides the strength of an end |\n| Cancelling running Tickets on a Policy change | A cancelled change leaves half-finished work; the change is recorded and delivered instead |\n| Locking all of an Executor Session's tools when it fails or blocks | It would refuse a person working directly in the Session, and the report after recovery; pausing automatic input is enough |\n| Inferring \"waiting on a person\" from a report's free text | The classification needs structured facts; the Executor asks through a structured field |\n\n## What is reusable\n\nThe concepts above and their rules are reusable. The Source implementations, the Policy contents, the Executor and the Channel implementations belong to a deployment. Each Source keeps its own words internally, such as message, chat or notification, and translates them into Triggers.\n\n| Part | In this repository |\n| --- | --- |\n| Source | Feishu: live events, history recovery, polling of subscribed topics. GitHub: notifications, subscribed Issues and pull requests, CI changes, pull requests merged or closed, and, where switched on, every new Issue, pull request and comment in the repository and the default branch's CI |\n| Policy | Assessment rules, and each Source's allowed list, its sync, its bot list and its admission table |\n| Executor | A DSH Executor Session and a directory per Ticket, in an execution environment whose variables the Executor and the Sources register |\n| Channel | Feishu topic replies, GitHub comments and review thread replies |\n\n## Glossary\n\nA reference list of the terms this and the later documents use, with their Chinese names; the later documents explain the terms not introduced above. The panel shows one language at a time; its (?) button opens this glossary with both languages. The messages agents send to people on GitHub and Feishu use plain language, not these terms.\n\n| Term | 中文 | Meaning |\n| --- | --- | --- |\n| Agent | 智能体 | The automated team member dsh-superagent runs, acting on Sources through identities such as a GitHub account and a Feishu bot |\n| Main Session | 主 Session | The DSH Session that evaluates Triggers, accepts and dispatches Tickets, and replies; `orchestrator` in code and prompts |\n| Executor Session | 执行器 Session | The DSH Session an Executor runs for one Ticket; `worker` in code and prompts |\n| Source | 来源 | A stream of events: a kind that a plugin provides, plus one instance configuration |\n| Trigger | 触发 | One immutable event from a Source |\n| Thread | 线程 | Triggers in time order; the unit within which Evals run one at a time |\n| Correlation | 关联 | The relation between Threads that share a Trigger; it adds context only |\n| Channel | 渠道 | The write side of a Thread |\n| Policy | 策略 | The versioned rules for accepting work, and each Source's part of it, such as who may ask for work there |\n| Policy version | 策略版本 | The identifier of one combination of rules, Source parts and accept mode; every Mandate records it |\n| Eval | 评估 | The process that turns a batch of Triggers into a Decision |\n| Gate | 准入 | The deterministic first layer of Eval: who may originate work, and with what strength |\n| Assessment | 研判 | The model's judgement during Eval |\n| Decision | 决定 | The result of Eval |\n| Mandate | 授权 | What an accept grants: strength, scope and the Policy version it relied on |\n| Ticket | 工单 | A unit of authorized work |\n| Assignment | 派工 | The binding of a Ticket to one Executor instance |\n| Subscription | 订阅 | The relation between a Ticket and a Thread |\n| Fan-out | 扇出 | Delivering Triggers of a subscribed Thread to a Ticket as context |\n| Executor | 执行器 | The port that runs Assignments: one Executor Session and one directory per Ticket |\n| Execution environment | 执行环境 | Where Executor Sessions and the prepare command run: variables that the Executor and the Sources register, each with a key, a value and a description |\n| Report | 报告 | The state an Assignment reports to its Ticket |\n| Attention | 待人工决定 | A question on a Ticket that waits for a person's answer |\n| Disposition | 去向 | The record of a Trigger being filtered, evaluated or fanned out |\n| Input | 输入 | Context delivered to a Ticket: fanned-out Triggers, Policy changes, resumes and text |\n| Scope | 范围 | The work a Mandate allows |\n| Strength | 强度 | How strong the basis of a Mandate or an Eval is |\n\n| Group | Values |\n| --- | --- |\n| Decision | accept 接单 · stop 停止 · ignore 忽略 · unavailable 未完成 |\n| Strength | explicit 明确 · inferred 推断 |\n| Assignment | pending 待启动 · running 执行中 · ended 已结束 |\n| Report | progress 进展 · waiting 等待 · ready 就绪 · blocked 受阻 · failed 失败 · dropped 无需处理 |\n"},"L02":{"readme":"# L02 · 授权与主动性\n\n> 对应原型原文：`dsh-superagent-prototype/docs/002-authorization.md`\n> 先修：L01（领域词汇与两条路径）。\n\n## 这课学什么\n\nL01 建好了词汇，L02 回答「谁可以让工作开始，这份工作能包含什么」。核心一句话：**宿主强制允许名单、规则与 Mandate；消息、评论、引用文档都只是判断的输入，不能改变权限**。\n\n这课把三件事拧成一条链：`gate`（确定性准入）→ `assessment`（模型研判 + accept mode）→ `Mandate`（不可变授权），并补上结束后的 `revalidate`。\n\n## 三个问题\n\n1. `explicit` / `inferred` / `not admitted` 分别由哪条规则判定？\n2. `observe` 与 `auto` 差在哪，为什么 inferred 的 accept 一定要 assessment？\n3. 只有哪三个操作能改变 Mandate？resume 前 revalidate 检查什么？\n\n## 课程材料\n\n| 文件 | 用途 |\n|---|---|\n| `README.md` | 本文件 |\n| `TUTORIAL.md` | 精读 `sources/registry.ts` 的 scope / `src/policy.ts` / `admission.ts` / `core/evals.ts` + 2 个可运行实验 |\n| `index.html` + `data.js` | 15 个模块、17 步流转、Mandate 生命周期状态机、6 个真实代码锚点 |\n\n## 学习路径\n\n1. 读 `docs/002` 的 **Two paths for a Trigger** 与 **Strength**，再读 Admission、Accept mode、Resume and stop；别跳过 `:119` 那句 `Source configuration is separate from Policy` —— scope 是 gate 之前的第 0 道闸，见 `TUTORIAL.md` 2.0。\n2. 播放动态演示：第 1–6 步是 gate 的输入与 admission table；第 7–10 步是 Eval → assessment → accept；第 15–17 步是 stop 与 revalidate。\n3. 精读 `TUTORIAL.md`，尤其 `settingsPolicy.gate` 的优先级顺序。\n4. 跑两个实验：准入表复刻、Mandate 三操作与 revalidate。\n\n## 动态演示怎么看\n\n- 第 12 步 `Subscription → Ticket` 标了「绕过 gate，不给权」—— 和 L01 第 4 步是同一条规则，这里从授权角度再看一次。\n- 第 6 步 `Policy → Gate` 是 `config` 类型：accept mode 是配置，不是消息。\n- 第 17 步 `Revalidate → Eval` 说明失败后消息被视为「未达任何 Ticket」，重新走 Eval。\n- 状态机只有 5 个节点：`absent → granted → held`，出口只有 `withdrawn` 与 `revoked`。\n\n## 验收标准\n\n- [ ] 画出 admission table 的三行三格，并说明哪些格只在「收全部消息」的范围可用。\n- [ ] 说出飞书与 GitHub 在 `listened` 上的相反默认，以及 GitHub 映射不出行时这条消息落到哪三格。\n- [ ] 解释为什么 `off` 挡不住显式请求。\n- [ ] 说出 `MandateBasis.via` 的五种取值，以及每种在 revalidate 时的额外条件。\n- [ ] 解释「人在 Thread 说 stop」与「面板 Stop」的区别。\n- [ ] 说明 Policy version 变化时正在运行的 Eval 与 live Ticket 分别会怎样。\n\n## 与前课的关系\n\n承接 L01 的 `Eval`、`Mandate`、`Ticket`、`Subscription`（图中淡色块）。本课新增 gate / admission table / Policy / assessment / Router / revalidate / handback / 面板 stop。\n\n## 易错点速查\n\n| 误解 | 正确理解 |\n|---|---|\n| `off` 什么都不接 | `Explicit requests work in every mode`；off 只挡 inferred |\n| scope 属于 Policy | `Source configuration is separate from Policy`（`docs/002:119`）；`listened` 在 intake 就把消息 `filtered` 掉了，Policy 只拿到剩下的 |\n| GitHub 没配的行 = 不接收 | GitHub 的 `listened` 恒为 `true`（`github.ts:61`）；映射不出 `row` 只是退回 `ADMISSION_DEFAULTS`，真正白名单拒收的是飞书（`chat_not_allowed`） |\n| `not_human` 就是「不是人发的」 | `policy.ts:173`（actor 不在 bot list）与 `:175`（scope 不听，或未点名且该范围不全收）共用同一个 reason |\n| 被 scope 挡掉 = 丢弃 | 仍 `save(trigger)` 并存 `{ filtered: { code }, fanout: [] }` 的 disposition —— 不进 Eval，但可审计、可当上下文 |\n| 订阅绕过 gate = 获得权限 | `bypasses the gate and grants no new authority` |\n| 人在 Thread 说 stop 就停 | 那只是普通 Trigger，由 Eval 决定；面板 Stop 才是命令 |\n| Policy 改了立即撤销 Mandate | 只丢弃运行中的 Eval、给受影响票发 `policy-changed` Input；撤销发生在 resume 前的 revalidate |\n\n## 源码坐标\n\n```\ndocs/002-authorization.md          Strength / Admission / Accept mode / Resume and stop（:119 是 scope 与 Policy 的分界）\nsrc/core/ports.ts                  ScopeResult / SourceScope / GateResult / Policy.revalidate\nsrc/sources/registry.ts            scope（:124-131）/ resolve（:134，配置坏掉即视为禁用）/ channelAllowed（:75）\nsrc/sources/feishu.ts              feishuKind.scope（白名单）/ channel.allowed（复用 scope）\nsrc/sources/github.ts              githubKind.scope（恒 listened）/ scopeOf / OBSERVED 四个全收开关\nsrc/core/intake.ts                 :25-28 listened 为假即 filtered（仍落库）\nsrc/policy.ts                      settingsPolicy.gate / machineGate / admissionOf / assessmentOutcome / policyVersion\nsrc/admission.ts                   ADMISSION_DEFAULTS\nsrc/core/model.ts                  MandateBasis / Strength / AcceptMode\nsrc/core/evals.ts                  decide / accept（notExplicit 守卫）\ntests/policy.spec.ts               off / observe / auto 与显式 cell 的组合断言\n```\n\n## 下一步\n\nL03 把这张被接下的票送进执行：stage 派生、worker slot、事务内入队、Effects 退避与 Outbox 幂等。\n","tutorial":"# L02 代码教程 · 授权与主动性\n\n片段逐字抄自 `dsh-superagent-prototype`。实验代码是纯 JS，可直接在浏览器控制台运行。\n\n## 1. 源码地图\n\n| 路径 | 符号 | 看什么 |\n|---|---|---|\n| `src/sources/registry.ts` | `SourceRegistry.scope` / `resolve` | gate 之前的第 0 道闸；`listened` 的四种失效方式 |\n| `src/sources/feishu.ts` | `feishuKind.scope` | 白名单式接收：`chat_not_allowed` / `direct_messages_not_allowed` |\n| `src/sources/github.ts` | `githubKind.scope` / `scopeOf` / `OBSERVED` | 恒 `listened: true`，只分级 `observed` |\n| `src/policy.ts` | `settingsPolicy.gate` / `machineGate` / `assessmentOutcome` / `policyVersion` | 准入优先级、研判校验、版本哈希 |\n| `src/admission.ts` | `ADMISSION_DEFAULTS` | 三格默认值 |\n| `src/core/ports.ts` | `ScopeResult` / `SourceScope` / `GateResult` / `Policy.revalidate` | 端口签名 |\n| `src/core/model.ts` | `MandateBasis` / `Strength` / `AcceptMode` | 授权依据与强度枚举 |\n| `src/core/evals.ts` | `decide` / `accept` | 越权接单拦截、Mandate 组装 |\n| `tests/policy.spec.ts` | 各组合断言 | 可直接当规格书读 |\n\n## 2. 逐段精读\n\n### 2.0 Source scope —— gate 之前的第 0 道闸\n\n`docs/002-authorization.md:119` 把这条边界写得很硬，别把它和 Policy 混起来：\n\n```\nSource configuration is separate from Policy. It controls what enters the system: which chats are read and whether a scope receives all messages or only mentions.\n```\n\n内核只声明一个端口（`src/core/ports.ts:10-13`），返回值三个字段就是 scope 的全部语义：\n\n```ts\nexport type ScopeResult = { listened: true; observed: boolean; row?: string } | { listened: false; reason: string }\n/** Source configuration as the domain sees it: listening scope per trigger or per recorded Mandate basis. */\nexport interface SourceScope {\n  scope(input: { source: string; meta: Record<string, unknown> }): ScopeResult\n}\n```\n\n- `listened` —— 这条消息收不收；不收就带 `reason`。\n- `observed` —— 收不收**没 @ 智能体**的消息，也就是「全收」开关。\n- `row` —— 用准入表的**哪一行**判它；下一节那张表的行就是这么来的。\n\n实现者是 `SourceRegistry`（`src/sources/registry.ts:124-131`，类声明 `implements SourceScope`）。它自己几乎不判断，四步之后把活儿交给 kind：\n\n```ts\n    if (!kind) return stored ? { listened: false, reason: 'source_not_installed' } : { listened: true, observed: false }\n    const instance = this.resolve(kind, stored)\n    if (!instance.enabled) return { listened: false, reason: 'source_disabled' }\n    return kind.scope ? kind.scope({ meta: input.meta }, instance.config) : { listened: true, observed: false }\n```\n\n三个细节：① 插件缺失**分两种** —— 存过配置说明装过又卸了才拒（`source_not_installed`），冷启动没配置过时直接放行，不误杀第一批；② `resolve()`（`:134`）里 `enabled: parsed.success && (stored?.enabled ?? true)`，**存储配置解析失败等于禁用**，fail-closed；③ 没有 `scope` 的 kind 默认「全收但不观察」（`src/sources/kind.ts:97` 注释）。\n\n它在 intake 里落地（`src/core/intake.ts:25-28`），注意顺序在去重之后：\n\n```ts\n    const filter = this.options.scope.scope(trigger)\n    if (!filter.listened) {\n      this.repo.triggers.save(trigger); this.repo.triggers.saveDisposition(trigger.id, { filtered: { code: filter.reason }, fanout: [], at })\n      return 'filtered'\n    }\n```\n\n**「不收」不等于「丢弃」**：Trigger 照样落库，只多一条 `{ filtered: { code }, fanout: [] }` 的 disposition —— 可审计、仍可当 Thread 上下文读，但不扇出、不进 Eval。\n\n### 2.0.1 两个 kind 的相反默认（本课最容易答错的地方）\n\n飞书是**白名单**（`src/sources/feishu.ts:54-58`）：\n\n```ts\n    if (meta.direct === true) return config.directMessages ? { listened: true, observed: false, row: 'direct' } : { listened: false, reason: 'direct_messages_not_allowed' }\n    const chat = config.chats.find(item => item.chatId === meta.chatId)\n    if (chat) return { listened: true, observed: chat.listen === 'all', row: chat.chatId }\n    return config.otherChats === 'mentions' ? { listened: true, observed: false, row: 'other' } : { listened: false, reason: 'chat_not_allowed' }\n```\n\nGitHub 是**全收 + 分级 observed**（`src/sources/github.ts:59-61`，注释 `:59`：\"What the Source observes across the repository it receives in full; elsewhere, only what addresses the agent.\"）：\n\n```ts\n  scope: ({ meta }, config) => {\n    const row = scopeOf(meta)\n    return { listened: true, observed: row !== undefined && config[OBSERVED[row]], ...row ? { row } : {} }\n  },\n```\n\n于是两个「没有对应配置」的结局完全不同，别混：\n\n| 情形 | 结果 | 落点 |\n|---|---|---|\n| 飞书群不在 `config.chats`、`otherChats: none` | `listened: false` / `chat_not_allowed` | intake 里 `filtered`，根本不进 gate |\n| GitHub 的 meta 映射不出行（`scopeOf` 返回 `undefined`，如 `github.ts:33` 那种没有 `meta.branch` 的 CI） | `listened: true`、`observed: false`、**无 `row`** | 进 gate，`admissionOf`（`policy.ts:138-139`）因 `row === undefined` 退回 `ADMISSION_DEFAULTS` |\n\n**GitHub 的「没有行」= 按默认三格，不是「不接收」。** 而且 `listened` 一旦为假，人和机器的失效点也不同：机器的 `machineGate`（`policy.ts:175`）要求 `listened && (addressed || observed)`，人的那一支（`:200`）只在**未点名**消息上用 `observed` 决定是否查表 —— 点名消息即使 `listened: false` 也照样能查出 `explicit`。这只是纵深防御：新消息早在 intake 就被 `filtered` 了，gate 里还会再看到「不听」的情况是 resume 前的 revalidate（`policy.ts:217` 拿 Mandate basis 里记的 `scope` 重算）。**执行「不听」的那道闸在 intake，不在 gate。**\n\n顺带两个 `reason` 撞车的坑：`policy.ts:173`（actor 不在 bot list）和 `:175`（scope 不听 / 没点名又不全收）**都返回 `not_human`**，排障时看不出区别。所以「群里 bot 的消息报 not_human」有两解，先用 scope 的 reason 排除前者。\n\n最后，scope 还管**出**：`registry.channelAllowed`（`:75-79`）→ `feishuKind.channel.allowed`（`feishu.ts:60-62`）直接复用 `scope()`，注释写着 \"A reply goes only to a chat the Source still receives\"。把群从白名单撤掉，老工单的回信也发不出去。\n\n### 2.1 强度表 —— 授权来源等级，不是消息重要性\n\n`docs/002-authorization.md`：\n\n```\n| explicit | A person on the list addresses the agent, or follows up on a Thread that already has a Ticket |\n| inferred | A person not on the list follows up on a Thread with a Ticket ... |\n| not admitted | Any other bot's message, everything the admission table ignores, and every inferred case while the accept mode is `off` |\n```\n\n关键在下一句：`For an unlisted person, an explicit admission cell takes precedence even on a Thread with Tickets and works in every accept mode.` 也就是说**显式 cell 优先于 follow-up 推断**，这是实验 A 的核心断言。\n\n### 2.2 admission table —— 主动性边界\n\n```\n| On the list, not addressing the agent | inferred, ignore | inferred |\n| Not on the list, addressing the agent | explicit, inferred, ignore | ignore |\n| Not on the list, not addressing the agent | inferred, ignore | ignore |\n```\n\n- 行 = 接收范围（Feishu 各群 / 私信；GitHub new Issue / PR / comment / 默认分支 CI）。\n- 后两格只在 Source 收全部消息时可用，也就是 scope 的 `observed`：飞书取 `chat.listen === 'all'`（`feishu.ts:57`），GitHub 取 `OBSERVED[row]` 那四个开关 `observeIssues` / `observePulls` / `observeComments` / `observeCi`（`github.ts:30`，`gate` 里的判据是 `receivable`，`policy.ts:200`）。CI 没有 sender，只提供最后一格。\n- `src/admission.ts:ADMISSION_DEFAULTS` 给出 `listedUnaddressed:'inferred', unlistedAddressed:'ignore', unlistedUnaddressed:'ignore'`。\n- `settingsPolicy.gate` 的顺序：**先 `listened(sources, ...)` 拿 scope**（人的这支在 `:194`，机器的 `machineGate` 在 `:174`），行的来源就是 `scope.row`，且 `:195` 写成 `scope.listened ? scope.row : undefined`；bot 先走 `machineGate`（只放行 listed bot 与无 sender 的 CI，且必须 `listened && (addressed || observed)`）；然后 `allowed && addressed` → `via:'addressed'` explicit；**再判断 admission cell 的 explicit 优先**；最后才是 follow-up 的 `participating` 分支。\n\n### 2.3 `Evals.decide` — 代码层挡住越权接单\n\n`src/core/evals.ts`：\n\n```ts\n    if (outcome.kind === 'accept' && evaluation.strength !== 'explicit' && !this.policy().admitsInferred(outcome.rules ?? [])) {\n      throw new UserError('notExplicit')\n    }\n```\n\n`Direct accept refuses a Trigger that the gate did not admit as explicit.` 模型输出、提示词、外部文本都无法绕过这一行。对应 `docs/002` 的 `Accepting an inferred candidate always requires an assessment.`\n\n### 2.4 accept mode —— 默认 observe 是安全档\n\n```\n| `off` | Nothing inferred becomes a candidate |\n| `observe` (default) | a positive assessment is recorded as ignore marked \"would accept\", and nothing is accepted |\n| `auto` | A positive assessment of an inferred candidate accepts it |\nExplicit requests work in every mode.\n```\n\n`assessmentOutcome` 在代码里做三件事：每条 enabled rule 恰好评一次、`directionAllowed` 与 `intent_evidence` 必填、inferred 且非 auto 时返回 `{kind:'ignore', reason:{code:'observed'}, audit:{would_accept:true}}`。这让团队可以先看记录再切 auto。\n\n### 2.5 Mandate 与 revalidate —— 三个操作，五类复查\n\n`docs/002-authorization.md`：\n\n```\nOnly three operations change a Mandate: accept creates it, a person's stop withdraws it, and failed revalidation revokes it.\n- An explicit follow-up Mandate passes.\n- An inferred Mandate needs `auto` mode and its matched rules still enabled.\nA person saying \"stop\" in a Thread is an ordinary Trigger, and Eval decides stop.\n```\n\n其余三类 basis 的额外条件：`admission` 要求今天的表与成员身份仍给至少原强度；`bot` 要求 bot 仍在 bot list；`listed` 等其它要求 sender 仍在 allowed list。共同前提是 Source 仍监听原 Thread。\n\n失败时的语义很硬：`The main Session is not told it reached a worker.` 票保持 ended、丢弃等待消息、消息按「未达任何 Ticket」回 Eval。\n\n### 2.6 handback 与释放 follow-ups\n\n`docs/002` 规定：Executor 只在「越界或属于另一张票」时 handback 一次；消息只有在**没有任何 Ticket 认领**后才进入新 Eval，且候选里带各 Executor 的理由。Ticket 结束时，未被读取 / 确认 / 回答 / handback 的消息会被释放回 Eval。这一段解释了动态演示第 13–14 步为什么不能跳过。\n\n## 3. 实验 A · 准入表复刻\n\n```js\nconst DEFAULTS = { listedUnaddressed: 'inferred', unlistedAddressed: 'ignore', unlistedUnaddressed: 'ignore' };\nfunction cellValue(addressed, allowed, cell) {\n  const key = allowed ? 'listedUnaddressed' : (addressed ? 'unlistedAddressed' : 'unlistedUnaddressed');\n  return cell[key] || 'ignore';\n}\nfunction gate({ human, addressed, allowed, participating, mode = 'observe', cell = DEFAULTS, contextOnly = false }) {\n  if (!human) return { strength: 'not admitted', reason: 'not_human' };\n  if (!contextOnly && cell.unlistedAddressed === 'explicit' && !allowed && addressed)\n    return { strength: 'explicit', basis: 'admission' };          // 显式 cell 优先于 follow-up\n  if (!contextOnly && allowed && addressed) return { strength: 'explicit', basis: 'addressed' };\n  if (!contextOnly && participating) return { strength: allowed ? 'explicit' : 'inferred', basis: 'followup' };\n  const v = cellValue(addressed, allowed, cell);\n  if (v === 'ignore') return { strength: 'not admitted', reason: 'admission_ignored' };\n  if (v === 'inferred' && mode === 'off') return { strength: 'not admitted', reason: 'mode_off' };\n  return { strength: v, basis: 'admission' };\n}\nconsole.log(gate({ human: true, addressed: true,  allowed: false, participating: true, mode: 'off',\n                   cell: { ...DEFAULTS, unlistedAddressed: 'explicit' } })); // explicit（off 也挡不住）\nconsole.log(gate({ human: true, addressed: false, allowed: true,  participating: false, mode: 'off' })); // not admitted\nconsole.log(gate({ human: false, addressed: true, allowed: false, participating: false }));             // not_human\nconsole.log(gate({ human: true, addressed: true,  allowed: false, participating: true, contextOnly: true })); // 走表 → ignore\n```\n\n**对照**：`tests/policy.spec.ts:53-88,109-151`；`src/policy.ts:settingsPolicy.gate`。\n\n## 4. 实验 B · Mandate 三操作与 revalidate\n\n```js\nconst LEGAL = new Set(['accept', 'humanStop', 'failedRevalidate']);\nlet mandate = null;\nfunction apply(op, basis = 'addressed') {\n  if (!LEGAL.has(op)) throw new Error('illegal operation: ' + op);\n  if (op === 'accept') mandate = { state: 'granted', basis, policyVersion: 1 };\n  if (op === 'humanStop') mandate = { ...mandate, state: 'withdrawn' };\n  if (op === 'failedRevalidate') mandate = { ...mandate, state: 'revoked' };\n  return mandate;\n}\nfunction revalidate(m, policy) {\n  if (m.state !== 'granted' && m.state !== 'held') return false;\n  if (m.basis === 'addressed' || m.basis === 'followup') return true;\n  if (m.basis === 'inferred') return policy.mode === 'auto' && policy.rulesEnabled;\n  if (m.basis === 'admission') return policy.strengthAtLeastOriginal && policy.senderStillListed;\n  if (m.basis === 'bot') return policy.botStillListed && policy.mode === 'auto' && policy.rulesEnabled;\n  return policy.senderStillAllowed;\n}\nconsole.log(apply('accept', 'inferred'));\nconsole.log('auto + rules:', revalidate(mandate, { mode: 'auto', rulesEnabled: true }));\nconsole.log('observe:', revalidate(mandate, { mode: 'observe', rulesEnabled: true }));\nconsole.log(apply('humanStop'));  // withdrawn：之后必须重新 accept\n```\n\n**预期**：`inferred` 在 `observe` 下 false、在 `auto + rules` 下 true；`withdrawn` 状态不能再被 revalidate 救回。对照 `docs/002:129-141` 与 `tests/core-engine.spec.ts` 的 resume / revalidate 断言。\n\n## 5. 自检清单\n\n- [ ] 能写出 gate 的优先级顺序，并解释显式 cell 为什么插在 follow-up 之前。\n- [ ] 能说出 `ScopeResult` 的三个字段各自被谁消费（`listened` → intake 的 `filtered` 与 resume 前的 revalidate；`observed` → gate 的 `receivable`；`row` → 准入表的行），并举出 GitHub 与飞书在 `listened` 上的相反默认。\n- [ ] 能说出 `assessmentOutcome` 的三条校验。\n- [ ] 能列出改变 Mandate 的三个操作。\n- [ ] 能解释 Policy version 变化为什么丢弃运行中的 Eval 却不立即撤销 live Ticket。\n- [ ] 能说清 handback 之后消息重新进 Eval 的条件。\n\n## 6. 回到动态演示\n\n| 步骤 | 对应源码 / 文档 |\n|---|---|\n| 1 之前 · `listened` 过滤（图上没画的那道闸） | `src/core/intake.ts:25`、`src/sources/registry.ts:124`、`src/sources/feishu.ts:54` / `github.ts:59` |\n| 4–6 admission / mode / gate | `src/policy.ts`、`src/admission.ts`、`docs/002:56-101` |\n| 7 GateResult | `src/core/ports.ts` |\n| 8–9 assessment / route | `src/policy.ts:assessmentOutcome`、`prompts/dispatch.md` |\n| 10 accept → Mandate | `src/core/evals.ts:accept` |\n| 12 订阅绕过 gate | `docs/002:20` |\n| 13–14 owner / handback | `src/core/model.ts:followupOwners`、`docs/002:28-34` |\n| 15 stop | `docs/002:129,143-144` |\n| 16–17 revalidate | `src/core/ports.ts:Policy.revalidate`、`docs/002:131-141` |\n","doc":"# 002 Authorization\n\nAuthorization determines who may start work and what that work may include. This document builds on [001 Domain model](001-domain.md).\n\nThe host enforces allowed lists, rules and Mandates. Messages, comments and quoted documents are inputs to a decision; they cannot change those permissions.\n\n## Two paths for a Trigger\n\n### Eval: deciding whether to start work\n\nThe Source records whether a message addresses the agent: `mention` for a mention of the bot or agent account, and `direct` for a direct message. The gate checks the sender and the Source's Policy:\n\n- An allowed person who addresses the agent makes an explicit request.\n- A person's follow-up on a Thread with Tickets follows the rules below.\n- Other human messages use the admission table for their receiving scope.\n- A bot on the Source's bot list can produce an inferred candidate, never an explicit request. Other bots are not admitted.\n\n### Subscriptions: continuing existing work\n\nEvery message on a subscribed Thread reaches its subscribed Tickets as context, including messages from bots and CI. This delivery bypasses the gate and grants no new authority. Each Ticket remains limited by its Mandate.\n\nA person's message on a Ticket's own Thread belongs to that Ticket's Executor to decide. The same applies when the main Session attaches a message to a Ticket. While an Executor owns the message, it takes no Eval and gets no Decision. Each Executor either handles the request within its Ticket's scope or hands it back for routing elsewhere.\n\nOwnership continues while the Ticket is live, even if a person removes its Subscription. It also covers an ended Ticket that was not stopped by a person and has the message waiting to resume it.\n\nThe main Session receives a follow-up notice. While an Executor owns the message, the main Session may only stop work on the person's request; accept, attach, ignore and requeue are refused. A stop still passes through the gate with the follow-up strength described below.\n\n### Handing back and releasing follow-ups\n\nAn Executor hands a message back once when it asks for work beyond the Ticket's scope or belongs to another Ticket. The Ticket keeps its Subscription. If an attached Thread is unrelated, the Executor hands back the messages it owns there.\n\nA message goes to a fresh Eval only after no Ticket still owns it. Its candidate includes the Executors' reasons. The gate judges it as an ordinary message on that Thread, and the main Session can accept it, attach it elsewhere or ignore it. Handing back a message the Ticket did not own, such as a bot message or one a person already sent to Eval, queues nothing.\n\nWhen a Ticket ends, it releases follow-ups its Executor did not read or take up. These include messages never delivered to the Executor and messages delivered after its last Report or turn end, provided it neither acknowledged, answered nor handed them back. Each released message goes to Eval when no other Ticket owns it. A stop ends only the stopped Ticket's work.\n\nA stopped Ticket does not send its stop message to Eval again unless another Ticket handed it back. The main Session that stopped it may accept the rest of the message as new work.\n\nA person can send an owned follow-up to Eval from the panel. If the main Session then attaches it back to a live Ticket, the Executor receives it again. The panel also offers re-evaluation when no effective judgement covers the message.\n\n### Context-only subscriptions\n\nAn Executor can follow a related Thread, such as another Issue or pull request, for context. Its messages reach the Ticket but grant no authority or follow-up strength. Human messages there do not resume an ended Ticket unless the main Session attaches a message from that Thread. Notes from the main Session about other work are also context only.\n\nHuman messages that reach no Ticket, including Threads whose Tickets were stopped by a person, take the Eval path. Bot messages take that path independently of their delivery to subscribed Tickets.\n\n## Strength\n\n| Strength | Cases |\n| --- | --- |\n| explicit | A person on the list addresses the agent, or follows up on a Thread that already has a Ticket; a cell of the admission table set to explicit request |\n| inferred | A person not on the list follows up on a Thread with a Ticket, unless their cell of the admission table is explicit; a cell of the admission table set to inferred candidate; a message of a bot on the Source's bot list that addresses the agent or arrives where the Source receives every message |\n| not admitted | Any other bot's message, everything the admission table ignores, and every inferred case while the accept mode is `off` |\n\nFor an unlisted person, an explicit admission cell takes precedence even on a Thread with Tickets and works in every accept mode. Otherwise their follow-up is inferred and is not admitted in `off` mode. Messages on Threads followed only for context use the admission table instead of follow-up strength.\n\n## Admission\n\nEach Source's Policy has an admission table. Its rows are receiving scopes:\n\n- **Feishu:** each configured chat, other chats the bot receives mentions from, and direct messages. Other chats are received only when **其他群** is set to **仅 @** on the Feishu card.\n- **GitHub:** new Issues, new pull requests, comments and the default branch's CI.\n\nA row has up to three cells. Each cell decides whether a message becomes an explicit request, an inferred candidate or nothing:\n\n| Cell | Choices | Default |\n| --- | --- | --- |\n| On the list, not addressing the agent | inferred, ignore | inferred |\n| Not on the list, addressing the agent | explicit, inferred, ignore | ignore |\n| Not on the list, not addressing the agent | inferred, ignore | ignore |\n\nCells for unaddressed messages are available only where the Source receives every message, such as a Feishu chat set to **全部消息** or a GitHub scope with its receive-all switch enabled. A CI result has no sender, so its row offers only the last cell. Bot messages use the bot list instead of these cells.\n\nSetting the unlisted-addressed cell to explicit lets anyone in that scope request work by mentioning the agent. This can be useful for a dedicated support chat. Inferred candidates still depend on the accept mode. Follow-ups normally bypass this table, except that an explicit cell still grants explicit strength.\n\nThe admission table is part of the Policy version. Weakening a cell does not immediately stop open Tickets accepted under it. It can revoke their Mandates when they are revalidated before resuming.\n\n### Bots and automated reviewers\n\nThe host recognizes GitHub Apps, logins ending in `[bot]`, and Feishu bots as bots. A Source can list bots such as `dependabot[bot]` whose messages may become inferred candidates. They must either address the agent or post in a scope that receives every message. They cannot make explicit requests or stop Tickets.\n\nAn automated reviewer using an ordinary account counts as a person to the host. Its comments reach subscribed Tickets and generate follow-up notices. Team prompt text must identify such accounts as automated reviewers.\n\n## Routing candidates\n\nThe main Session routes explicit candidates with `orchestrator_route`. One call can contain several accept, attach, stop or ignore decisions. Each item is processed independently: a refused item or a missing field does not prevent the others from running.\n\nAn inferred candidate normally needs a full assessment. There is one shortcut: if its card clearly touches no enabled rule, such as plain chat or unrelated discussion, the main Session may ignore it directly. The Decision records `ignoredFromCard` to distinguish this from a rule assessment. The main Session reads the enabled rules in its Policy prompt section.\n\nAccepting an inferred candidate always requires an assessment. Direct accept refuses a Trigger that the gate did not admit as explicit.\n\n## Accept mode and rules\n\nThe accept mode is part of the Policy:\n\n| Mode | Effect |\n| --- | --- |\n| `off` | Nothing inferred becomes a candidate, such as an unaddressed message, a bot's message or the follow-up of a person not on the list |\n| `observe` (default) | Inferred candidates are assessed; a positive assessment is recorded as ignore marked \"would accept\", and nothing is accepted |\n| `auto` | A positive assessment of an inferred candidate accepts it |\n\nExplicit requests work in every mode. Start in `observe` and switch to `auto` after reviewing the recorded Decisions. Each assessment judges every enabled rule exactly once, whether it matches or not. A proactive accept requires at least one matching rule.\n\nEach rule describes a kind of proactive work. The Ticket's Mandate records the matched rules, and its Executor receives their names and instructions.\n\nFor that Ticket, a rule's process and communication requirements override the defaults. A silence rule can suppress an acknowledgement; a review rule can name the required reviewer and approval before merge. Requirements that apply to every Ticket belong in team prompt sections instead.\n\n## Policy version\n\nRules, accept mode and each Source's Policy form the Policy version. Every Mandate records the version under which it was accepted.\n\nA version change discards running Evals and queues their Triggers again. It also sends a policy-changed Input to each affected live Ticket. The Input explains whether:\n\n- a matched rule changed, including its new text, or no longer applies;\n- the requester may no longer start work; or\n- proactive work is no longer accepted, for example because the mode changed from `auto`.\n\nUnaffected Tickets receive no notice. The change does not immediately revoke live Tickets' Mandates.\n\nSource configuration is separate from Policy. It controls what enters the system: which chats are read and whether a scope receives all messages or only mentions. A Mandate records its Source and receiving scope. Resuming needs the Source to still listen to the Thread, but does not require it to still receive every message there.\n\nReplies wait while their Source is off. They are dropped if the Source no longer listens to their destination.\n\nA condition on what the Executor may do with its own result, such as when it may merge, does not decide who may authorize work. It is part of the agent's instructions, not of the Policy.\n\n## Resume and stop\n\nAn ended Ticket keeps its Mandate. A person's message on one of its own Threads can resume the same work without a new Eval or Decision, regardless of who sent it. Bots and CI do not wake ended Tickets. The Executor decides whether the request fits the scope and ends the round if it does not.\n\nOnly three operations change a Mandate: accept creates it, a person's stop withdraws it, and failed revalidation revokes it. A Ticket stopped by a person stays ended and receives nothing more. Work requested there needs a new accept.\n\n### Revalidation before resume\n\nThe Source must still listen to the original Thread. The remaining checks depend on the Mandate's basis:\n\n- An explicit follow-up Mandate passes.\n- An inferred Mandate needs `auto` mode and its matched rules still enabled.\n- A Mandate admitted by a table cell must still receive at least its original strength under today's table and sender membership. Removing a sender from the list can therefore revoke a Mandate accepted through the listed-sender cell.\n- A bot's Mandate requires that bot to remain on the Source's bot list. Inferred table and bot Mandates also need `auto` mode and enabled matched rules.\n- Other Mandates require the sender to remain on the Source's allowed list.\n\nIf revalidation fails, the Ticket stays ended and takes none of its waiting messages. Each message is treated as having reached no Ticket; if no other Ticket owns it, it goes to Eval. The main Session is not told it reached a worker. This also applies after a processing pause. Attaching to the Ticket is refused, and further work requires a new accept.\n\n- **A person saying \"stop\" in a Thread is an ordinary Trigger,** and Eval decides stop. An Executor cannot declare that a person asked it to stop.\n- **Stop in the panel is a command.** It acts on the Ticket directly and is recorded as a manual stop.\n- **Waiting conditions belong to Sources.** A condition such as \"no assignee for N hours\" would be a Source that waits and checks again itself; Eval never waits.\n\n## When Eval does not finish\n\nThe time limit starts when the candidate reaches the main Session. Time spent waiting for delivery does not count, and an undelivered candidate never expires.\n\nAn expired Eval queues its Triggers for another attempt. After two consecutive retries, the third expiry records `unavailable`. An assessment failure also records `unavailable`; a later Trigger can start a new Eval. A Policy change or a decision made against an outdated Policy records `unavailable` and immediately queues the batch under the current version.\n\nThe `evals` health entry reports unresolved unavailable Decisions from the last hour. `scripts/dsh-superagent status` includes that error.\n\nThe panel asks for human attention only when the unavailable Decision is less than 24 hours old, is still the latest Decision on its Thread, has not been dismissed, and the Thread is neither queued nor evaluating. A person can evaluate the Trigger again or dismiss the problem.\n"},"L03":{"readme":"# L03 · 执行与可靠投递\n\n> 对应原型原文：`dsh-superagent-prototype/docs/003-execution.md`（203 行，8 篇文档里信息密度最高的一篇）\n> 先修：L01、L02。\n\n## 这课学什么\n\n跟着一张被接下的 Ticket 走完执行、交付与恢复。全篇的地基是一句话：`What dsh-superagent does after a decision ... is stored first and done afterwards.` —— **状态先落盘，副作用提交后再做**。\n\n前半篇讲「执行长什么样」：stage 派生、worker slot、后台作业、prepare 命令、执行变量、结单规则。后半篇讲「出错怎么办」：失败重试、restart、stored work、Source / Channel 失败、暂停处理。\n\n## 三个问题\n\n1. 为什么 stage 不落盘，而 blocked / failed 重启后还能保持？\n2. `Later` 和普通失败有什么本质区别？为什么 effect 必须写在同一个事务里？\n3. 一个 dropped / withdrawn 的消息 id，为什么永远不会被再次排队？\n\n## 课程材料\n\n| 文件 | 用途 |\n|---|---|\n| `README.md` | 本文件 |\n| `TUTORIAL.md` | 精读 `stage.ts` / `outbox.ts` / `store.ts` / `effects.ts` / `passes.ts` + 2 个实验 |\n| `index.html` + `data.js` | 16 个模块、21 步流转、Effect Row 状态机、10 个真实代码锚点 |\n\n## 学习路径\n\n1. 读 `docs/003` 的 **Ticket stages** 表（从上往下、首行命中）与 **The Executor**。\n2. 跳到 **Stored work** 与 **Channel failure**，把「先存后做」这条主线抓出来。\n3. 播放动态演示：第 3–5 步是事务边界，第 12–16 步是 Outbox 幂等与保序，第 20 步是 Later / 退避，第 21 步是 restart 恢复。\n4. 跑 `TUTORIAL.md` 的两个实验，它们分别复刻 `tests/effects.spec.ts` 与 `tests/outbox.spec.ts` 的核心断言。\n\n## 动态演示怎么看\n\n- 第 3 步 `Assignment → Effects` 与第 4 步 `Store → Effects` 必须连着看：前者在事务**内**入队，后者是 commit 之后才 kick。\n- 第 15 步标了 `behind(id,3)`：保序只限「同一 Ticket 到同一会话」，其它票不等待。\n- 第 20 步是三类结局的分叉：成功 DELETE / Later 只推 due / 普通失败 attempts+1。\n- 状态机是 Effect Row 的生命周期，不是 Ticket 的；Ticket 阶段在右侧「当前这一步」里解释。\n\n## 验收标准\n\n- [ ] 能按优先级背出 stage 表的 7 行，并解释为什么 `ready` 落在 `person/review` 而不是 `ended`。\n- [ ] 能解释 worker slot 的「+1 给人」规则解决了什么问题。\n- [ ] 能写出 `delay = min(max, base * 2^min(attempts,16))`，并说出 `Later` 不消耗失败次数。\n- [ ] 能说明 `receipts.add` 的 `INSERT OR IGNORE` 与 `settle` 的「缺行重建」如何共同保证 id 永不重排。\n- [ ] 能说出 restart 后哪些东西留存、哪些 Assignment 会重新开始。\n\n## 与前课的关系\n\n承接 Ticket / Assignment / Stage 相关概念。新增 Store / Effects / Passes / Outbox / Receipt / WorkerSlots / prepare / 后台作业 / 执行环境 —— 这些几乎全在 `src/app/*` 与 `src/executor/*`，是**适配器**而非内核，L07 会据此切分边界。\n\n## 易错点速查\n\n| 误解 | 正确理解 |\n|---|---|\n| Ticket 有 `stage` 字段 | `ticketStage(ticket)` 是纯函数；blocked/failed 从存下的 Reports / Inputs 现算 |\n| `Later` 算一次失败 | 只推 `due`，不增 attempts、不记 error、不报 health |\n| blocked/failed 就不能再操作 | 不自动收 Input，但工具仍可用，人可以直接在 Session 里继续 |\n| `ready` 一定结单 | 有 follows 时要等它打开的 PR 全关闭，面板此时显示 Awaiting review |\n| dropped 消息可以重发 | 记录保留（含时间与原因），id 永久占用 |\n\n## 源码坐标\n\n```\ndocs/003-execution.md            stages / Executor / Stored work / Failure and recovery\nsrc/core/stage.ts                ticketStage / canRetry\nsrc/app/outbox.ts                send / deliver（reply handler、Later、settle）\nsrc/app/store.ts                 atomic / afterCommit / receipts.add / behind / settle\nsrc/app/effects.ts               enqueue / dispatch / attempt / Later\nsrc/app/passes.ts                start / pumpOnce\nsrc/executor/dsh.ts              WorkerSlots / prepare / resume\ntests/effects.spec.ts            事务回滚与 Later 断言\ntests/outbox.spec.ts             幂等与保序断言\n```\n\n## 下一步\n\nL04 换一个视角：这些规则怎么变成模型读到的 system prompt，以及为什么提示词文本改不了它们。\n","tutorial":"# L03 代码教程 · 执行与可靠投递\n\n片段逐字抄自 `dsh-superagent-prototype`。两个实验分别复刻 `tests/effects.spec.ts` 与 `tests/outbox.spec.ts` 的核心行为，纯 JS 可直接运行。\n\n## 1. 源码地图\n\n| 路径 | 符号 | 看什么 |\n|---|---|---|\n| `src/core/stage.ts` | `ticketStage` / `canRetry` | 纯派生阶段 |\n| `src/app/outbox.ts` | `send` / `deliver` | 收据 + effect 同事务、Later、保序 |\n| `src/app/store.ts` | `atomic` / `receipts.add` / `behind` / `settle` | 事务边界与幂等根 |\n| `src/app/effects.ts` | `enqueue` / `dispatch` / `attempt` / `Later` | (kind,key) 合并、退避、健康位 |\n| `src/app/passes.ts` | `start` / `pumpOnce` | 2 秒心跳 |\n| `docs/003-execution.md` | Ticket stages / Stored work | 规则原文 |\n\n## 2. 逐段精读\n\n### 2.1 `ticketStage` — 首行命中的纯函数\n\n`src/core/stage.ts`：\n\n```ts\nexport function ticketStage(ticket: Ticket): TicketStage {\n  if (ticket.ended) return { stage: 'ended' }\n  if (ticket.delivery) return { stage: 'person', action: 'delivery' }\n  if (ticket.attention) return { stage: 'person', action: 'answer' }\n  const assignment = latestAssignment(ticket)\n  const report = assignment?.report?.state\n```\n\n依次判断 `ended` → `delivery` → `attention` → `ready`(person/review) → `blocked|failed` → 无 Assignment/pending(working/queued) → `waiting` 或 assignment ended(idle) → 其它 working。`Ticket` 里**没有 stage 字段**，所以重启后从 Reports 与 Inputs 现算即可恢复。\n\n### 2.2 `Outbox.send` — 收据与 effect 同事务\n\n`src/app/outbox.ts`：\n\n```ts\n  send(message: OutboundMessage): void {\n    if (message.kind === 'reply' && message.channel.source === 'feishu') checkedImText(message.text)\n    const { store, effects } = this.host\n    store.atomic(() => { if (store.receipts.add(message)) effects.enqueue('reply', message.id, {}) })\n  }\n```\n\n`receipts.add` 返回 `false` 时（id 已存在）连 effect 都不会入队。这一行就是「不重」的全部。\n\n### 2.3 `receipts.add` 与 `settle` — 幂等的两端\n\n`src/app/store.ts`：\n\n```ts\n    add: (message: OutboundMessage): boolean => {\n      const receipt: Receipt = { ...message, status: 'pending' }\n      return Number(this.db.prepare('INSERT OR IGNORE INTO outbox (id, value) VALUES (?, ?)').run(message.id, JSON.stringify(receipt)).changes) > 0\n    },\n```\n\n`settle` 用 `json_patch` 只更新 `pending` 行；如果行已被 `withdraw` 删掉，它会 `INSERT OR IGNORE` 重建一条带 `dropped` 的记录 —— 于是这个 id 被永久占用，`deliver` 里 `status !== 'pending'` 直接返回。`docs/003` 原话：`A dropped acknowledgement reads as dropped, not sent.`\n\n### 2.4 `Store.atomic` — 提交边界\n\n```ts\n    this.committed[level] = []\n    this.db.exec(`SAVEPOINT ${name}`)\n    let value: T\n    try { value = operation(); this.db.exec(`RELEASE ${name}`) }\n    catch (error) { this.db.exec(`ROLLBACK TO ${name}`); this.db.exec(`RELEASE ${name}`); throw error }\n```\n\n嵌套按 `depth` 分层；回滚层丢弃该层 `afterCommit` 回调。`afterCommit` 只做内存内跟进，**不能替代 Effects**：只有落在 effect 表里的行才能跨崩溃存活。`tests/effects.spec.ts` 明确断言「runs an effect queued inside a transaction once it commits, and none from a transaction that rolled back」。\n\n### 2.5 `Effects.enqueue` / `attempt` — 合并与三分\n\n```ts\n    this.store.db.prepare(`INSERT INTO effect (kind, key, value, seq, due, since) VALUES (?, ?, ?, ?, ?, ?) ON CONFLICT(kind, key) DO UPDATE\n      SET value = excluded.value, generation = generation + 1, attempts = 0, error = '', due = excluded.due`)\n      .run(kind, key, JSON.stringify(payload), ++this.seq, this.now(), new Date(this.now()).toISOString())\n```\n\n`ON CONFLICT(kind,key)` 保留 `seq` 队位、`generation+1` 防止运行中的旧版本覆盖新 payload。`attempt` 的三分：\n\n```ts\n    if (!failure) this.store.db.prepare(`DELETE FROM effect WHERE ${own}`).run(...ownRow)\n    else if (this.stopped) return\n    else if (failure.error instanceof Later) {\n      this.store.db.prepare(`UPDATE effect SET due = ? WHERE ${own}`).run(this.now() + handler.retry[0], ...ownRow)\n    } else {\n      const delay = Math.min(handler.retry[1], handler.retry[0] * 2 ** Math.min(row.attempts, 16))\n```\n\n停机时保留 running 行，下次 `start` 续跑；`Later` 不增 attempts；普通失败指数退避，`FAILURES_BEFORE_ERROR = 3` 后才报系统问题。\n\n### 2.6 `Outbox.deliver` — 终态直接返回\n\n```ts\n    const receipt = store.receipts.get(id)\n    if (receipt?.status !== 'pending') return\n    if (!sources.instance(receipt.channel.source)?.enabled) throw new Later('The Source is off or not installed')\n    if (store.receipts.behind(id, FAILURES_BEFORE_ERROR)) throw new Later('An earlier message of this ticket to this conversation waits')\n    if (!sources.channelAllowed(receipt.channel)) { store.receipts.se
